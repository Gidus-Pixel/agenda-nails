# App nativa (Flutter) per iOS e Android.
# Ad ogni modifica in app/: analisi del codice, test, APK Android installabile, compilazione iOS,
# anteprima web e foto delle schermate sul simulatore iPhone/iPad.
# I log di ogni passo vanno nel ramo "ci-log", le schermate nel ramo "ci-schermate".
name: App iOS e Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app.yml']

permissions:
  contents: write

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

env:
  LOG: ${{ github.workspace }}/ci-log

jobs:
  verifica:
    name: Analisi, test, Android, anteprima web
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: mkdir -p "$LOG" && flutter --version | tee "$LOG/00-versioni.txt"

      - name: Genera le cartelle iOS/Android se mancano
        run: |
          set -o pipefail
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create --org it.agendanails --project-name agenda_nails --platforms android,ios,web --description "Agenda per nail artist ed estetiste" . 2>&1 | tee "$LOG/01-create.txt"
          fi
          python3 tools/prepara_piattaforme.py 2>&1 | tee -a "$LOG/01-create.txt"

      - name: Dipendenze
        run: set -o pipefail; flutter pub get 2>&1 | tee "$LOG/02-pub.txt"

      - name: Salva nel repository i file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios web pubspec.lock .metadata .gitignore 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "App: file di piattaforma generati [skip ci]"
            git push origin HEAD:main || echo "push non riuscito (non bloccante)"
          fi

      - name: Analisi del codice
        run: set -o pipefail; flutter analyze --no-fatal-infos 2>&1 | tee "$LOG/03-analisi.txt"

      - name: Test
        # fuso italiano: i test controllano i giorni del cambio dell'ora
        env: { TZ: Europe/Rome }
        run: set -o pipefail; flutter test 2>&1 | tee "$LOG/04-test.txt"

      - name: Anteprima web
        run: set -o pipefail; flutter build web --release --no-web-resources-cdn --base-href / 2>&1 | tee "$LOG/05-web.txt"

      - name: APK Android
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee "$LOG/06-apk.txt"
          cp build/app/outputs/flutter-apk/app-release.apk build/agenda-android.apk
      - uses: actions/upload-artifact@v4
        with: { name: agenda-android, path: app/build/agenda-android.apk, retention-days: 30 }

      - name: APK scaricabile dalla pagina Releases (anteprima)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view android-anteprima >/dev/null 2>&1 || gh release create android-anteprima --prerelease --title "Agenda per Android (anteprima)" --notes "APK di prova, aggiornato automaticamente a ogni modifica dell'app. Sul telefono: scarica agenda-android.apk e aprilo (consenti l'installazione da questa fonte)."
          gh release upload android-anteprima build/agenda-android.apk --clobber

      - name: Pubblica anteprima web nel ramo "anteprima"
        run: |
          cd build/web
          git init -q && git checkout -q -b anteprima
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "anteprima ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" anteprima

      - name: Log nel ramo "ci-log"
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/log && cp -r ci-log/. /tmp/log/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/log/ESITO-verifica.txt
          cd /tmp/log && git init -q && git checkout -q -b ci-log-verifica
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "log ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-log-verifica

  ios:
    name: iOS (compilazione e schermate sul simulatore)
    needs: verifica
    runs-on: macos-latest
    timeout-minutes: 80
    defaults: { run: { working-directory: app, shell: bash } }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - run: mkdir -p "$LOG" schermate && python3 tools/prepara_piattaforme.py && flutter pub get

      - name: Compilazione per iPhone (senza firma)
        run: set -o pipefail; flutter build ios --release --no-codesign 2>&1 | tee "$LOG/10-ios.txt"

      - name: Compilazione per il simulatore
        run: set -o pipefail; flutter build ios --simulator --debug 2>&1 | tee "$LOG/11-simulatore.txt"

      - name: Schermate su iPhone e iPad
        timeout-minutes: 40
        run: |
          set -e
          # ogni comando del simulatore ha un tempo massimo (a volte resta appeso)
          limite() { local s=$1; shift; perl -e 'alarm shift; exec @ARGV' "$s" "$@"; }
          APPDIR=build/ios/iphonesimulator/Runner.app
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APPDIR/Info.plist")
          xcrun simctl list devices available > "$LOG/12-simulatori.txt"
          scegli() { xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; c=[x for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('$1') and 'mini' not in x['name']]; print(c[-1]['udid'] if c else '')"; }
          for MODELLO in "iPhone" "iPad"; do
            UDID=$(scegli "$MODELLO")
            [ -z "$UDID" ] && { echo "Nessun simulatore $MODELLO"; continue; }
            limite 120 xcrun simctl boot "$UDID" || true
            limite 240 xcrun simctl bootstatus "$UDID" -b || true
            sleep 5
            limite 30 xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 || true
            limite 120 xcrun simctl install "$UDID" "$APPDIR"
            for SCHERMATA in ${SCHERMATE:-oggi agenda agenda-settimana appuntamento clienti cliente magazzino prodotto ordini appunti report impostazioni}; do
              limite 30 xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
              # la schermata da aprire: file nei Documenti dell'app (+ variabili d'ambiente)
              DATI=$(limite 30 xcrun simctl get_app_container "$UDID" "$BUNDLE" data 2>/dev/null || true)
              if [ -n "$DATI" ]; then mkdir -p "$DATI/Documents"; printf 'AGENDA_DEMO=1\nAGENDA_SCHERMATA=%s\n' "$SCHERMATA" > "$DATI/Documents/agenda-avvio.txt"; fi
              export SIMCTL_CHILD_AGENDA_DEMO=1 SIMCTL_CHILD_AGENDA_SCHERMATA=$SCHERMATA
              limite 60 xcrun simctl launch "$UDID" "$BUNDLE" >> "$LOG/13-avvio.txt" 2>&1 || echo "avvio $SCHERMATA non riuscito" >> "$LOG/13-avvio.txt"
              sleep 12
              limite 60 xcrun simctl io "$UDID" screenshot "schermate/${MODELLO}-${SCHERMATA}.png" || true
            done
            limite 60 xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Runner"' --style compact > "$LOG/14-log-${MODELLO}.txt" 2>/dev/null || true
            limite 60 xcrun simctl shutdown "$UDID" || true
          done

      - name: Schermate nel ramo "ci-schermate"
        if: always()
        run: |
          cd schermate 2>/dev/null || exit 0
          git init -q && git checkout -q -b ci-schermate
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "schermate ${GITHUB_SHA::7}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-schermate

      - name: Log nel ramo "ci-log-ios"
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p /tmp/log && cp -r ci-log/. /tmp/log/ 2>/dev/null || true
          echo "${{ job.status }} ${GITHUB_SHA}" > /tmp/log/ESITO-ios.txt
          cd /tmp/log && git init -q && git checkout -q -b ci-log-ios
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "log ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-log-ios
