# Pubblica il servizio cloud (Cloudflare Worker + database D1 nell'UE).
# Serve configurare UNA volta, in GitHub → Settings → Secrets and variables → Actions:
#   CLOUDFLARE_API_TOKEN   token Cloudflare (modello "Edit Cloudflare Workers" + permesso Account › D1 › Edit)
#   CLOUDFLARE_ACCOUNT_ID  ID dell'account Cloudflare (nella home della dashboard, colonna di destra)
#   ADMIN_TOKEN            una password lunga a tua scelta, per la pagina cloud/admin.html
# Poi: tab "Actions" → "Pubblica cloud" → "Run workflow". Si riavvia da solo a ogni modifica in cloud/.
name: Pubblica cloud

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['cloud/**', '.github/workflows/cloud.yml']

concurrency: { group: cloud-deploy, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: cloud } }
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER: npx --yes wrangler@4.147.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - name: Controllo dei segreti
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Mancano i segreti CLOUDFLARE_API_TOKEN e/o CLOUDFLARE_ACCOUNT_ID (vedi le istruzioni in cima a questo file)."
            exit 1
          fi

      - name: Database D1 nell'UE (lo crea se non esiste)
        run: |
          ID=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="agenda-cloud") | (.uuid // .id)' | head -n1)
          if [ -z "$ID" ]; then
            $WRANGLER d1 create agenda-cloud --jurisdiction eu
            ID=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="agenda-cloud") | (.uuid // .id)' | head -n1)
          fi
          echo "Database: $ID"
          sed -i "s/DA-COMPILARE-dopo-wrangler-d1-create/$ID/" wrangler.toml

      - name: Aggiorna la struttura del database
        run: $WRANGLER d1 migrations apply agenda-cloud --remote

      - name: Pubblica il Worker
        run: $WRANGLER deploy

      - name: Chiave amministratore
        env: { ADMIN_TOKEN: '${{ secrets.ADMIN_TOKEN }}' }
        run: |
          if [ -n "$ADMIN_TOKEN" ]; then printf '%s' "$ADMIN_TOKEN" | $WRANGLER secret put ADMIN_TOKEN; else echo "::warning::Segreto ADMIN_TOKEN assente: la pagina admin non funzionerà finché non lo aggiungi."; fi
