/* ===================== PERSISTENZA DELL'ARCHIVIO ===================== */
async function statoPersistenza() {
  if (!navigator.storage || !navigator.storage.persisted) return { ok: null, html: 'non verificabile su questo browser' };
  let ok = false; try { ok = await navigator.storage.persisted(); } catch (e) { /* ignorato */ }
  let spazio = '';
  try { const s = await navigator.storage.estimate(); if (s && s.usage != null) spazio = ` · in uso ${(s.usage / 1048576).toFixed(1)} MB`; } catch (e) { /* ignorato */ }
  return { ok, html: ok ? `<span class="badge badge-ok">persistente</span>${spazio}` : `<span class="badge badge-avviso">non garantita</span>${spazio}<div class="piccolo muted">Il browser potrebbe cancellare i dati se manca spazio: fai backup regolari.</div>` };
}
async function richiediPersistenza() {
  if (!navigator.storage || !navigator.storage.persist) return null;
  try { return await navigator.storage.persist(); } catch (e) { return false; }
}

/* =====================================================================================
   BACKUP E RIPRISTINO
   ===================================================================================== */
function nomeFileSicuro(s) { return normTesto(s || 'agenda').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'agenda'; }
function validaBackup(obj) {
  if (!obj || typeof obj !== 'object') throw new Error('Il file non è un backup valido.');
  if (obj.app !== APP_ID) throw new Error('Questo file non è un backup di questa agenda.');
  if (obj.tipo === 'configurazione') throw new Error('Questo è un file di configurazione, non un backup completo. Usa “Importa configurazione”.');
  if (obj.tipo !== 'backup-completo' || !obj.dati) throw new Error('Il file non contiene un backup completo.');
  if (!Number.isInteger(obj.schemaVersion)) throw new Error('Versione del backup non riconosciuta.');
  if (obj.schemaVersion > SCHEMA_VERSION) throw new Error(`Il backup è stato creato con una versione più recente dell'agenda (schema ${obj.schemaVersion}). Aggiorna il file dell'agenda prima di ripristinarlo.`);
}
async function ripristinaDaFile() {
  const file = await scegliFile('application/json,.json,.agendabak');
  if (!file) return;
  let obj;
  try { obj = await leggiBackupDaFile(file); if (obj === null) return; }
  catch (e) { toast(e instanceof SyntaxError ? 'Il file non è leggibile (JSON non valido).' : e.message, { errore: true, durata: 8000 }); return; }
  try { validaBackup(obj); } catch (e) { toast(e.message, { errore: true, durata: 8000 }); return; }
  const righe = Object.keys(ARCHIVI).filter((n) => n !== 'meta' && n !== 'impostazioni').map((n) => `<li>${esc(NOMI_ARCHIVI[n])}: <strong>${(obj.dati[n] || []).length}</strong></li>`).join('');
  const attuali = { clienti: await Repo.clienti.count(), appuntamenti: await Repo.appuntamenti.count() };
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <dl class="kv"><dt>File</dt><dd>${esc(file.name)}</dd><dt>Creato il</dt><dd>${esc(F.dataOra(new Date(obj.esportatoIl)))}</dd><dt>Attività</dt><dd>${esc(obj.attivita || '—')}</dd><dt>Versione dati</dt><dd>${obj.schemaVersion}${obj.schemaVersion < SCHEMA_VERSION ? ' (verrà aggiornata automaticamente)' : ''}</dd></dl>
    <p><strong>Contenuto del backup:</strong></p><ul>${righe}</ul>
    ${obj.conFoto === false ? '<div class="box box-info piccolo"><strong>Backup senza foto</strong>Le foto già presenti su questo dispositivo verranno mantenute.</div>' : ''}
    <div class="box box-pericolo"><strong>Attenzione</strong>Tutti i dati attuali di questo dispositivo (${attuali.clienti} clienti, ${attuali.appuntamenti} appuntamenti, impostazioni comprese) verranno SOSTITUITI dal contenuto del backup.${cloudAttivo() ? ' <strong>Il cloud è attivo: anche il cloud e gli altri dispositivi collegati passeranno a questi dati.</strong>' : ''} Prima viene creato un punto di ripristino della situazione attuale.</div>
    <button type="button" class="btn" id="rip-prima">Scarica prima un backup dei dati attuali</button>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="rip-ok"> Ho capito: i dati attuali verranno sostituiti</label>`;
  $('#rip-prima', corpo).addEventListener('click', () => eseguiBackup().catch(erroreUI));
  const m = apriModale({ titolo: 'Ripristina backup', corpo, azioni: [
    { testo: 'Annulla' },
    { testo: 'Ripristina', classe: 'btn-pericolo', onClick: async ({ el }) => {
      if (!$('#rip-ok', el).checked) { toast('Spunta la casella per confermare.'); return false; }
      await applicaBackup(obj);
      return true;
    } }
  ] });
  await m.promessa;
}
async function applicaBackup(obj) {
  try { await creaCopiaRipristino('prima'); } catch (e) { console.warn('Punto di ripristino non creato', e); }
  const dati = clona(obj.dati); // copia (le foto sono stringhe base64)
  migraDati(dati, obj.schemaVersion);
  dati.foto = obj.conFoto === false
    ? await richiesta(db.transaction('foto').objectStore('foto').getAll()) // backup leggero: tengo le foto attuali
    : (obj.dati.foto || []).map((f) => { const { dataURL, ...resto } = f; return { ...resto, blob: dataURL ? dataURLABlobSync(dataURL) : null }; }).filter((f) => f.blob);
  // dati legati a questo dispositivo: non vengono presi dal backup
  dati.meta = (dati.meta || []).filter((m) => !META_LOCALI.includes(m.id) && m.id !== 'schemaVersion' && !m.id.startsWith('elim:'));
  for (const id of META_LOCALI) { if (id === 'ultimoBackup') continue; const r = await Repo.meta.get(id); if (r) dati.meta.push(r); }
  dati.meta.push({ id: 'schemaVersion', valore: SCHEMA_VERSION });
  const ultimo = await leggiMeta('ultimoBackup'); if (ultimo) dati.meta.push({ id: 'ultimoBackup', valore: ultimo });
  if (!dati.meta.some((m) => m.id === 'seedServizi')) dati.meta.push({ id: 'seedServizi', valore: true });
  await scriviTutto(dati);
  await caricaConfig();
  disegnaMenu(); aggiornaPulsanteBlocco();
  await caricaStatoCloud();
  if (cloudAttivo()) { try { await cloudSostituisciTutto(); } catch (e) { toast('Ripristino fatto, ma il cloud non è stato aggiornato: ' + e.message, { errore: true, durata: 9000 }); } }
  toast('Backup ripristinato correttamente.', { durata: 5000 });
  statoAgenda.vista = null;
  vai('#/oggi');
}

/* ----- Esporta / importa SOLO la configurazione (per preparare nuove installazioni) ----- */
async function esportaConfigurazione() {
  // i prodotti collegati ai servizi restano fuori: appartengono al magazzino di questa installazione
  const servizi = (await Repo.servizi.list()).map(({ id, createdAt, updatedAt, demo, archiviato, prodottiDefault, ...resto }) => resto);
  const out = { app: APP_ID, tipo: 'configurazione', schemaVersion: SCHEMA_VERSION, esportatoIl: new Date().toISOString(), config: clona(cfg()), servizi };
  scaricaFile(`configurazione-${nomeFileSicuro(cfg().attivita.nome)}.json`, JSON.stringify(out, null, 2));
}
async function importaConfigurazione() {
  const file = await scegliFile('application/json,.json'); if (!file) return;
  let obj; try { obj = JSON.parse(await leggiFileTesto(file)); } catch (e) { toast('File non leggibile.', { errore: true }); return; }
  if (!obj || obj.app !== APP_ID || obj.tipo !== 'configurazione' || !obj.config) { toast('Questo file non è una configurazione dell\'agenda.', { errore: true }); return; }
  const servizi = Array.isArray(obj.servizi) ? obj.servizi : [];
  const ok = await conferma({ titolo: 'Importare la configurazione?', messaggio: `<dl class="kv"><dt>Attività</dt><dd>${esc(obj.config.attivita?.nome || '—')}</dd><dt>Servizi nel file</dt><dd>${servizi.length}</dd></dl>
    <p>Le impostazioni attuali verranno sostituite. I servizi con lo stesso nome verranno aggiornati, quelli nuovi aggiunti; nessun servizio esistente verrà cancellato. Clienti e appuntamenti non vengono toccati.</p>`, ok: 'Importa' });
  if (!ok) return;
  await salvaConfig(obj.config);
  const esistenti = await Repo.servizi.list({ archiviati: true });
  const daSalvare = [];
  servizi.forEach((s, i) => {
    if (!s || !s.nome) return;
    const e = esistenti.find((x) => normTesto(x.nome) === normTesto(s.nome));
    daSalvare.push(Object.assign(e || { archiviato: false }, normalizzaServizio(s, i), { archiviato: false }));
  });
  await Repo.servizi.putMany(daSalvare);
  await scriviMeta('seedServizi', true);
  disegnaMenu();
  toast('Configurazione importata.');
  aggiornaVista();
}
function normalizzaServizio(s, i = 0) {
  const n = (v) => (v === '' || v == null || Number.isNaN(Number(v)) ? null : Number(v));
  return {
    nome: String(s.nome || '').trim(), categoria: s.categoria || 'Altro', durata: n(s.durata) || 0,
    prezzoCent: s.prezzoCent != null ? n(s.prezzoCent) || 0 : (s.prezzo != null ? F.centDaTesto(s.prezzo) || 0 : 0),
    colore: s.colore || colore(i), cuscinetto: n(s.cuscinetto), richiamoGiorni: n(s.richiamoGiorni),
    prodottiDefault: Array.isArray(s.prodottiDefault) ? s.prodottiDefault : [], ordine: n(s.ordine) ?? i
  };
}

  let servizi = await serviziAttivi();
  if (!servizi.length) {
    const base = [
      ['Ricostruzione gel', 'Ricostruzione', 120, 5500, 21], ['Refill gel', 'Ricostruzione', 90, 4000, 21],
      ['Semipermanente mani', 'Semipermanente', 45, 2500, 14], ['Manicure', 'Manicure', 30, 1500, null],

  }
  const sv = (i) => { const s = servizi[i % servizi.length]; return { servizioId: s.id, nome: s.nome, durata: s.durata, prezzoCent: s.prezzoCent, quantita: 1, colore: s.colore, richiamoGiorni: s.richiamoGiorni ?? null }; };
  const cons = (sanitari = false) => ({ privacy: { dato: true, data: D.oggiKey() }, sanitari: { dato: sanitari, data: sanitari ? D.oggiKey() : '' }, foto: { dato: true, data: D.oggiKey() }, marketing: { dato: false, data: '' } });
  const nomi = [['Prova', 'Anna'], ['Prova', 'Beatrice'], ['Prova', 'Chiara'], ['Prova', 'Daniela'], ['Prova', 'Elena'], ['Prova', 'Federica'], ['Prova', 'Giorgia'], ['Prova', 'Ilaria']];
  const clienti = nomi.map(([cognome, nome], i) => ({ ...nuovaClienteVuota({ nome, cognome, telefono: `+3933300000${pad2(i + 1)}` }), consensi: cons(i === 1), avvertenze: i === 1 ? 'DATO DI PROVA — reazione cutanea a un primer acido' : '', preferenze: { forma: FORME[i % FORME.length], lunghezza: LUNGHEZZE[(i + 1) % LUNGHEZZE.length], colori: i % 2 ? 'nude rosati' : 'rossi', tecnica: TECNICHE[i % 3] }, tag: i < 3 ? ['abituale'] : [], demo: true }));

  // appuntamenti: alcuni passati completati (con scheda), oggi/domani, settimana prossima
  const o = cfg().orari;
  const orariGiorno = (k) => { const g = GIORNI_KEY[D.daKey(k).getDay()]; return o ? (o[g] || []) : (D.daKey(k).getDay() === 0 ? [] : [['09:00', '13:00'], ['14:30', '19:00']]); };
  const app = []; const schede = [];
  let ci = 0;
  for (let g = -35; g <= 10; g++) {
    const k = D.aggiungiGiorniKey(D.oggiKey(), g); const iv = orariGiorno(k);
    if (!iv.length || (g < 0 && g % 4 !== 0)) continue;
    const [s] = iv[0]; const sv1 = sv(ci + 1);
    const inizio = D.combina(k, s); const fine = D.aggiungiMinuti(inizio, sv1.durata);
    const cli = clienti[ci % (clienti.length - 1)]; ci++;
    const passato = g < 0;
    const a = { clienteId: cli.id, clienteNome: nomeCliente(cli), servizi: [sv1], operatriceId: cfg().operatrici[0].id, inizio: inizio.toISOString(), fine: fine.toISOString(), stato: passato ? (g === -8 ? 'non_presentata' : 'completato') : (g % 2 ? 'confermato' : 'prenotato'), prezzoTotaleCent: sv1.prezzoCent, accontoCent: g === 2 ? 1000 : 0, note: '', demo: true, archiviato: false, id: uid(), schedaId: null };
    if (a.stato === 'completato') {

    }
    app.push(a);
    // secondo appuntamento nel pomeriggio per i giorni futuri
    if (!passato && iv[1]) {
      const sv2 = sv(ci + 2); const i2 = D.combina(k, iv[1][0]); const cli2 = clienti[ci % (clienti.length - 1)]; ci++;
      app.push({ clienteId: cli2.id, clienteNome: nomeCliente(cli2), servizi: [sv2], operatriceId: cfg().operatrici[0].id, inizio: i2.toISOString(), fine: D.aggiungiMinuti(i2, sv2.durata).toISOString(), stato: 'prenotato', prezzoTotaleCent: sv2.prezzoCent, accontoCent: 0, note: '', demo: true, archiviato: false, id: uid(), schedaId: null });
    }
  }
  // una cliente di prova con l'ultima visita ~30 giorni fa e nessun appuntamento futuro → "Da ricontattare"
  const conRichiamo = servizi.find((x) => Number(x.richiamoGiorni) > 0) || servizi[0];
  if (conRichiamo) {
    const cr = clienti[clienti.length - 1]; const kr = D.aggiungiGiorniKey(D.oggiKey(), -30);
    const svr = { servizioId: conRichiamo.id, nome: conRichiamo.nome, durata: conRichiamo.durata, prezzoCent: conRichiamo.prezzoCent, quantita: 1, colore: conRichiamo.colore, richiamoGiorni: conRichiamo.richiamoGiorni ?? null };
    const ir = D.combina(kr, '10:00'); const idA = uid(); const idS = uid();
    app.push({ id: idA, clienteId: cr.id, clienteNome: nomeCliente(cr), servizi: [svr], operatriceId: cfg().operatrici[0].id, inizio: ir.toISOString(), fine: D.aggiungiMinuti(ir, svr.durata).toISOString(), stato: 'completato', prezzoTotaleCent: svr.prezzoCent, accontoCent: 0, note: '', demo: true, archiviato: false, schedaId: idS });
    schede.push({ id: idS, appuntamentoId: idA, clienteId: cr.id, data: kr, ora: '10:00', servizi: [svr], tecnica: cr.preferenze.tecnica, forma: cr.preferenze.forma, lunghezza: cr.preferenze.lunghezza, colori: 'Codice di prova 045', prodotti: [], durataRealeMin: svr.durata, importoCent: svr.prezzoCent, metodoPagamento: 'Carta / Bancomat', note: '', noteProssimaVolta: '', fotoIds: [], demo: true, archiviato: false });
  }
  await Repo.appuntamenti.putMany(app);
  await Repo.schede_lavoro.putMany(schede);
  const kb = D.aggiungiGiorniKey(D.oggiKey(), 3);
  await Repo.blocchi.put({ tipo: 'personale', titolo: 'Impegno di prova', inizio: D.combina(kb, '16:00').toISOString(), fine: D.combina(kb, '17:00').toISOString(), tuttoIlGiorno: false, ricorrenza: null, operatriceId: null, demo: true, archiviato: false });
  // Magazzino, fornitori, ordini e appunti di prova
  const fornitori = [
    { ...fornitoreVuoto(), ragioneSociale: 'Fornitore di prova Uno', referente: 'Referente prova', telefono: '+390600000001', email: 'ordini@esempio.invalid', tempiConsegna: '2–3 giorni lavorativi', minimoOrdineCent: 5000, speseSpedizioneCent: 690, demo: true },
    { ...fornitoreVuoto(), ragioneSociale: 'Fornitore di prova Due', telefono: '+393330000099', tempiConsegna: '24 ore', demo: true }
  ];
  await Repo.fornitori.putMany(fornitori);
  const scad = (g) => D.aggiungiGiorniKey(D.oggiKey(), g);
  const prodotti = [
    ['Gel costruttore rosa (prova)', 'Gel costruttore', 'ml', 3, 1890, 0, 30, null, null, 50],
    ['Base coat (prova)', 'Base', 'ml', 2, 990, 0, 15, null, 12, 30],
    ['Top coat lucido (prova)', 'Top', 'ml', 2, 1090, 0, 15, scad(20), 12, 20],
    ['Semipermanente rosso 012 (prova)', 'Semipermanente', 'ml', 1, 790, 1490, 8, null, 12, 3],
    ['Lime 100/180 (prova)', 'Lime e abrasivi', 'pz', 20, 45, 0, 100, null, null, 12],
    ['Olio cuticole (prova)', 'Cosmetici in vendita', 'pz', 3, 350, 900, 0, scad(200), 6, 6]
  ].map(([nome, categoria, unita, scortaMinima, costoCent, prezzoVenditaCent, iniziale, scadenza, paoMesi, consumo], i) => ({
    nome, marca: 'Marca di prova', linea: '', codiceColore: '', categoria, unita, scortaMinima, costoCent, prezzoVenditaCent: prezzoVenditaCent || null,
    uso: prezzoVenditaCent ? 'entrambi' : 'interno', fornitoreId: fornitori[i % 2].id, codiceFornitore: `PROVA-${100 + i}`, lotto: `L${2026}${pad2(i + 1)}`,
    scadenza: scadenza || '', paoMesi, dataApertura: paoMesi ? scad(i === 1 ? -400 : -40) : '', note: '', fotoId: null, demo: true, archiviato: false, _iniziale: iniziale, _consumo: consumo
  }));
  for (const pr of prodotti) { const { _iniziale, _consumo, ...rec } = pr; await Repo.prodotti.put(rec); pr.id = rec.id;
    if (_iniziale) await registraMovimento({ prodottoId: rec.id, tipo: 'carico', quantita: _iniziale, nota: 'Giacenza iniziale di prova', costoCent: rec.costoCent, data: D.combina(scad(-40), '09:00').toISOString(), demo: true });
    if (_consumo) await registraMovimento({ prodottoId: rec.id, tipo: 'consumo', quantita: _consumo, nota: 'Consumi di prova', data: D.combina(scad(-5), '18:00').toISOString(), demo: true });
  }
  await registraMovimento({ prodottoId: prodotti[5].id, tipo: 'vendita', quantita: 1, nota: 'Contanti', importoCent: 900, demo: true });
  await Repo.ordini_fornitore.put({ fornitoreId: fornitori[0].id, righe: [{ prodottoId: prodotti[2].id, nome: prodotti[2].nome, codiceFornitore: 'PROVA-102', quantita: 3, costoCent: 1090, ricevuta: 0 }], stato: 'inviato', dataCreazione: D.combina(scad(-2), '10:00').toISOString(), dataInvio: D.combina(scad(-2), '10:05').toISOString(), dataRicezione: null, speseSpedizioneCent: 690, note: '', demo: true, archiviato: false });

    { titolo: 'Preferenze (prova)', testo: 'Le piace il glitter sull\'anulare.', tag: [], fissato: false, colore: 'rosa', promemoria: '', fatto: false, collegamento: { tipo: 'cliente', id: clienti[0].id }, demo: true, archiviato: false }
  ]);
  toast('Dati di prova caricati.');
  aggiornaVista();
}
async function rimuoviDatiDemo() {
  if (!(await conferma({ titolo: 'Rimuovere i dati di prova?', messaggio: 'Verranno cancellati tutti gli elementi segnati “PROVA” e gli appuntamenti/schede collegati alle clienti di prova.', ok: 'Rimuovi', pericolo: true }))) return;
  try { await creaCopiaRipristino('prima'); } catch (e) { console.warn(e); }
  const dati = await leggiTutto();
  const cliDemo = new Set(dati.clienti.filter((c) => c.demo).map((c) => c.id));
  const servDemo = new Set(dati.servizi.filter((s) => s.demo).map((s) => s.id));
  const prodDemo = new Set(dati.prodotti.filter((x) => x.demo).map((x) => x.id));
  const fornDemo = new Set(dati.fornitori.filter((x) => x.demo).map((x) => x.id));
  const via = (r) => r.demo || (r.clienteId && cliDemo.has(r.clienteId)) || (r.prodottoId && prodDemo.has(r.prodottoId)) || (r.fornitoreId && fornDemo.has(r.fornitoreId))
    || (r.collegamento && [cliDemo, prodDemo, fornDemo].some((s) => s.has(r.collegamento.id)));
  const nomi = ['clienti', 'appuntamenti', 'schede_lavoro', 'foto', 'blocchi', 'servizi', 'prodotti', 'movimenti_magazzino', 'fornitori', 'ordini_fornitore', 'appunti'];
  const tx = db.transaction(nomi, 'readwrite');
  const eliminati = [];
  for (const n of nomi) for (const r of dati[n]) if (via(r)) { tx.objectStore(n).delete(r.id); eliminati.push([n, r.id]); }
  await fineTransazione(tx);
  await registraEliminazioni(eliminati);
  emetti('dati', { archivio: '*' });
  // segnala eventuali appuntamenti veri che usavano servizi di prova
  const orfani = dati.appuntamenti.filter((a) => !via(a) && (a.servizi || []).some((s) => servDemo.has(s.servizioId))).length;
  toast(orfani ? `Dati di prova rimossi. ${orfani} appuntamenti reali usavano servizi di prova: i loro dati restano invariati.` : 'Dati di prova rimossi.', { durata: 6000 });
  aggiornaVista();
}

      </div>
      <h3>Privacy (GDPR)</h3>
      <ul class="piccolo">
        <li>Per ogni cliente registri i consensi con la data (privacy, dati sanitari, foto, marketing).</li>
        <li>Allergie e sensibilità si possono scrivere solo se c'è il consenso ai dati sanitari; se il consenso viene tolto, vengono cancellate.</li>

    <details class="card" id="sez-moduli"><summary><h2 style="display:inline">Moduli attivi</h2></summary>
      <div style="margin-top:10px">${Object.keys(CONFIG.moduli).map((m) => `<label class="check"><input type="checkbox" data-mod="${m}" ${c.moduli[m] ? 'checked' : ''}> ${esc({ agenda: 'Agenda', clienti: 'Clienti', storico: 'Storico lavori (schede)', magazzino: 'Magazzino', fornitori: 'Fornitori', ordini: 'Ordini ai fornitori', appunti: 'Appunti', report: 'Report' }[m] || m)}</label>`).join('')}</div>
      <div class="campo"><label for="i-bk">Promemoria backup dopo (giorni)</label><input type="number" id="i-bk" min="1" inputmode="numeric" value="${esc(c.avvisi.backupGiorni)}" style="max-width:140px"></div>
    </details>

    <div class="gruppo-btn fine" style="margin:12px 0 20px"><button type="button" class="btn btn-primario" id="i-salva">Salva impostazioni</button></div>

    <section class="card" id="sez-dati"><h2>Dati, backup e ripristino</h2>

      <div class="gruppo-btn" style="margin-top:10px">
        <button type="button" class="btn btn-primario" id="i-backup">Fai un backup…</button>
        <button type="button" class="btn" id="i-ripristina">Ripristina da backup…</button>
        ${persist.ok === false ? '<button type="button" class="btn" id="i-persist">Richiedi archiviazione persistente</button>' : ''}
      </div>
      <p class="muted piccolo">Il backup è un unico file con tutti i dati (foto facoltative, password facoltativa). Conservalo fuori da questo dispositivo.</p>
      ${'showDirectoryPicker' in window && !eiOS() ? `<h3 style="margin-top:16px">Backup automatico in una cartella</h3>
      <p class="muted piccolo">Sul computer (Chrome/Edge) l'agenda può salvare da sola un backup al giorno in una cartella a tua scelta, per esempio una cartella sincronizzata con Google Drive, OneDrive o Dropbox. Tiene un file per ogni giorno della settimana: dopo 7 giorni il più vecchio viene sovrascritto.</p>
      <label class="check"><input type="checkbox" id="i-auto" ${c.backupAutomatico ? 'checked' : ''} ${cartella ? '' : 'disabled'}> Backup automatico giornaliero</label>
      <div class="gruppo-btn"><button type="button" class="btn btn-piccolo" id="i-cartella">${cartella ? `Cambia cartella (attuale: ${esc(cartella.name)})` : 'Scegli la cartella dei backup…'}</button></div>` : '<p class="muted piccolo">Su questo dispositivo il backup automatico in cartella non è disponibile (serve Chrome o Edge su computer): usa “Condividi” per mandare il backup su Drive o via email.</p>'}
      <h3 style="margin-top:16px">App</h3>
      <div class="gruppo-btn"><button type="button" class="btn" id="i-installa">Installa l'app su questo dispositivo</button></div>
      <p class="muted piccolo">${/^https?:$/.test(location.protocol) ? 'Installata, l\'agenda si apre come un\'app e funziona anche senza internet.' : 'Stai usando il file aperto dal dispositivo. Per installarla come app e usarla offline su tablet e telefono, aprila dall\'indirizzo https dove è pubblicata.'}</p>
      <h3 style="margin-top:16px" id="cloud">Cloud: backup automatico e sincronizzazione</h3>
      <div id="i-cloud"></div>
      <h3 style="margin-top:16px">Punti di ripristino automatici</h3>
      <div id="i-copie"></div>
      <h3 style="margin-top:16px">Configurazione</h3>
      <div class="gruppo-btn"><button type="button" class="btn" id="i-cfg-esp">Esporta configurazione</button><button type="button" class="btn" id="i-cfg-imp">Importa configurazione…</button></div>
      <p class="muted piccolo">Solo impostazioni e listino (niente clienti): serve per preparare l'agenda per un'altra estetista.</p>
      <h3 style="margin-top:16px">Dati di prova</h3>
      <div class="gruppo-btn"><button type="button" class="btn" id="i-demo-si" ${demo ? 'disabled' : ''}>Carica dati di prova</button><button type="button" class="btn" id="i-demo-no" ${demo ? '' : 'disabled'}>Rimuovi dati di prova</button></div>
      <h3 style="margin-top:16px">Elementi archiviati</h3>
      <div id="i-archivio"><button type="button" class="btn" id="i-arch-apri">Mostra elementi archiviati</button></div>
    </section>
    <p class="muted piccolo" style="text-align:center">Agenda ${VERSIONE_APP} · schema dati ${SCHEMA_VERSION} · archivio “${esc(IDB_NOME)}” · calendario FullCalendar 6.1.21 (licenza MIT)${window.__fcLocale ? ', copia locale' : ''}</p>`;

  const s = (q) => $(q, el);
  // Orari: "Chiuso" svuota e disabilita i campi del giorno
  $$('[data-chiuso]', el).forEach((cb) => {
    const agg = () => $$(`[data-o^="${cb.dataset.chiuso}-"]`, el).forEach((i) => { i.disabled = cb.checked; });
    cb.addEventListener('change', agg); agg();
  });
  let logo = c.attivita.logo;
  s('#i-logo').addEventListener('click', async () => {
    const f = await scegliFile('image/*'); if (!f) return;
    const r = await comprimiFoto(f, 256, 0.85); logo = await blobADataURL(r.blob);
    toast('Logo pronto: premi “Salva impostazioni”.');
  });
  s('#i-logo-via')?.addEventListener('click', () => { logo = null; toast('Logo rimosso: premi “Salva impostazioni”.'); });
  // Operatrici
  const ops = clona(c.operatrici);
  s('#i-op-nuova').addEventListener('click', async () => {
    raccogliOperatrici(); ops.push({ id: 'op' + uid().slice(0, 8), nome: '', colore: colore(ops.length) });
    c.operatrici = ops; await salvaDaForm(false); aggiornaVista();
  });
  $$('[data-op-via]', el).forEach((b) => b.addEventListener('click', async () => {
    const i = Number(b.dataset.opVia); const o = ops[i];
    const usati = (await Repo.appuntamenti.list()).filter((a) => a.operatriceId === o.id && a.inizio >= new Date().toISOString() && ['prenotato', 'confermato'].includes(a.stato)).length;
    if (!(await conferma({ titolo: 'Rimuovere l\'operatrice?', messaggio: usati ? `<p>Ha ${usati} appuntamenti futuri: verranno assegnati alla prima operatrice dell'elenco.</p>` : '', ok: 'Rimuovi', pericolo: true }))) return;
    raccogliOperatrici(); ops.splice(i, 1);
    if (usati) { const apps = (await Repo.appuntamenti.list()).filter((a) => a.operatriceId === o.id); for (const a of apps) { a.operatriceId = ops[0].id; } await Repo.appuntamenti.putMany(apps); }
    c.operatrici = ops; await salvaDaForm(false); aggiornaVista();
  }));
  const raccogliOperatrici = () => ops.forEach((o, i) => { const n = s(`[data-op-nome="${i}"]`); const col = s(`[data-op-col="${i}"]`); if (n) o.nome = n.value.trim(); if (col) o.colore = col.value; });

  const leggiOrari = () => {
    const out = {}; let qualcosa = false; const errori = [];
    for (const g of GIORNI_KEY) {
      if (s(`[data-chiuso="${g}"]`).checked) { out[g] = []; qualcosa = true; continue; }
      const iv = [];
      for (const f of [0, 1]) {
        const a = s(`[data-o="${g}-${f}-0"]`).value, b = s(`[data-o="${g}-${f}-1"]`).value;
        if (a && b) { if (D.minDaHHMM(b) <= D.minDaHHMM(a)) errori.push(`${GIORNI_NOME[g]}: la chiusura deve essere dopo l'apertura.`); else iv.push([a, b]); qualcosa = true; }
        else if (a || b) errori.push(`${GIORNI_NOME[g]}: completa entrambi gli orari della fascia ${f + 1}.`);
      }
      iv.sort((x, y) => x[0].localeCompare(y[0]));
      if (iv.length === 2 && D.minDaHHMM(iv[1][0]) < D.minDaHHMM(iv[0][1])) errori.push(`${GIORNI_NOME[g]}: le due fasce si sovrappongono.`);
      out[g] = iv;
    }
    return { orari: qualcosa ? out : null, errori };
  };
  const righe = (t, def) => { const r = [...new Set(String(t || '').split('\n').map((x) => x.trim()).filter(Boolean))]; return r.length ? r : def; };
  const salvaDaForm = async (avvisa = true) => {
    raccogliOperatrici();
    const { orari: nuoviOrari, errori } = leggiOrari();
    if (errori.length) { await conferma({ titolo: 'Controlla gli orari', messaggio: `<ul>${errori.map((e) => `<li>${esc(e)}</li>`).join('')}</ul>`, ok: 'Ok', annulla: 'Chiudi' }); return false; }
    const n = {
      ...c,
      attivita: { ...c.attivita, nome: s('#i-nome').value.trim(), titolare: s('#i-tit').value.trim(), citta: s('#i-citta').value.trim(), telefono: s('#i-tel').value.trim(), prefissoInternazionale: (s('#i-pref').value.replace(/\D/g, '') || '39'), logo },
      brand: { ...c.brand, primario: s('#i-c1').value, secondario: s('#i-c2').value, accento: s('#i-c3').value },
      tema: s('#i-tema').value,
      orari: nuoviOrari,
      agenda: { ...c.agenda, slotMinuti: Number(s('#i-slot').value), cuscinettoMinuti: Math.max(0, Number(s('#i-cusc').value) || 0), vistaPredefinita: s('#i-vista').value, vistaTelefono: s('#i-vista-tel').value, coloreEventiPer: s('#i-colori').value },
      operatrici: ops,
      promemoriaWhatsApp: s('#i-wa').checked,
      messaggi: { ...c.messaggi, promemoria: s('#i-msg-p').value, richiamo: s('#i-msg-r').value },
      moduli: Object.fromEntries(Object.keys(CONFIG.moduli).map((m) => [m, s(`[data-mod="${m}"]`).checked])),
      avvisi: { ...c.avvisi, backupGiorni: Math.max(1, Number(s('#i-bk').value) || 7), scadenzaGiorni: Math.max(1, Number(s('#i-scad').value) || 30) },
      fusoOrario: s('#i-fuso').value.trim() || 'Europe/Rome',
      categorieServizi: righe(s('#i-cat-serv').value, CONFIG.categorieServizi),
      categorieProdotti: righe(s('#i-cat-prod').value, CONFIG.categorieProdotti),
      marche: righe(s('#i-marche').value, []),
      magazzino: { ...c.magazzino, moltiplicatoreRiordino: Math.max(1, Number(String(s('#i-molt').value).replace(',', '.')) || 2) },
      messaggiOrdine: s('#i-msg-o').value,
      sicurezza: { ...c.sicurezza, bloccoDopoMinuti: Number(s('#i-blocco-min').value) || 0 },
      backupAutomatico: s('#i-auto') ? s('#i-auto').checked : !!c.backupAutomatico
    };
    await salvaConfig(n);
    statoAgenda.vista = null;
    disegnaMenu();
    if (avvisa) toast('Impostazioni salvate');
    return true;
  };
  s('#i-salva').addEventListener('click', () => salvaDaForm().then((ok) => ok && aggiornaVista()).catch(erroreUI));
  s('#i-serv-nuovo').addEventListener('click', () => apriModuloServizio(null));
  $$('[data-serv]', el).forEach((b) => b.addEventListener('click', () => apriModuloServizio(servizi.find((x) => x.id === b.dataset.serv))));
  s('#i-backup').addEventListener('click', () => eseguiBackup().catch(erroreUI));
  s('#i-ripristina').addEventListener('click', () => ripristinaDaFile().catch(erroreUI));
  s('#i-persist')?.addEventListener('click', async () => { const r = await richiediPersistenza(); toast(r ? 'Archiviazione persistente concessa.' : 'Il browser non ha concesso l\'archiviazione persistente. Fai backup regolari.'); aggiornaVista(); });
  s('#i-cfg-esp').addEventListener('click', () => esportaConfigurazione().catch(erroreUI));
  s('#i-cfg-imp').addEventListener('click', () => importaConfigurazione().catch(erroreUI));
  s('#i-demo-si').addEventListener('click', () => caricaDatiDemo().catch(erroreUI));
  s('#i-demo-no').addEventListener('click', () => rimuoviDatiDemo().catch(erroreUI));
  s('#i-arch-apri').addEventListener('click', () => mostraArchivio(s('#i-archivio')).catch(erroreUI));
  sezioneCopie(s('#i-copie')).catch(erroreUI);
  sezioneCloud(s('#i-cloud')).catch(erroreUI);
  s('#i-blocchi').addEventListener('click', () => apriElencoBlocchi().catch(erroreUI));
  s('#i-pin').addEventListener('click', () => apriGestionePin().catch(erroreUI));
  s('#i-installa').addEventListener('click', () => installaApp().catch(erroreUI));
  s('#i-cartella')?.addEventListener('click', async () => {
    try { await scegliCartellaBackup(); } catch (e) { if (e.name !== 'AbortError') erroreUI(e); return; }
    c.backupAutomatico = true; await salvaDaForm(false); const r = await backupAutomatico({ chiedi: true });
    toast(r === 'fatto' ? 'Cartella impostata: primo backup automatico salvato.' : 'Cartella impostata.'); aggiornaVista();
  });
  s('#i-auto')?.addEventListener('change', async (e) => { c.backupAutomatico = e.target.checked; await salvaDaForm(false); toast(e.target.checked ? 'Backup automatico attivato' : 'Backup automatico disattivato'); });
}

async function apriModuloServizio(serv) {
  const prodotti = moduloAttivo('magazzino') ? await prodottiAttivi() : [];
  const sv = serv ? clona(serv) : { nome: '', categoria: cfg().categorieServizi[0] || 'Altro', durata: 30, prezzoCent: null, colore: null, cuscinetto: null, richiamoGiorni: null, prodottiDefault: [], archiviato: false };
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="campo"><label for="sv-nome">Nome *</label><input type="text" id="sv-nome" value="${esc(sv.nome)}"></div>
    <div class="riga-campi">
      <div class="campo"><label for="sv-cat">Categoria</label><input type="text" id="sv-cat" list="sv-cat-lista" value="${esc(sv.categoria || '')}"><datalist id="sv-cat-lista">${cfg().categorieServizi.map((x) => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="campo"><label for="sv-col">Colore in agenda</label><input type="color" id="sv-col" value="${esc(sv.colore || colore(Math.floor(Math.random() * 10)))}"></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="sv-dur">Durata (min) *</label><input type="number" id="sv-dur" min="5" step="5" inputmode="numeric" value="${esc(sv.durata ?? '')}"></div>
      <div class="campo"><label for="sv-prezzo">Prezzo (€)</label><input type="text" id="sv-prezzo" inputmode="decimal" value="${F.testoDaCent(sv.prezzoCent)}"></div>
      <div class="campo"><label for="sv-cusc">Cuscinetto dopo (min)</label><input type="number" id="sv-cusc" min="0" step="5" inputmode="numeric" value="${esc(sv.cuscinetto ?? '')}" placeholder="${esc(cfg().agenda.cuscinettoMinuti)} (generale)"></div>
      <div class="campo"><label for="sv-rich">Richiamo dopo (giorni)</label><input type="number" id="sv-rich" min="0" inputmode="numeric" value="${esc(sv.richiamoGiorni ?? '')}" placeholder="nessuno"></div>
    </div>
    <p class="muted piccolo">Il prezzo viene copiato in ogni appuntamento al momento della prenotazione: cambiarlo qui non modifica gli appuntamenti già presi.</p>
    ${prodotti.length ? `<fieldset><legend>Prodotti consumati di solito</legend><p class="muted piccolo" style="margin-top:0">Vengono proposti nella scheda lavoro quando completi l'appuntamento; si scalano dal magazzino solo se li confermi.</p><div id="sv-def"></div><button type="button" class="btn btn-piccolo" id="sv-def-agg">${icona('piu')} Prodotto</button></fieldset>` : ''}`;
  const s = (q) => $(q, corpo);
  const defs = clona(sv.prodottiDefault || []);
  const leggiDef = () => $$('[data-def]', corpo).forEach((x) => { const d = defs[Number(x.dataset.def)]; if (x.dataset.k === 'p') d.prodottoId = x.value || null; else d.quantita = String(x.value).replace(',', '.'); });
  const disegnaDef = () => {
    if (!s('#sv-def')) return;
    s('#sv-def').innerHTML = defs.map((d, i) => `<div class="riga-campi" style="grid-template-columns: 3fr 1fr auto;align-items:end">
      <div class="campo"><label for="sv-dp-${i}">Prodotto</label><select id="sv-dp-${i}" data-def="${i}" data-k="p"><option value=""></option>${prodotti.map((x) => `<option value="${esc(x.id)}" ${x.id === d.prodottoId ? 'selected' : ''}>${esc(nomeProdotto(x))}${x.marca ? ` — ${esc(x.marca)}` : ''} (${esc(x.unita || 'pz')})</option>`).join('')}</select></div>
      <div class="campo"><label for="sv-dq-${i}">Quantità</label><input type="text" inputmode="decimal" id="sv-dq-${i}" data-def="${i}" data-k="q" value="${esc(String(d.quantita ?? '').replace('.', ','))}"></div>
      <button type="button" class="btn btn-ghost" style="margin-bottom:12px" data-def-via="${i}" aria-label="Rimuovi">${icona('chiudi')}</button></div>`).join('') || '<p class="muted piccolo">Nessun prodotto.</p>';
    $$('[data-def-via]', corpo).forEach((b) => b.addEventListener('click', () => { leggiDef(); defs.splice(Number(b.dataset.defVia), 1); disegnaDef(); }));
  };
  disegnaDef();
  s('#sv-def-agg')?.addEventListener('click', () => { leggiDef(); defs.push({ prodottoId: null, quantita: 1 }); disegnaDef(); });
  const azioni = [{ testo: 'Annulla' }];
  if (serv) azioni.push({ testo: 'Archivia', classe: 'btn-pericolo', onClick: async () => {
    await Repo.servizi.archivia(serv.id);
    toastAnnulla('Servizio archiviato', async () => { await Repo.servizi.ripristina(serv.id); });
    aggiornaVista(); return true;
  } });
  azioni.push({ testo: 'Salva', classe: 'btn-primario', onClick: async () => {
    leggiDef();
    sv.prodottiDefault = defs.filter((d) => d.prodottoId && Number(d.quantita) > 0).map((d) => ({ prodottoId: d.prodottoId, quantita: qta(Number(d.quantita)) }));
    const nome = s('#sv-nome').value.trim(); const durata = Number(s('#sv-dur').value);
    if (!nome) { toast('Il nome è obbligatorio.'); return false; }
    if (!(durata > 0)) { toast('Indica la durata in minuti.'); return false; }
    const num = (v) => (v === '' ? null : Math.max(0, Number(v) || 0));
    Object.assign(sv, { nome, categoria: s('#sv-cat').value.trim() || 'Altro', colore: s('#sv-col').value, durata, prezzoCent: F.centDaTesto(s('#sv-prezzo').value) ?? 0, cuscinetto: num(s('#sv-cusc').value), richiamoGiorni: num(s('#sv-rich').value) });
    if (sv.ordine == null) sv.ordine = (await Repo.servizi.count());
    await Repo.servizi.put(sv);
    toast('Servizio salvato'); aggiornaVista(); return true;
  } });
  apriModale({ titolo: serv ? 'Modifica servizio' : 'Nuovo servizio', corpo, azioni });
}

async function mostraArchivio(cont) {
  const [cli, app, sch, serv, bl, pr, fo, an] = await Promise.all([Repo.clienti.soloArchiviati(), Repo.appuntamenti.soloArchiviati(), Repo.schede_lavoro.soloArchiviati(), Repo.servizi.soloArchiviati(), Repo.blocchi.soloArchiviati(), Repo.prodotti.soloArchiviati(), Repo.fornitori.soloArchiviati(), Repo.appunti.soloArchiviati()]);
  const mc = await mappaClienti();
  const gruppo = (titolo, arch, lista, desc) => `<h3 style="margin-top:12px">${titolo} (${lista.length})</h3><ul class="lista">${lista.map((r) => `<li><div class="riga" style="cursor:default;flex-wrap:wrap"><span class="principale">${esc(desc(r))}</span>
    <span class="gruppo-btn"><button type="button" class="btn btn-piccolo" data-rip="${arch}:${esc(r.id)}">Ripristina</button><button type="button" class="btn btn-piccolo btn-ghost" style="color:var(--pericolo)" data-del="${arch}:${esc(r.id)}">Elimina definitivamente</button></span></div></li>`).join('') || '<li class="vuoto">Nessuno</li>'}</ul>`;
  cont.innerHTML =
    gruppo('Clienti', 'clienti', cli, (r) => nomeCliente(r)) +
    gruppo('Appuntamenti', 'appuntamenti', app, (r) => `${F.dataOra(new Date(r.inizio))} — ${nomeCliente(mc.get(r.clienteId)) || r.clienteNome}`) +
    gruppo('Schede lavoro', 'schede_lavoro', sch, (r) => `${F.dataKey(r.data)} — ${nomeCliente(mc.get(r.clienteId))}`) +
    gruppo('Servizi', 'servizi', serv, (r) => r.nome) +
    gruppo('Pause e chiusure', 'blocchi', bl, (r) => descriviBlocco(r)) +
    gruppo('Prodotti', 'prodotti', pr, (r) => nomeProdotto(r)) +
    gruppo('Fornitori', 'fornitori', fo, (r) => nomeFornitore(r)) +
    gruppo('Appunti', 'appunti', an, (r) => r.titolo || (r.testo || '').slice(0, 60) || 'Appunto');
  $$('[data-rip]', cont).forEach((b) => b.addEventListener('click', async () => { const [a, id] = b.dataset.rip.split(':'); await Repo[a].ripristina(id); toast('Ripristinato'); mostraArchivio(cont); }));
  $$('[data-del]', cont).forEach((b) => b.addEventListener('click', async () => {
    const [a, id] = b.dataset.del.split(':');
    const r = await Repo[a].get(id);
    const cosa = a === 'clienti' ? `la cliente ${nomeCliente(r)} (i suoi dati personali e le foto verranno cancellati; appuntamenti e schede restano anonimi per le statistiche)` : 'questo elemento';
    if (!(await doppiaConferma(cosa))) return;
    if (a === 'clienti') await eliminaClienteConAnonimizzazione(id);
    else if (a === 'schede_lavoro') { for (const f of await Repo.foto.query('schedaId', id)) await Repo.foto.delete(f.id); await Repo.schede_lavoro.delete(id); }
    else if (a === 'prodotti') {
      const mov = await Repo.movimenti_magazzino.query('prodottoId', id);
      if (mov.length && !(await conferma({ titolo: 'Il prodotto ha dei movimenti', messaggio: `<p>Verranno eliminati anche i suoi ${mov.length} movimenti di magazzino: i report su consumi e vendite passati non lo conteranno più.</p>`, ok: 'Elimina tutto', pericolo: true }))) return;
      const pr = await Repo.prodotti.get(id); if (pr && pr.fotoId) await Repo.foto.delete(pr.fotoId);
      for (const m of mov) await Repo.movimenti_magazzino.delete(m.id); await Repo.prodotti.delete(id);
    }
    else await Repo[a].delete(id);
    toast('Eliminato definitivamente'); mostraArchivio(cont);
  }));
}
async function eliminaClienteConAnonimizzazione(id) {
  const apps = await Repo.appuntamenti.query('clienteId', id);
  const schede = await Repo.schede_lavoro.query('clienteId', id);
  const foto = await Repo.foto.query('clienteId', id);
  const anon = 'anon-' + uid();
  for (const a of apps) { a.clienteId = anon; a.clienteNome = 'Cliente eliminata'; a.note = ''; }
  for (const s of schede) { s.clienteId = anon; s.note = ''; s.noteProssimaVolta = ''; s.fotoIds = []; }
  // appunti collegati: il collegamento sparisce (il testo resta: controllalo tu se contiene dati personali)
  const appunti = (await Repo.appunti.list({ archiviati: true })).filter((a) => a.collegamento && a.collegamento.tipo === 'cliente' && a.collegamento.id === id);
  for (const a of appunti) a.collegamento = null;
  const tx = db.transaction(['clienti', 'appuntamenti', 'schede_lavoro', 'foto', 'appunti'], 'readwrite');
  for (const a of appunti) tx.objectStore('appunti').put(a);
  tx.objectStore('clienti').delete(id);
  for (const a of apps) tx.objectStore('appuntamenti').put(a);
  for (const s of schede) tx.objectStore('schede_lavoro').put(s);
  for (const f of foto) tx.objectStore('foto').delete(f.id);
  await fineTransazione(tx);
  await registraEliminazioni([['clienti', id], ...foto.map((f) => ['foto', f.id])]);
  emetti('dati', { archivio: '*' });
}

</script>
<script>
'use strict';
/* =====================================================================================
   MAGAZZINO — la giacenza NON è un campo salvato: è sempre la somma dei movimenti.
   Ogni movimento ha la quantità già con il segno (+ entra, − esce; la rettifica salva
   la differenza tra quanto contato e quanto risultava).
   ===================================================================================== */
async function mappaGiacenze() {
  const mov = await Repo.movimenti_magazzino.list({ archiviati: true });
  const m = new Map();
  for (const x of mov) m.set(x.prodottoId, qta((m.get(x.prodottoId) || 0) + (Number(x.quantita) || 0)));
  return m;
}
async function giacenzaDi(prodottoId) {
  const mov = await Repo.movimenti_magazzino.query('prodottoId', prodottoId);
  return qta(mov.reduce((t, x) => t + (Number(x.quantita) || 0), 0));
}
async function prodottiAttivi() {
  return (await Repo.prodotti.list()).sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '', 'it') || nomeProdotto(a).localeCompare(nomeProdotto(b), 'it'));
}
async function mappaProdotti() { const m = new Map(); (await Repo.prodotti.list({ archiviati: true })).forEach((p) => m.set(p.id, p)); return m; }
async function mappaFornitori() { const m = new Map(); (await Repo.fornitori.list({ archiviati: true })).forEach((f) => m.set(f.id, f)); return m; }
function nomeProdotto(p) {
  if (!p) return 'Prodotto';
  return [p.nome, p.codiceColore ? `(${p.codiceColore})` : ''].filter(Boolean).join(' ');
}
function descrProdotto(p) { return [p.marca, p.linea].filter(Boolean).join(' · '); }
function fmtQta(n, unita = 'pz') { const v = qta(n); return `${String(v).replace('.', ',')} ${UNITA[unita] || unita || ''}`.trim(); }
function nomeFornitore(f) { return f ? (f.ragioneSociale || 'Fornitore senza nome') : ''; }

// Scadenza del PAO: data di apertura + mesi indicati (chiave AAAA-MM-GG) oppure null
function scadenzaPAO(p) {
  if (!p.dataApertura || !Number(p.paoMesi)) return null;
  const d = D.daKey(p.dataApertura); const g = d.getDate();
  d.setMonth(d.getMonth() + Number(p.paoMesi));
  if (d.getDate() !== g) d.setDate(0); // es. 31 gennaio + 1 mese → ultimo giorno di febbraio
  return D.key(d);
}
async function avvisiMagazzino() {
  const [prodotti, gia] = await Promise.all([Repo.prodotti.list(), mappaGiacenze()]);
  const oggi = D.oggiKey(); const limite = D.aggiungiGiorniKey(oggi, Number(cfg().avvisi.scadenzaGiorni) || 30);
  const out = { sottoScorta: [], inScadenza: [], scaduti: [], paoSuperato: [], negativi: [] };
  for (const p of prodotti) {
    const g = gia.get(p.id) || 0;
    if (g < 0) out.negativi.push({ p, g });
    if (Number(p.scortaMinima) > 0 && g <= Number(p.scortaMinima)) out.sottoScorta.push({ p, g });
    if (p.scadenza && g > 0) { if (p.scadenza < oggi) out.scaduti.push({ p, g }); else if (p.scadenza <= limite) out.inScadenza.push({ p, g }); }
    const pao = scadenzaPAO(p);
    if (pao && pao < oggi && g > 0) out.paoSuperato.push({ p, g, pao });
  }
  return out;
}
function valoreMagazzino(prodotti, gia) {
  return prodotti.reduce((t, p) => t + Math.max(0, gia.get(p.id) || 0) * (Number(p.costoCent) || 0), 0);
}
function badgeProdotto(p, g) {
  const oggi = D.oggiKey(); const limite = D.aggiungiGiorniKey(oggi, Number(cfg().avvisi.scadenzaGiorni) || 30);
  const b = [];
  if (g < 0) b.push('<span class="badge badge-pericolo">giacenza negativa</span>');
  else if (Number(p.scortaMinima) > 0 && g <= Number(p.scortaMinima)) b.push('<span class="badge badge-avviso">sotto scorta</span>');
  if (p.scadenza && g > 0) { if (p.scadenza < oggi) b.push(`<span class="badge badge-pericolo">scaduto ${esc(F.dataKey(p.scadenza))}</span>`); else if (p.scadenza <= limite) b.push(`<span class="badge badge-avviso">scade ${esc(F.dataKey(p.scadenza))}</span>`); }
  const pao = scadenzaPAO(p);
  if (pao && g > 0) b.push(pao < oggi ? `<span class="badge badge-pericolo">PAO superato</span>` : `<span class="badge">aperto · PAO al ${esc(F.dataKey(pao))}</span>`);
  if (p.uso === 'vendita' || p.uso === 'entrambi') b.push('<span class="badge">in vendita</span>');
  if (p.demo) b.push('<span class="badge badge-demo">PROVA</span>');
  return b.join(' ');
}

/* ----- Movimenti ----- */
async function registraMovimento({ prodottoId, tipo, quantita, nota = '', riferimento = null, costoCent = null, importoCent = null, lotto = '', data = null, demo = false }) {
  const t = TIPI_MOVIMENTO[tipo]; if (!t) throw new Error('Tipo di movimento sconosciuto');
  const q = t.segno === 0 ? qta(quantita) : qta(Math.abs(quantita) * t.segno);
  const rec = { prodottoId, tipo, quantita: q, data: data || new Date().toISOString(), nota, riferimento, costoCent, importoCent, lotto, archiviato: false };
  if (demo) rec.demo = true;
  return Repo.movimenti_magazzino.put(rec);
}
// Chiede conferma se un'uscita porta la giacenza sotto zero. true = si può procedere.
async function controllaNegativo(prod, uscita) {
  const g = await giacenzaDi(prod.id);
  if (qta(g - uscita) >= 0) return true;
  return conferma({ titolo: 'Giacenza insufficiente', messaggio: `<p>Di <strong>${esc(nomeProdotto(prod))}</strong> risultano ${esc(fmtQta(g, prod.unita))}: dopo questa uscita la giacenza sarà <strong>${esc(fmtQta(g - uscita, prod.unita))}</strong>.</p><p>Succede se un carico non è stato registrato. Puoi procedere e sistemare poi con una rettifica inventario.</p>`, ok: 'Registra comunque' });
}

/* ----- Vista magazzino ----- */
const statoMag = { q: '', categoria: '', marca: '', fornitore: '', filtro: '' };
async function vistaMagazzino(el) {
  const [prodotti, gia, fornitori] = await Promise.all([prodottiAttivi(), mappaGiacenze(), Repo.fornitori.list()]);
  const avv = await avvisiMagazzino();
  const idSotto = new Set(avv.sottoScorta.map((x) => x.p.id).concat(avv.negativi.map((x) => x.p.id)));
  const idScad = new Set([...avv.inScadenza, ...avv.scaduti].map((x) => x.p.id));
  const idPao = new Set(avv.paoSuperato.map((x) => x.p.id));
  const marche = [...new Set(prodotti.map((p) => p.marca).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'it'));
  const categorie = [...new Set(prodotti.map((p) => p.categoria).filter(Boolean))];
  const opz = (lista, v, tutti) => `<option value="">${tutti}</option>` + lista.map(([val, nome]) => `<option value="${esc(val)}" ${v === val ? 'selected' : ''}>${esc(nome)}</option>`).join('');
  el.innerHTML = `
    <div class="intestazione"><h1>Magazzino <span class="muted" style="font-weight:400">(${prodotti.length})</span></h1>
      <div class="gruppo-btn">
        ${moduloAttivo('ordini') ? `<button class="btn" type="button" id="mg-ordina" ${idSotto.size ? '' : 'disabled'}>Crea ordini dai sotto scorta${idSotto.size ? ` (${idSotto.size})` : ''}</button>` : ''}
        <button class="btn btn-primario" type="button" id="mg-nuovo">${icona('piu')} Nuovo prodotto</button>
      </div></div>
    <div class="statistiche" style="margin-bottom:12px">
      <div class="stat"><div class="val">${F.euro(Math.round(valoreMagazzino(prodotti, gia)))}</div><div class="lab">Valore a costo</div></div>
      <div class="stat"><div class="val">${idSotto.size}</div><div class="lab">Sotto scorta</div></div>
      <div class="stat"><div class="val">${idScad.size}</div><div class="lab">In scadenza / scaduti</div></div>
      <div class="stat"><div class="val">${idPao.size}</div><div class="lab">Aperti oltre il PAO</div></div>
    </div>
    <div class="card">
      <div class="riga-campi">
        <div class="campo" style="margin:0"><label class="sr" for="mg-q">Cerca</label><input type="search" id="mg-q" placeholder="Cerca nome, marca, codice…" value="${esc(statoMag.q)}" autocomplete="off"></div>
        <div class="campo" style="margin:0"><label class="sr" for="mg-cat">Categoria</label><select id="mg-cat">${opz(categorie.map((c) => [c, c]), statoMag.categoria, 'Tutte le categorie')}</select></div>
        <div class="campo" style="margin:0"><label class="sr" for="mg-marca">Marca</label><select id="mg-marca">${opz(marche.map((c) => [c, c]), statoMag.marca, 'Tutte le marche')}</select></div>
        <div class="campo" style="margin:0"><label class="sr" for="mg-forn">Fornitore</label><select id="mg-forn">${opz(fornitori.map((f) => [f.id, nomeFornitore(f)]), statoMag.fornitore, 'Tutti i fornitori')}</select></div>
      </div>
      <div class="chips" style="margin-top:10px">
        ${[['', 'Tutti'], ['sotto', `Sotto scorta (${idSotto.size})`], ['scadenza', `In scadenza (${idScad.size})`], ['pao', `PAO superato (${idPao.size})`]].map(([k, n]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${statoMag.filtro === k}">${n}</button>`).join('')}
      </div>
      <ul class="lista" id="mg-lista" style="margin-top:8px"></ul>
    </div>`;
  const disegna = () => {
    const q = normTesto(statoMag.q).trim();
    const lista = prodotti.filter((p) => {
      if (statoMag.categoria && p.categoria !== statoMag.categoria) return false;
      if (statoMag.marca && p.marca !== statoMag.marca) return false;
      if (statoMag.fornitore && p.fornitoreId !== statoMag.fornitore) return false;
      if (statoMag.filtro === 'sotto' && !idSotto.has(p.id)) return false;
      if (statoMag.filtro === 'scadenza' && !idScad.has(p.id)) return false;
      if (statoMag.filtro === 'pao' && !idPao.has(p.id)) return false;
      if (q && !normTesto([p.nome, p.marca, p.linea, p.codiceColore, p.codiceFornitore, p.categoria].join(' ')).includes(q)) return false;
      return true;
    });
    $('#mg-lista', el).innerHTML = lista.map((p) => {
      const g = gia.get(p.id) || 0;
      return `<li><div class="riga" style="cursor:default;flex-wrap:wrap">
        <button type="button" class="principale" data-apri="${esc(p.id)}" style="background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;min-height:44px;flex:1 1 220px">
          <span class="titolo">${esc(nomeProdotto(p))}</span> ${badgeProdotto(p, g)}
          <div class="sotto">${esc([descrProdotto(p), p.categoria].filter(Boolean).join(' · '))}${Number(p.scortaMinima) ? ` · scorta min. ${esc(fmtQta(p.scortaMinima, p.unita))}` : ''}</div>
        </button>
        <strong style="min-width:70px;text-align:right;${g < 0 ? 'color:var(--pericolo)' : ''}">${esc(fmtQta(g, p.unita))}</strong>
        <span class="gruppo-btn"><button type="button" class="btn btn-piccolo" data-mov="carico:${esc(p.id)}" aria-label="Carico ${esc(p.nome)}">+ Carico</button><button type="button" class="btn btn-piccolo" data-mov="consumo:${esc(p.id)}" aria-label="Scarico ${esc(p.nome)}">− Usa</button></span>
      </div></li>`;
    }).join('') || `<li class="vuoto">${prodotti.length ? 'Nessun prodotto corrisponde ai filtri.' : 'Nessun prodotto. Aggiungi il primo con “Nuovo prodotto”.'}</li>`;
    $$('[data-apri]', el).forEach((b) => b.addEventListener('click', () => apriProdotto(b.dataset.apri)));
    $$('[data-mov]', el).forEach((b) => b.addEventListener('click', async () => { const [t, id] = b.dataset.mov.split(':'); apriMovimento(await Repo.prodotti.get(id), t); }));
  };
  disegna();
  $('#mg-q', el).addEventListener('input', (e) => { statoMag.q = e.target.value; disegna(); });
  for (const [sel, k] of [['#mg-cat', 'categoria'], ['#mg-marca', 'marca'], ['#mg-forn', 'fornitore']]) $(sel, el).addEventListener('change', (e) => { statoMag[k] = e.target.value; disegna(); });
  $$('[data-f]', el).forEach((b) => b.addEventListener('click', () => { statoMag.filtro = b.dataset.f; $$('[data-f]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); disegna(); }));
  $('#mg-nuovo', el).addEventListener('click', () => apriModuloProdotto(null));
  $('#mg-ordina', el)?.addEventListener('click', () => creaOrdiniSottoScorta().catch(erroreUI));
}

/* ----- Scheda prodotto ----- */
async function apriProdotto(id) {
  const p = await Repo.prodotti.get(id); if (!p) { toast('Prodotto non trovato.'); return; }
  const [g, mov, forn, foto] = await Promise.all([giacenzaDi(id), Repo.movimenti_magazzino.query('prodottoId', id), p.fornitoreId ? Repo.fornitori.get(p.fornitoreId) : null, p.fotoId ? Repo.foto.get(p.fotoId) : null]);
  mov.sort((a, b) => b.data.localeCompare(a.data));
  const pao = scadenzaPAO(p);
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
      ${foto ? `<img src="${urlFoto(foto.blob)}" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:12px;border:1px solid var(--bordo)">` : ''}
      <div style="flex:1;min-width:200px">
        <div class="muted">${esc([descrProdotto(p), p.categoria].filter(Boolean).join(' · '))}</div>
        <div style="font-size:1.6rem;font-weight:750;${g < 0 ? 'color:var(--pericolo)' : ''}">${esc(fmtQta(g, p.unita))}</div>
        <div>${badgeProdotto(p, g)}</div>
      </div>
    </div>
    <div class="gruppo-btn" style="margin:12px 0">
      ${Object.entries(TIPI_MOVIMENTO).filter(([k]) => k !== 'vendita' || p.uso !== 'interno').map(([k, v]) => `<button type="button" class="btn btn-piccolo ${k === 'carico' ? 'btn-primario' : ''}" data-tipo="${k}">${esc(v.nome)}</button>`).join('')}
    </div>
    <dl class="kv">
      ${p.codiceColore ? `<dt>Codice colore</dt><dd>${esc(p.codiceColore)}</dd>` : ''}
      <dt>Scorta minima</dt><dd>${Number(p.scortaMinima) ? esc(fmtQta(p.scortaMinima, p.unita)) : '—'}</dd>
      <dt>Costo</dt><dd>${p.costoCent != null ? F.euro(p.costoCent) + ` / ${esc(p.unita || 'pz')}` : '—'}</dd>
      ${p.uso !== 'interno' ? `<dt>Prezzo di vendita</dt><dd>${p.prezzoVenditaCent != null ? F.euro(p.prezzoVenditaCent) : '—'}</dd>` : ''}
      <dt>Uso</dt><dd>${esc(USI_PRODOTTO[p.uso] || '—')}</dd>
      <dt>Fornitore</dt><dd>${forn ? (moduloAttivo('fornitori') ? `<a href="#/fornitore/${encodeURIComponent(forn.id)}" data-chiudi-mod>${esc(nomeFornitore(forn))}</a>` : esc(nomeFornitore(forn))) : '—'}${p.codiceFornitore ? ` · cod. ${esc(p.codiceFornitore)}` : ''}</dd>
      <dt>Lotto</dt><dd>${esc(p.lotto || '—')}</dd>
      <dt>Scadenza</dt><dd>${p.scadenza ? esc(F.dataKey(p.scadenza)) : '—'}</dd>
      <dt>Aperto il</dt><dd>${p.dataApertura ? esc(F.dataKey(p.dataApertura)) : '—'}${Number(p.paoMesi) ? ` · PAO ${p.paoMesi} mesi${pao ? ` (fino al ${esc(F.dataKey(pao))})` : ''}` : ''}</dd>
    </dl>
    ${p.note ? `<div class="box box-info"><strong>Note</strong>${esc(p.note).replace(/\n/g, '<br>')}</div>` : ''}
    <div id="pr-appunti"></div>
    <h3 style="margin-top:14px">Movimenti (${mov.length})</h3>
    <ul class="lista">${mov.slice(0, 80).map((m) => `<li class="riga" style="cursor:default;min-height:48px"><span class="principale"><span class="titolo">${esc(TIPI_MOVIMENTO[m.tipo]?.nome || m.tipo)}</span>${m.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}<div class="sotto">${esc(F.dataOra(new Date(m.data)))}${m.riferimento ? ` · ${esc(m.riferimento.tipo === 'ordine' ? 'da ordine' : m.riferimento.tipo === 'scheda' ? 'da scheda lavoro' : m.riferimento.tipo)}` : ''}${m.lotto ? ` · lotto ${esc(m.lotto)}` : ''}${m.nota ? ` · ${esc(m.nota)}` : ''}</div></span><strong style="color:${m.quantita < 0 ? 'var(--pericolo)' : 'var(--ok)'}">${m.quantita > 0 ? '+' : ''}${esc(fmtQta(m.quantita, p.unita))}</strong></li>`).join('') || '<li class="vuoto">Nessun movimento.</li>'}</ul>
    ${mov.length > 80 ? `<p class="muted piccolo">Mostrati gli ultimi 80 movimenti su ${mov.length}.</p>` : ''}
    <div class="gruppo-btn" style="margin-top:12px">
      <button type="button" class="btn" data-az="aperto">Segna aperto oggi</button>
      ${moduloAttivo('ordini') ? '<button type="button" class="btn" data-az="ordina">Aggiungi a un ordine</button>' : ''}
      <button type="button" class="btn" data-az="modifica">Modifica</button>
      <button type="button" class="btn btn-ghost" data-az="archivia" style="color:var(--pericolo)">Archivia</button>
    </div>`;
  const m = apriModale({ titolo: nomeProdotto(p), corpo, grande: true, azioni: [{ testo: 'Chiudi' }] });
  if (typeof sezioneAppunti === 'function' && moduloAttivo('appunti')) sezioneAppunti($('#pr-appunti', corpo), 'prodotto', p.id, () => m.chiudi());
  $$('[data-chiudi-mod]', corpo).forEach((a) => a.addEventListener('click', () => m.chiudi()));
  $$('[data-tipo]', corpo).forEach((b) => b.addEventListener('click', () => { m.chiudi(); apriMovimento(p, b.dataset.tipo); }));
  const az = {
    aperto: async () => { const prec = p.dataApertura || ''; p.dataApertura = D.oggiKey(); await Repo.prodotti.put(p); m.chiudi(); toastAnnulla('Segnato come aperto oggi', async () => { const x = await Repo.prodotti.get(p.id); x.dataApertura = prec; await Repo.prodotti.put(x); }); aggiornaVista(); },
    ordina: async () => { m.chiudi(); await aggiungiAOrdine(p); },
    modifica: () => { m.chiudi(); apriModuloProdotto(p); },
    archivia: async () => {
      if (!(await conferma({ titolo: 'Archiviare il prodotto?', messaggio: 'Non comparirà più nel magazzino; i movimenti restano. Potrai ripristinarlo da Impostazioni → Dati.', ok: 'Archivia' }))) return;
      m.chiudi(); await Repo.prodotti.archivia(p.id); toastAnnulla('Prodotto archiviato', async () => { await Repo.prodotti.ripristina(p.id); }); aggiornaVista();
    }
  };
  $$('[data-az]', corpo).forEach((b) => b.addEventListener('click', () => Promise.resolve(az[b.dataset.az]()).catch(erroreUI)));
}

/* ----- Modulo prodotto ----- */
async function apriModuloProdotto(prod, { dopo } = {}) {
  const p = prod ? clona(prod) : { nome: '', marca: '', linea: '', codiceColore: '', categoria: '', unita: 'pz', scortaMinima: null, costoCent: null, prezzoVenditaCent: null, uso: 'interno', fornitoreId: null, codiceFornitore: '', lotto: '', scadenza: '', paoMesi: null, dataApertura: '', note: '', fotoId: null, archiviato: false };
  const fornitori = await Repo.fornitori.list();
  const marche = [...new Set([...(cfg().marche || []), ...(await Repo.prodotti.list()).map((x) => x.marca)].filter(Boolean))];
  let fotoNuova = null; let rimuoviFoto = false;
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="riga-campi">
      <div class="campo"><label for="pd-nome">Nome *</label><input type="text" id="pd-nome" value="${esc(p.nome)}"></div>
      <div class="campo"><label for="pd-cod">Codice colore</label><input type="text" id="pd-cod" value="${esc(p.codiceColore)}"></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="pd-marca">Marca</label><input type="text" id="pd-marca" list="pd-marche" value="${esc(p.marca)}"><datalist id="pd-marche">${marche.map((x) => `<option value="${esc(x)}">`).join('')}</datalist></div>
      <div class="campo"><label for="pd-linea">Linea</label><input type="text" id="pd-linea" value="${esc(p.linea)}"></div>
      <div class="campo"><label for="pd-cat">Categoria</label><select id="pd-cat"><option value=""></option>${[...new Set([...cfg().categorieProdotti, p.categoria].filter(Boolean))].map((c) => `<option ${c === p.categoria ? 'selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="pd-unita">Unità</label><select id="pd-unita">${Object.keys(UNITA).map((u) => `<option ${u === p.unita ? 'selected' : ''}>${u}</option>`).join('')}</select></div>
      ${prod ? '' : '<div class="campo"><label for="pd-gia">Giacenza iniziale</label><input type="text" id="pd-gia" inputmode="decimal" placeholder="0"></div>'}
      <div class="campo"><label for="pd-scorta">Scorta minima</label><input type="text" id="pd-scorta" inputmode="decimal" value="${esc(p.scortaMinima ?? '')}"></div>
      <div class="campo"><label for="pd-uso">Uso</label><select id="pd-uso">${Object.entries(USI_PRODOTTO).map(([k, v]) => `<option value="${k}" ${k === p.uso ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="pd-costo">Costo d'acquisto (€ per unità)</label><input type="text" id="pd-costo" inputmode="decimal" value="${F.testoDaCent(p.costoCent)}"></div>
      <div class="campo"><label for="pd-prezzo">Prezzo di vendita (€)</label><input type="text" id="pd-prezzo" inputmode="decimal" value="${F.testoDaCent(p.prezzoVenditaCent)}"></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="pd-forn">Fornitore preferito</label><select id="pd-forn"><option value=""></option>${fornitori.map((f) => `<option value="${esc(f.id)}" ${f.id === p.fornitoreId ? 'selected' : ''}>${esc(nomeFornitore(f))}</option>`).join('')}</select></div>
      <div class="campo"><label for="pd-codf">Codice del fornitore</label><input type="text" id="pd-codf" value="${esc(p.codiceFornitore)}"></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="pd-lotto">Lotto</label><input type="text" id="pd-lotto" value="${esc(p.lotto)}"></div>
      <div class="campo"><label for="pd-scad">Scadenza</label><input type="date" id="pd-scad" value="${esc(p.scadenza)}"></div>
      <div class="campo"><label for="pd-pao">PAO (mesi dopo l'apertura)</label><input type="number" id="pd-pao" min="0" inputmode="numeric" value="${esc(p.paoMesi ?? '')}"></div>
      <div class="campo"><label for="pd-aperto">Data di apertura</label><input type="date" id="pd-aperto" value="${esc(p.dataApertura)}"></div>
    </div>
    <div class="campo"><label for="pd-note">Note</label><textarea id="pd-note">${esc(p.note || '')}</textarea></div>
    <div class="campo"><span class="etichetta">Foto</span><div class="gruppo-btn"><button type="button" class="btn btn-piccolo" id="pd-foto">📷 ${p.fotoId ? 'Cambia foto' : 'Aggiungi foto'}</button>${p.fotoId ? '<button type="button" class="btn btn-piccolo" id="pd-foto-via">Rimuovi foto</button>' : ''}<span id="pd-foto-stato" class="muted piccolo"></span></div></div>`;
  const s = (q) => $(q, corpo);
  s('#pd-foto').addEventListener('click', async () => {
    const f = await scegliFile('image/*'); if (!f) return;
    fotoNuova = await comprimiFoto(f, 800, 0.8); rimuoviFoto = false; s('#pd-foto-stato').textContent = 'Foto pronta';
  });
  s('#pd-foto-via')?.addEventListener('click', () => { rimuoviFoto = true; fotoNuova = null; s('#pd-foto-stato').textContent = 'La foto verrà rimossa'; });
  const numero = (v) => { const t = String(v || '').trim().replace(',', '.'); if (!t) return null; const n = Number(t); return Number.isFinite(n) ? qta(n) : null; };
  const m = apriModale({ titolo: prod ? 'Modifica prodotto' : 'Nuovo prodotto', corpo, grande: true, azioni: [{ testo: 'Annulla' }, { testo: 'Salva', classe: 'btn-primario', onClick: async () => {

      note: s('#pd-note').value.trim()
    });
    if (rimuoviFoto && p.fotoId) { await Repo.foto.delete(p.fotoId); p.fotoId = null; }

    toast(prod ? 'Prodotto aggiornato' : 'Prodotto aggiunto');
    aggiornaVista();
    return true;
  } }] });
  const ok = await m.promessa;
  if (ok && dopo) dopo(p);
  return ok ? p : null;
}

/* ----- Modulo movimento (carico, scarico, consumo, vendita, reso, rettifica) ----- */
async function apriMovimento(p, tipo) {
  if (!p) return;
  const g = await giacenzaDi(p.id);
  const t = TIPI_MOVIMENTO[tipo];
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <p style="margin-top:0"><strong>${esc(nomeProdotto(p))}</strong> · giacenza attuale <strong>${esc(fmtQta(g, p.unita))}</strong></p>
    ${tipo === 'rettifica'
      ? `<div class="campo"><label for="mv-q">Quantità contata (${esc(p.unita || 'pz')})</label><input type="text" id="mv-q" inputmode="decimal" value="${esc(String(g).replace('.', ','))}"><span class="aiuto" id="mv-diff"></span></div>`
      : `<div class="campo"><label for="mv-q">Quantità (${esc(p.unita || 'pz')})</label><input type="text" id="mv-q" inputmode="decimal" value="1"></div>`}
    ${tipo === 'carico' ? `<div class="riga-campi">
      <div class="campo"><label for="mv-costo">Costo unitario (€)</label><input type="text" id="mv-costo" inputmode="decimal" value="${F.testoDaCent(p.costoCent)}"></div>
      <div class="campo"><label for="mv-lotto">Lotto</label><input type="text" id="mv-lotto" value="${esc(p.lotto || '')}"></div>
      <div class="campo"><label for="mv-scad">Scadenza</label><input type="date" id="mv-scad" value="${esc(p.scadenza || '')}"></div></div>` : ''}
    ${tipo === 'vendita' ? `<div class="riga-campi">
      <div class="campo"><label for="mv-imp">Importo incassato (€)</label><input type="text" id="mv-imp" inputmode="decimal" value="${F.testoDaCent(p.prezzoVenditaCent)}"></div>
      <div class="campo"><label for="mv-pag">Pagamento</label><select id="mv-pag"><option></option>${PAGAMENTI.map((x) => `<option>${esc(x)}</option>`).join('')}</select></div></div>` : ''}
    <div class="campo"><label for="mv-nota">${tipo === 'rettifica' ? 'Causale *' : 'Nota'}</label><input type="text" id="mv-nota" placeholder="${tipo === 'rettifica' ? 'es. inventario, prodotto rotto, errore di carico' : ''}"></div>`;
  const s = (q) => $(q, corpo);
  const leggiQ = () => { const n = Number(String(s('#mv-q').value).replace(',', '.')); return Number.isFinite(n) ? qta(n) : NaN; };
  if (tipo === 'rettifica') s('#mv-q').addEventListener('input', () => { const n = leggiQ(); s('#mv-diff').textContent = Number.isNaN(n) ? '' : `Differenza: ${n - g > 0 ? '+' : ''}${fmtQta(n - g, p.unita)}`; });
  if (tipo === 'vendita') s('#mv-q').addEventListener('input', () => { const n = leggiQ(); if (!Number.isNaN(n) && p.prezzoVenditaCent != null) s('#mv-imp').value = F.testoDaCent(Math.round(n * p.prezzoVenditaCent)); });
  apriModale({ titolo: t.nome, corpo, azioni: [{ testo: 'Annulla' }, { testo: 'Registra', classe: 'btn-primario', onClick: async () => {
    const n = leggiQ();
    if (Number.isNaN(n) || (tipo !== 'rettifica' && !(n > 0)) || (tipo === 'rettifica' && n < 0)) { toast('Controlla la quantità.'); return false; }
    const nota = s('#mv-nota').value.trim();
    if (tipo === 'rettifica' && !nota) { toast('Indica la causale della rettifica.'); return false; }
    if (t.segno < 0 && !(await controllaNegativo(p, n))) return false;
    let rec;
    if (tipo === 'rettifica') {
      const delta = qta(n - g); if (!delta) { toast('Nessuna differenza da registrare.'); return true; }
      rec = await registraMovimento({ prodottoId: p.id, tipo, quantita: delta, nota });
    } else if (tipo === 'carico') {
      const costo = F.centDaTesto(s('#mv-costo').value); const lotto = s('#mv-lotto').value.trim(); const scad = s('#mv-scad').value;
      rec = await registraMovimento({ prodottoId: p.id, tipo, quantita: n, nota, costoCent: costo, lotto });
      const prec = { costoCent: p.costoCent, lotto: p.lotto, scadenza: p.scadenza };
      if (costo != null) p.costoCent = costo; if (lotto) p.lotto = lotto; if (scad) p.scadenza = scad;
      await Repo.prodotti.put(p);
      toastAnnulla(`Carico registrato: +${fmtQta(n, p.unita)}`, async () => { await Repo.movimenti_magazzino.delete(rec.id); const x = await Repo.prodotti.get(p.id); Object.assign(x, prec); await Repo.prodotti.put(x); });
      aggiornaVista(); return true;
    } else if (tipo === 'vendita') {
      rec = await registraMovimento({ prodottoId: p.id, tipo, quantita: n, nota: [s('#mv-pag').value, nota].filter(Boolean).join(' · '), importoCent: F.centDaTesto(s('#mv-imp').value) ?? 0 });
    } else rec = await registraMovimento({ prodottoId: p.id, tipo, quantita: n, nota });
    toastAnnulla(`Registrato: ${t.nome.toLowerCase()} di ${fmtQta(n, p.unita)}`, async () => { await Repo.movimenti_magazzino.delete(rec.id); });
    aggiornaVista(); return true;
  } }] });
}

<script>
'use strict';
/* =====================================================================================
   FORNITORI E ORDINI
   ===================================================================================== */
function fornitoreVuoto() {
  return { ragioneSociale: '', piva: '', referente: '', telefono: '', whatsapp: '', email: '', sito: '', indirizzo: '', condizioniPagamento: '', tempiConsegna: '', minimoOrdineCent: null, speseSpedizioneCent: null, sconti: '', note: '', archiviato: false };
}
function totaleOrdine(o, { soloRicevuto = false } = {}) {
  const righe = (o.righe || []).reduce((t, r) => t + Math.round((soloRicevuto ? Number(r.ricevuta) || 0 : Number(r.quantita) || 0) * (Number(r.costoCent) || 0)), 0);
  return righe + (Number(o.speseSpedizioneCent) || 0);
}
// Spesa effettiva: ciò che è stato ricevuto (ordini ricevuti o ricevuti in parte), alla data di ricezione
function spesaOrdine(o) { return ['ricevuto', 'parziale'].includes(o.stato) ? totaleOrdine(o, { soloRicevuto: true }) : 0; }
function dataSpesaOrdine(o) { return o.dataRicezione || o.dataInvio || o.dataCreazione; }

/* ----- Elenco fornitori ----- */
async function vistaFornitori(el) {

  fornitori.sort((a, b) => nomeFornitore(a).localeCompare(nomeFornitore(b), 'it'));
  const anno = String(new Date().getFullYear());

    <div class="intestazione"><h1>Fornitori <span class="muted" style="font-weight:400">(${fornitori.length})</span></h1>
      <button class="btn btn-primario" type="button" id="fo-nuovo">${icona('piu')} Nuovo fornitore</button></div>

    $('#fo-lista', el).innerHTML = lista.map((f) => {
      const np = prodotti.filter((p) => p.fornitoreId === f.id).length;

      const spesa = ord.filter((o) => (dataSpesaOrdine(o) || '').startsWith(anno)).reduce((t, o) => t + spesaOrdine(o), 0);
      return `<li><a class="riga" href="#/fornitore/${encodeURIComponent(f.id)}"><span class="principale"><span class="titolo">${esc(nomeFornitore(f))}</span>${f.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}
        <div class="sotto">${[f.referente, f.telefono ? telefonoLeggibile(normalizzaTelefono(f.telefono)) : '', `${np} prodott${np === 1 ? 'o' : 'i'}`, aperti ? `${aperti} ordin${aperti === 1 ? 'e' : 'i'} aperti` : '', spesa ? `spesa ${anno}: ${F.euro(spesa)}` : ''].filter(Boolean).map(esc).join(' · ')}</div></span>${icona('destra')}</a></li>`;
    }).join('') || `<li class="vuoto">${fornitori.length ? 'Nessun fornitore trovato.' : 'Nessun fornitore. Aggiungi il primo.'}</li>`;
    $$('#fo-lista .riga > svg', el).forEach((s) => { s.style.width = '20px'; s.style.color = 'var(--testo-2)'; });
  };
  disegna();
  $('#fo-q', el).addEventListener('input', disegna);
  $('#fo-nuovo', el).addEventListener('click', async () => { const f = await apriModuloFornitore(null); if (f) vai(`#/fornitore/${encodeURIComponent(f.id)}`); });
}

/* ----- Modulo fornitore ----- */

  corpo.innerHTML = `
    <div class="riga-campi">${campo('f-rs', 'Ragione sociale *', f.ragioneSociale)}${campo('f-piva', 'Partita IVA', f.piva, 'text', 'inputmode="numeric"')}${campo('f-ref', 'Referente', f.referente)}</div>
    <div class="riga-campi">${campo('f-tel', 'Telefono', f.telefono, 'tel')}${campo('f-wa', 'WhatsApp (se diverso)', f.whatsapp, 'tel')}${campo('f-email', 'Email', f.email, 'email')}${campo('f-sito', 'Sito web', f.sito, 'url')}</div>
    ${campo('f-ind', 'Indirizzo', f.indirizzo)}
    <div class="riga-campi">${campo('f-pag', 'Condizioni di pagamento', f.condizioniPagamento)}${campo('f-tempi', 'Tempi di consegna', f.tempiConsegna, 'text', 'placeholder="es. 2–3 giorni lavorativi"')}</div>
    <div class="riga-campi">${campo('f-min', 'Minimo d\'ordine (€)', F.testoDaCent(f.minimoOrdineCent), 'text', 'inputmode="decimal"')}${campo('f-sped', 'Spese di spedizione (€)', F.testoDaCent(f.speseSpedizioneCent), 'text', 'inputmode="decimal"')}${campo('f-sconti', 'Sconti', f.sconti)}</div>
    <div class="campo"><label for="f-note">Note</label><textarea id="f-note">${esc(f.note || '')}</textarea></div>`;
  const s = (q) => $(q, corpo);
  const m = apriModale({ titolo: forn ? 'Modifica fornitore' : 'Nuovo fornitore', corpo, grande: true, azioni: [{ testo: 'Annulla' }, { testo: 'Salva', classe: 'btn-primario', onClick: async () => {
    const rs = s('#f-rs').value.trim(); if (!rs) { toast('La ragione sociale è obbligatoria.'); return false; }
    Object.assign(f, {
      ragioneSociale: rs, piva: s('#f-piva').value.trim(), referente: s('#f-ref').value.trim(),
      telefono: s('#f-tel').value.trim() ? normalizzaTelefono(s('#f-tel').value) : '', whatsapp: s('#f-wa').value.trim() ? normalizzaTelefono(s('#f-wa').value) : '',
      email: s('#f-email').value.trim(), sito: s('#f-sito').value.trim(), indirizzo: s('#f-ind').value.trim(),
      condizioniPagamento: s('#f-pag').value.trim(), tempiConsegna: s('#f-tempi').value.trim(),
      minimoOrdineCent: F.centDaTesto(s('#f-min').value), speseSpedizioneCent: F.centDaTesto(s('#f-sped').value), sconti: s('#f-sconti').value.trim(), note: s('#f-note').value.trim()
    });
    await Repo.fornitori.put(f); toast(forn ? 'Fornitore aggiornato' : 'Fornitore aggiunto'); aggiornaVista(); return true;
  } }] });
  return (await m.promessa) ? f : null;
}

/* ----- Scheda fornitore ----- */

  const f = await Repo.fornitori.get(id);

  const wa = f.whatsapp || f.telefono;
  const oggi = D.oggiKey();
  el.innerHTML = `
    <div class="intestazione">

        ${wa ? `<a class="btn btn-wa" href="${esc(linkWhatsApp(wa, ''))}" target="_blank" rel="noopener">${icona('wa')} WhatsApp</a>` : ''}
        ${f.email ? `<a class="btn" href="mailto:${esc(f.email)}">Email</a>` : ''}

          <dl class="kv">
            <dt>Telefono</dt><dd>${esc(telefonoLeggibile(f.telefono) || '—')}</dd>
            ${f.whatsapp ? `<dt>WhatsApp</dt><dd>${esc(telefonoLeggibile(f.whatsapp))}</dd>` : ''}
            <dt>Email</dt><dd>${esc(f.email || '—')}</dd>
            <dt>Indirizzo</dt><dd>${esc(f.indirizzo || '—')}</dd>
            <dt>Pagamento</dt><dd>${esc(f.condizioniPagamento || '—')}</dd>
            <dt>Consegna</dt><dd>${esc(f.tempiConsegna || '—')}</dd>
            <dt>Minimo d'ordine</dt><dd>${f.minimoOrdineCent != null ? F.euro(f.minimoOrdineCent) : '—'}</dd>
            <dt>Spedizione</dt><dd>${f.speseSpedizioneCent != null ? F.euro(f.speseSpedizioneCent) : '—'}</dd>
            <dt>Sconti</dt><dd>${esc(f.sconti || '—')}</dd>
          </dl>
          ${f.note ? `<div class="box box-info" style="margin-top:10px"><strong>Note</strong>${esc(f.note).replace(/\n/g, '<br>')}</div>` : ''}
        </div>
        <div class="card"><div class="card-titolo"><h2>Spesa</h2></div>
          <div class="riga-campi">
            <div class="campo"><label for="fs-da">Dal</label><input type="date" id="fs-da" value="${oggi.slice(0, 4)}-01-01"></div>
            <div class="campo"><label for="fs-a">Al</label><input type="date" id="fs-a" value="${oggi}"></div>
          </div>
          <div class="stat"><div class="val" id="fs-tot"></div><div class="lab">Merce ricevuta nel periodo (con spedizione)</div></div>
          ${anni.length ? `<ul class="lista" style="margin-top:8px">${anni.map((a) => `<li class="riga" style="cursor:default;min-height:44px"><span class="principale">${a}</span><strong>${F.euro(ord.filter((o) => (dataSpesaOrdine(o) || '').startsWith(a)).reduce((t, o) => t + spesaOrdine(o), 0))}</strong></li>`).join('')}</ul>` : ''}
