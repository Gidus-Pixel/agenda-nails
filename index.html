<script>
'use strict';
/* =====================================================================================
   CLOUD CIFRATO — backup automatico e sincronizzazione tra dispositivi (iPad, iPhone, PC)
   - Ogni record viene cifrato SUL DISPOSITIVO (AES-GCM 256) con una chiave ricavata dalla
     password dell'estetista (PBKDF2-SHA256). Il server riceve solo blocchi illeggibili.
   - Anche il "nome" dei record è nascosto: si usa un HMAC di archivio+id.
   - Regola sui conflitti: vince la modifica più recente (updatedAt).
   - Lo stato del cloud (token, chiave) resta su questo dispositivo: non va nei backup.
   ===================================================================================== */
const CLOUD_ARCHIVI = Object.keys(ARCHIVI).filter((n) => n !== 'meta');
const CLOUD_ITERAZIONI = 310000;
const CLOUD_TESTO_VERIFICA = 'agenda-nails:password-ok';
const CLOUD_MAX_BYTE_RICHIESTA = 4 * 1024 * 1024;
let statoCloud = null;            // copia in memoria di meta 'cloud'
let chiaviCloud = null;           // { aes: CryptoKey, hmac: CryptoKey }
let syncInCorso = null;
let ultimoEsitoCloud = { stato: 'spento', testo: '' };
let ignoraEventoDati = false;
let timerSync = null;

const cloudAttivo = () => !!(statoCloud && statoCloud.token && statoCloud.chiave && statoCloud.attivo);
const urlCloud = () => String((statoCloud && statoCloud.url) || cfg().cloud?.url || '').replace(/\/+$/, '');

/* ---------- chiavi e cifratura ---------- */
async function derivaChiaviCloud(password, saleB64) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
  const bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64InBuf(saleB64), iterations: CLOUD_ITERAZIONI, hash: 'SHA-256' }, base, 512));
  return { aesRaw: bits.slice(0, 32), hmacRaw: bits.slice(32) };
}
async function importaChiaviCloud(aesRaw, hmacRaw) {
  return {
    aes: await crypto.subtle.importKey('raw', aesRaw, 'AES-GCM', false, ['encrypt', 'decrypt']),
    hmac: await crypto.subtle.importKey('raw', hmacRaw, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign'])
  };
}
async function cifraBytes(chiavi, bytes) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chiavi.aes, bytes));
  const out = new Uint8Array(12 + ct.length); out.set(iv); out.set(ct, 12); return out;
}
async function decifraBytes(chiavi, bytes) {
  return new Uint8Array(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, chiavi.aes, bytes.subarray(12)));
}
async function creaVerificatore(chiavi) { return bufInB64(await cifraBytes(chiavi, new TextEncoder().encode(CLOUD_TESTO_VERIFICA))); }
async function controllaVerificatore(chiavi, ver) {
  try { return new TextDecoder().decode(await decifraBytes(chiavi, b64InBuf(ver))) === CLOUD_TESTO_VERIFICA; } catch (e) { return false; }
}
async function chiaveRecord(chiavi, archivio, id) {
  const firma = new Uint8Array(await crypto.subtle.sign('HMAC', chiavi.hmac, new TextEncoder().encode(`${archivio}\u0000${id}`)));
  return bufInB64(firma).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
// Formato in chiaro: [1 byte versione][4 byte lunghezza JSON][JSON][eventuali byte della foto]
async function impacchetta(oggetto, blob) {
  const j = new TextEncoder().encode(JSON.stringify(oggetto));
  const bin = blob ? new Uint8Array(await blob.arrayBuffer()) : new Uint8Array(0);
  const out = new Uint8Array(5 + j.length + bin.length);
  out[0] = 1; new DataView(out.buffer).setUint32(1, j.length); out.set(j, 5); out.set(bin, 5 + j.length);
  return out;
}
function spacchetta(bytes) {
  if (bytes[0] !== 1) throw new Error('Formato cloud non riconosciuto');
  const n = new DataView(bytes.buffer, bytes.byteOffset).getUint32(1);
  const oggetto = JSON.parse(new TextDecoder().decode(bytes.subarray(5, 5 + n)));
  const resto = bytes.subarray(5 + n);
  return { oggetto, binario: resto.length ? resto : null };
}

/* ---------- stato locale ---------- */
async function caricaStatoCloud() {
  statoCloud = await leggiMeta('cloud', null);
  chiaviCloud = null;
  if (statoCloud && statoCloud.chiave && statoCloud.hmac) chiaviCloud = await importaChiaviCloud(b64InBuf(statoCloud.chiave), b64InBuf(statoCloud.hmac));
}
async function salvaStatoCloud(modifiche) {
  statoCloud = { ...(statoCloud || {}), ...modifiche };
  await scriviMeta('cloud', statoCloud);
}

/* ---------- chiamate al server ---------- */
async function chiamaCloud(percorso, { metodo = 'GET', corpo = null, autenticato = true, url = null } = {}) {
  const base = (url || urlCloud()).replace(/\/+$/, '');
  if (!base) throw Object.assign(new Error('Indirizzo del servizio cloud non impostato.'), { codice: 'url' });
  const ctrl = new AbortController(); const t = setTimeout(() => ctrl.abort(), 45000);
  let r;
  try {
    r = await fetch(base + percorso, {
      method: metodo, signal: ctrl.signal, cache: 'no-store',
      headers: { ...(corpo ? { 'Content-Type': 'application/json' } : {}), ...(autenticato && statoCloud?.token ? { Authorization: `Bearer ${statoCloud.token}` } : {}) },
      body: corpo ? JSON.stringify(corpo) : undefined
    });
  } catch (e) { throw Object.assign(new Error('Cloud non raggiungibile (sei offline?)'), { codice: 'rete' }); }
  finally { clearTimeout(t); }
  let dati = {}; try { dati = await r.json(); } catch (e) { /* risposta vuota */ }
  if (!r.ok) throw Object.assign(new Error(dati.messaggio || `Errore del cloud (${r.status})`), { codice: dati.errore || String(r.status), stato: r.status });
  return dati;
}

/* ---------- eliminazioni definitive (servono agli altri dispositivi) ---------- */
async function registraEliminazioni(coppie) {
  if (!cloudAttivo() || !coppie.length) return;
  const quando = new Date().toISOString();
  await Repo.meta.putMany(coppie.filter(([a]) => CLOUD_ARCHIVI.includes(a)).map(([archivio, id]) => ({ id: `elim:${archivio}:${id}`, valore: { archivio, recordId: id, quando } })));
}

/* ---------- invio ---------- */
async function raccogliModifiche({ tutto = false } = {}) {
  const dopo = tutto ? '' : (statoCloud.ultimoPush || '');
  const out = [];
  for (const archivio of CLOUD_ARCHIVI) {
    const tutti = await richiesta(db.transaction(archivio).objectStore(archivio).getAll());
    for (const r of tutti) if (!dopo || !r.updatedAt || r.updatedAt > dopo) out.push({ archivio, record: r });
  }
  const elim = (await richiesta(db.transaction('meta').objectStore('meta').getAll())).filter((m) => m.id.startsWith('elim:'));
  return { record: out, eliminazioni: elim };
}
async function preparaRecord(archivio, record) {
  let blob = null; let r = record;
  if (archivio === 'foto' && record.blob instanceof Blob) { const { blob: b, ...resto } = record; blob = b; r = { ...resto, blobTipo: b.type || 'image/jpeg' }; }
  const bytes = await cifraBytes(chiaviCloud, await impacchetta({ a: archivio, r }, blob));
  return { k: await chiaveRecord(chiaviCloud, archivio, record.id), d: bufInB64(bytes), byte: bytes.length };
}
async function inviaModifiche({ tutto = false, avanzamento = null } = {}) {
  const inizio = new Date().toISOString();
  const { record, eliminazioni } = await raccogliModifiche({ tutto });
  const voci = [...record.map((x) => ({ tipo: 'r', ...x })), ...eliminazioni.map((m) => ({ tipo: 'e', meta: m }))];
  let lotto = []; let byte = 0; let inviati = 0;
  const invia = async () => {
    if (!lotto.length) return;
    const r = await chiamaCloud('/v1/push', { metodo: 'POST', corpo: { generazione: statoCloud.generazione, record: lotto.map(({ k, d }) => ({ k, d })) } });
    // se nessun altro dispositivo ha scritto nel frattempo, non serve riscaricare i propri record
    if (r.seq - lotto.length === (statoCloud.ultimoSeq || 0)) await salvaStatoCloud({ ultimoSeq: r.seq });
    inviati += lotto.length; if (avanzamento) avanzamento(inviati, voci.length);
    lotto = []; byte = 0;
  };
  for (const v of voci) {
    let p;
    if (v.tipo === 'r') p = await preparaRecord(v.archivio, v.record);
    else {
      const { archivio, recordId, quando } = v.meta.valore;
      const bytes = await cifraBytes(chiaviCloud, await impacchetta({ a: archivio, id: recordId, eliminato: true, quando }, null));
      p = { k: await chiaveRecord(chiaviCloud, archivio, recordId), d: bufInB64(bytes), byte: bytes.length };
    }
    if (lotto.length && (byte + p.byte * 1.4 > CLOUD_MAX_BYTE_RICHIESTA || lotto.length >= 200)) await invia();
    lotto.push(p); byte += p.byte * 1.4;
  }
  await invia();
  if (eliminazioni.length) { const tx = db.transaction('meta', 'readwrite'); for (const m of eliminazioni) tx.objectStore('meta').delete(m.id); await fineTransazione(tx); }
  await salvaStatoCloud({ ultimoPush: inizio });
  return voci.length;
}

/* ---------- ricezione ---------- */
async function applicaRicevuti(voci) {
  if (!voci.length) return { cambiati: 0, config: false };
  const tx = db.transaction(CLOUD_ARCHIVI, 'readwrite');
  let cambiati = 0; let config = false;
  for (const v of voci) {
    const st = tx.objectStore(v.archivio);
    const id = v.eliminato ? v.id : v.record.id;
    const req = st.get(id);
    req.onsuccess = () => {
      const locale = req.result;
      if (v.eliminato) {
        if (locale && (locale.updatedAt || '') <= v.quando) { st.delete(id); cambiati++; }
        return;
      }
      if (locale && (v.record.updatedAt || '') === (locale.updatedAt || '') && v.archivio !== 'foto') return; // già uguale
      if (!locale || (v.record.updatedAt || '') >= (locale.updatedAt || '')) {
        st.put(v.record); cambiati++;
        if (v.archivio === 'impostazioni') config = true;
      }
    };
  }
  await fineTransazione(tx);
  return { cambiati, config };
}
async function riceviModifiche() {
  let totale = 0; let config = false;
  for (let giro = 0; giro < 1000; giro++) {
    const r = await chiamaCloud(`/v1/pull?dopo=${statoCloud.ultimoSeq || 0}&limite=300`);
    if (r.generazione !== statoCloud.generazione) { await cambioGenerazione(r.generazione); return { totale, config: true, sostituiti: true }; }
    const voci = [];
    for (const x of r.record) {
      try {
        const { oggetto, binario } = spacchetta(await decifraBytes(chiaviCloud, b64InBuf(x.d)));
        if (!CLOUD_ARCHIVI.includes(oggetto.a)) continue;
        if (oggetto.eliminato) voci.push({ archivio: oggetto.a, eliminato: true, id: oggetto.id, quando: oggetto.quando });
        else {
          const rec = oggetto.r;
          if (oggetto.a === 'foto' && binario) { rec.blob = new Blob([binario], { type: rec.blobTipo || 'image/jpeg' }); delete rec.blobTipo; }
          voci.push({ archivio: oggetto.a, record: rec });
        }
      } catch (e) { console.warn('Record del cloud non leggibile', e); }
    }
    ignoraEventoDati = true;
    try { const esito = await applicaRicevuti(voci); totale += esito.cambiati; config = config || esito.config; }
    finally { ignoraEventoDati = false; }
    await salvaStatoCloud({ ultimoSeq: r.ultimo });
    if (!r.altri) break;
  }
  return { totale, config };
}
// I dati nel cloud sono stati sostituiti da un altro dispositivo (ripristino o nuova password)
async function cambioGenerazione(nuova) {
  const st = await chiamaCloud('/v1/stato');
  if (!(await controllaVerificatore(chiaviCloud, st.verificatore))) {
    await salvaStatoCloud({ serveNuovaPassword: true, attivo: false });
    throw Object.assign(new Error('La password del cloud è stata cambiata su un altro dispositivo: inseriscila di nuovo.'), { codice: 'password' });
  }
  try { await creaCopiaRipristino('prima'); } catch (e) { console.warn(e); }
  const tx = db.transaction(CLOUD_ARCHIVI, 'readwrite'); for (const a of CLOUD_ARCHIVI) tx.objectStore(a).clear(); await fineTransazione(tx);
  await salvaStatoCloud({ generazione: nuova, ultimoSeq: 0, ultimoPush: new Date().toISOString() });
  await riceviModifiche();
  toast('I dati sono stati sostituiti da un altro dispositivo collegato (ripristino di un backup). Una copia della situazione precedente è nei punti di ripristino.', { durata: 9000 });
}

/* ---------- ciclo di sincronizzazione ---------- */
async function sincronizza({ manuale = false, tutto = false } = {}) {
  if (!cloudAttivo() || !chiaviCloud) return null;
  if (syncInCorso) return syncInCorso;
  if (!navigator.onLine && !manuale) { impostaEsitoCloud('offline', 'In attesa di connessione'); return null; }
  syncInCorso = (async () => {
    impostaEsitoCloud('sync', 'Sincronizzazione…');
    try {
      const ricevuti = await riceviModifiche();
      let inviati;
      try { inviati = await inviaModifiche({ tutto }); }
      catch (e) { if (e.stato === 409) { await riceviModifiche(); inviati = await inviaModifiche({ tutto }); } else throw e; }
      await salvaStatoCloud({ ultimaSync: new Date().toISOString(), ultimoErrore: null });
      impostaEsitoCloud('ok', `Sincronizzato alle ${D.hhmm(new Date())}`);
      if (ricevuti.config) { await caricaConfig(); disegnaMenu(); }
      if (ricevuti.totale || ricevuti.config) aggiornaDopoSync();
      if (manuale) toast(ricevuti.totale || inviati ? `Sincronizzato: ${inviati} inviati, ${ricevuti.totale} ricevuti` : 'Tutto già sincronizzato');
      return { ricevuti: ricevuti.totale, inviati };
    } catch (e) {
      const stato = e.codice === 'rete' ? 'offline' : 'errore';
      impostaEsitoCloud(stato, e.message);
      await salvaStatoCloud({ ultimoErrore: e.message });
      if (e.stato === 401) await salvaStatoCloud({ attivo: false, scollegato: true });
      if (manuale || (stato === 'errore' && e.codice !== 'rete')) toast(e.message, { errore: true, durata: 8000 });
      const pannello = $('#i-cloud'); if (pannello && stato === 'errore') sezioneCloud(pannello).catch(console.warn);
      return null;
    } finally { syncInCorso = null; }
  })();
  return syncInCorso;
}
function aggiornaDopoSync() {
  if (bloccata) return;
  if (rottaCorrente.id === 'agenda' && calendario) { calendario.refetchEvents(); return; }
  if (!modaliAperte.length) aggiornaVista();
}
function programmaSync(ritardoMs = 4000) {
  if (!cloudAttivo()) return;
  clearTimeout(timerSync); timerSync = setTimeout(() => sincronizza(), ritardoMs);
}
function impostaEsitoCloud(stato, testo) {
  ultimoEsitoCloud = { stato, testo };
  const b = $('#tb-cloud'); if (!b) return;
  b.classList.toggle('nascosto', !statoCloud || (!statoCloud.attivo && !statoCloud.serveNuovaPassword && !statoCloud.scollegato));
  b.dataset.stato = stato;
  b.title = testo; b.setAttribute('aria-label', `Cloud: ${testo}`);
}
function avviaSyncAutomatica() {
  Bus.addEventListener('dati', (e) => { if (!ignoraEventoDati && e.detail?.archivio !== 'meta') programmaSync(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) programmaSync(500); });
  window.addEventListener('online', () => programmaSync(500));
  setInterval(() => { if (!document.hidden) sincronizza(); }, 2 * 60 * 1000);
  if (statoCloud?.serveNuovaPassword) impostaEsitoCloud('errore', 'Serve di nuovo la password del cloud');
  else if (statoCloud?.scollegato) impostaEsitoCloud('errore', 'Dispositivo scollegato dal cloud');
  else if (cloudAttivo()) { impostaEsitoCloud('ok', statoCloud.ultimaSync ? `Ultima sincronizzazione ${F.dataOra(new Date(statoCloud.ultimaSync))}` : 'Cloud attivo'); programmaSync(1500); }
}
// Dopo un ripristino di backup con il cloud attivo: il cloud viene sostituito con questi dati
async function cloudSostituisciTutto() {
  if (!cloudAttivo()) return;
  const r = await chiamaCloud('/v1/reset', { metodo: 'POST', corpo: { sale: statoCloud.sale, verificatore: await creaVerificatore(chiaviCloud) } });
  const tx = db.transaction('meta', 'readwrite'); const st = tx.objectStore('meta');
  const req = st.getAll(); req.onsuccess = () => { for (const m of req.result) if (m.id.startsWith('elim:')) st.delete(m.id); };
  await fineTransazione(tx);
  await salvaStatoCloud({ generazione: r.generazione, ultimoSeq: 0, ultimoPush: '' });
  await sincronizza({ tutto: true });
}

/* ---------- attivazione, collegamento, gestione (Impostazioni) ---------- */
function nomeDispositivoPredefinito() {
  const ua = navigator.userAgent;
  if (/iPad/i.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) return 'iPad';
  if (/iPhone/i.test(ua)) return 'iPhone';
  if (/Android/i.test(ua)) return /Mobile/i.test(ua) ? 'Telefono Android' : 'Tablet Android';
  return 'Computer';
}
async function attivaCloud({ url, licenza, password, nome }) {
  const sale = bufInB64(crypto.getRandomValues(new Uint8Array(16)));
  const { aesRaw, hmacRaw } = await derivaChiaviCloud(password, sale);
  const chiavi = await importaChiaviCloud(aesRaw, hmacRaw);
  const r = await chiamaCloud('/v1/attiva', { metodo: 'POST', autenticato: false, url, corpo: { licenza, sale, verificatore: await creaVerificatore(chiavi), nomeDispositivo: nome } });
  await salvaStatoCloud({ url, spazioId: r.spazioId, dispositivoId: r.dispositivoId, token: r.token, chiave: bufInB64(aesRaw), hmac: bufInB64(hmacRaw), sale, generazione: r.generazione, ultimoSeq: 0, ultimoPush: '', attivo: true, attivatoIl: new Date().toISOString(), serveNuovaPassword: false, scollegato: false });
  chiaviCloud = chiavi;
}
async function collegaCloud({ url, codice, password, nome }) {
  const r = await chiamaCloud('/v1/collega', { metodo: 'POST', autenticato: false, url, corpo: { codice, nomeDispositivo: nome } });
  // il token resta valido anche se la password è sbagliata: la si può reinserire
  await salvaStatoCloud({ url, spazioId: r.spazioId, dispositivoId: r.dispositivoId, token: r.token, sale: r.sale, generazione: r.generazione, ultimoSeq: 0, ultimoPush: '', attivo: false, serveNuovaPassword: true, scollegato: false, verificatore: r.verificatore });
  return impostaPasswordCloud(password, r.verificatore);
}
async function impostaPasswordCloud(password, verificatore = null) {
  let ver = verificatore; let sale = statoCloud.sale;
  if (!ver) { const info = await chiamaCloud('/v1/stato'); ver = info.verificatore; sale = info.sale; }
  const { aesRaw, hmacRaw } = await derivaChiaviCloud(password, sale);
  const chiavi = await importaChiaviCloud(aesRaw, hmacRaw);
  if (!(await controllaVerificatore(chiavi, ver))) return false;
  await salvaStatoCloud({ chiave: bufInB64(aesRaw), hmac: bufInB64(hmacRaw), sale, serveNuovaPassword: false, verificatore: undefined });
  chiaviCloud = chiavi;
  return true;
}
async function cambiaPasswordCloud(nuova) {
  const sale = bufInB64(crypto.getRandomValues(new Uint8Array(16)));
  const { aesRaw, hmacRaw } = await derivaChiaviCloud(nuova, sale);
  const chiavi = await importaChiaviCloud(aesRaw, hmacRaw);
  const r = await chiamaCloud('/v1/reset', { metodo: 'POST', corpo: { sale, verificatore: await creaVerificatore(chiavi) } });
  await salvaStatoCloud({ chiave: bufInB64(aesRaw), hmac: bufInB64(hmacRaw), sale, generazione: r.generazione, ultimoSeq: 0, ultimoPush: '' });
  chiaviCloud = chiavi;
  await sincronizza({ tutto: true });
}
async function scollegaCloud({ remoto = true } = {}) {
  if (remoto && statoCloud?.dispositivoId) { try { await chiamaCloud(`/v1/dispositivi/${statoCloud.dispositivoId}`, { metodo: 'DELETE' }); } catch (e) { console.warn(e); } }
  await Repo.meta.delete('cloud');
  statoCloud = null; chiaviCloud = null; impostaEsitoCloud('spento', '');
}

    } catch (e) { erroreUI(e); }
  });
  $('#cl-pw', cont).addEventListener('click', async () => {
    const corpo = document.createElement('div');
    corpo.innerHTML = `<p style="margin-top:0">Tutti i dati vengono cifrati di nuovo e caricati con la nuova password. Sugli altri dispositivi collegati verrà chiesta la nuova password.</p>
      <div class="campo"><label for="cl-pw1">Nuova password</label><input type="password" id="cl-pw1" autocomplete="new-password"></div>
      <div class="campo"><label for="cl-pw2">Ripeti</label><input type="password" id="cl-pw2" autocomplete="new-password"></div>`;
    apriModale({ titolo: 'Cambia password del cloud', corpo, azioni: [{ testo: 'Annulla' }, { testo: 'Cambia password', classe: 'btn-primario', onClick: async () => {
      const a = $('#cl-pw1', corpo).value; if (a.length < 8) { toast('Almeno 8 caratteri.'); return false; }
      if (a !== $('#cl-pw2', corpo).value) { toast('Le password non coincidono.'); return false; }
      await cambiaPasswordCloud(a); toast('Password del cloud cambiata.'); sezioneCloud(cont); return true;
    } }] });
  });
  $('#cl-esci', cont).addEventListener('click', async () => {
    if (!(await conferma({ titolo: 'Scollegare questo dispositivo?', messaggio: 'I dati restano su questo dispositivo, ma non verranno più salvati nel cloud né sincronizzati con gli altri.', ok: 'Scollega', pericolo: true }))) return;
    await sincronizza(); await scollegaCloud({ remoto: true }); toast('Dispositivo scollegato dal cloud'); sezioneCloud(cont);
  });
  $$('[data-cl-revoca]', cont).forEach((b) => b.addEventListener('click', async () => {
    if (!(await conferma({ titolo: 'Scollegare quel dispositivo?', messaggio: 'Non potrà più ricevere né inviare dati finché non viene ricollegato con un nuovo codice. Usalo se un telefono o un tablet è stato perso.', ok: 'Scollega', pericolo: true }))) return;
    await chiamaCloud(`/v1/dispositivi/${b.dataset.clRevoca}`, { metodo: 'DELETE' }); sezioneCloud(cont);
  }));
}
// Secondo dispositivo: unire o sostituire i dati locali con quelli del cloud
async function completaCollegamento(avanzamento) {
  const locali = (await Repo.clienti.count()) + (await Repo.appuntamenti.count()) + (await Repo.prodotti.count());
  let scelta = 'sostituisci';
  if (locali) {
    scelta = await apriModale({ titolo: 'Ci sono già dati su questo dispositivo', corpo: `<p>Su questo dispositivo ci sono già clienti o appuntamenti. Cosa vuoi fare?</p>
      <ul><li><strong>Unisci</strong>: tieni i dati di qui e aggiungi quelli del cloud (in caso di doppioni vince la modifica più recente).</li>
      <li><strong>Usa solo i dati del cloud</strong>: i dati di qui vengono sostituiti (prima viene creato un punto di ripristino).</li></ul>`, chiudibile: false, azioni: [
      { testo: 'Usa solo i dati del cloud', valore: 'sostituisci' }, { testo: 'Unisci', valore: 'unisci', classe: 'btn-primario' }] }).promessa || 'sostituisci';
  }
  if (scelta === 'sostituisci' && locali) {
    try { await creaCopiaRipristino('prima'); } catch (e) { console.warn(e); }
    const tx = db.transaction(CLOUD_ARCHIVI, 'readwrite'); for (const a of CLOUD_ARCHIVI) tx.objectStore(a).clear(); await fineTransazione(tx);
  }
  await salvaStatoCloud({ attivo: true, attivatoIl: new Date().toISOString(), ultimoPush: scelta === 'unisci' ? '' : new Date().toISOString() });
  await riceviModifiche();
  if (scelta === 'unisci') await inviaModifiche({ tutto: true, avanzamento });
  await salvaStatoCloud({ ultimaSync: new Date().toISOString() });
  await caricaConfig(); disegnaMenu();
  toast('Dispositivo collegato: i dati sono allineati.', { durata: 6000 });
}
</script>
<script>
'use strict';
/* =====================================================================================
   AVVIO
   ===================================================================================== */
async function seminaServizi() {
  if (await leggiMeta('seedServizi')) return;
  if (!(await Repo.servizi.count()) && Array.isArray(CONFIG.servizi) && CONFIG.servizi.length) {
    await Repo.servizi.putMany(CONFIG.servizi.filter((s) => s && s.nome).map((s, i) => ({ ...normalizzaServizio(s, i), archiviato: false })));
  }
  await scriviMeta('seedServizi', true);
}
function erroreFatale(titolo, dettaglio) {
  const a = $('#avvio');
  a.innerHTML = `<div class="errore-fatale card"><h1>${esc(titolo)}</h1><p>${esc(dettaglio)}</p><p class="muted piccolo">I dati già salvati non sono stati modificati.</p><button class="btn btn-primario" onclick="location.reload()">Riprova</button></div>`;
}
async function avvia() {
  try { db = await apriDB(); }
  catch (e) { erroreFatale('Impossibile aprire l\'archivio dei dati', (e && e.message ? e.message : String(e)) + ' — Se stai usando una finestra di navigazione in incognito/privata, apri l\'agenda in una finestra normale di Chrome o Edge.'); return; }
  try {
    await eseguiMigrazioniAvvio();
    await caricaConfig();
    await caricaStatoCloud();
    await seminaServizi();
    if (!(await leggiMeta('persistenzaRichiesta'))) { await richiediPersistenza(); await scriviMeta('persistenzaRichiesta', new Date().toISOString()); }
  } catch (e) { console.error(e); erroreFatale('Avvio non riuscito', e.message || String(e)); return; }
  avviaPWA();
  await assicuraCalendario();
  disegnaMenu();
  $('#tb-nuovo').addEventListener('click', () => apriModuloAppuntamento({}).catch(erroreUI));
  $('#tb-blocca').addEventListener('click', () => bloccaApp().catch(erroreUI));
  Bus.addEventListener('config', () => disegnaMenu());
  if (await pinImpostato()) await bloccaApp();
  await mostraRotta();
  $('#avvio').remove();
  aggiornaPulsanteBlocco();
  avviaControlloInattivita();
  avviaAdattamentoTastiera();
  avviaCopieAutomatiche();
  avviaSyncAutomatica();
  $('#tb-cloud').addEventListener('click', () => {
    if (ultimoEsitoCloud.stato === 'errore' || !cloudAttivo()) { vai('#/impostazioni'); setTimeout(() => $('#cloud')?.scrollIntoView({ behavior: 'smooth' }), 400); }
    else sincronizza({ manuale: true });
  });
  if (!bloccata) guidaInstallazioneIOS().catch(erroreUI);
  if (!window.FullCalendar) toast('Il calendario non si è caricato: serve internet al primo avvio, oppure la cartella “vendor” accanto al file. Clienti, magazzino e schede funzionano comunque.', { errore: true, durata: 9000 });
  // Backup automatico in cartella (se configurato): silenzioso, al massimo uno al giorno
  const auto = () => backupAutomatico().catch((e) => console.warn('Backup automatico non riuscito', e));
  setTimeout(auto, 5000); setInterval(auto, 60 * 60 * 1000);
}
window.addEventListener('error', (e) => { console.error(e.error || e.message); });
window.addEventListener('unhandledrejection', (e) => { erroreUI(e.reason); });
avvia();
</script>
