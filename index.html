        <div class="card"><div class="card-titolo"><h2>Prodotti forniti (${forniti.length})</h2>${moduloAttivo('magazzino') ? `<button class="btn btn-piccolo" type="button" data-az="prodotto">${icona('piu')} Prodotto</button>` : ''}</div>
          <ul class="lista">${forniti.map((p) => { const g = gia.get(p.id) || 0; return `<li><button type="button" class="riga" data-prod="${esc(p.id)}"><span class="principale"><span class="titolo">${esc(nomeProdotto(p))}</span> ${badgeProdotto(p, g)}<div class="sotto">${esc([descrProdotto(p), p.codiceFornitore ? `cod. ${p.codiceFornitore}` : '', p.costoCent != null ? F.euro(p.costoCent) : ''].filter(Boolean).join(' · '))}</div></span><strong>${esc(fmtQta(g, p.unita))}</strong></button></li>`; }).join('') || '<li class="vuoto">Nessun prodotto collegato. Nel prodotto scegli questo fornitore come “preferito”.</li>'}</ul></div>
        <div class="card"><div class="gruppo-btn">${f.archiviato ? '<button class="btn" type="button" data-az="ripristina">Ripristina fornitore</button>' : '<button class="btn btn-ghost" type="button" data-az="archivia" style="color:var(--pericolo)">Archivia fornitore</button>'}</div></div>
      </div>
    </div>`;
  const aggTot = () => {
    const da = $('#fs-da', el).value || '0000-01-01', a = $('#fs-a', el).value || '9999-12-31';
    $('#fs-tot', el).textContent = F.euro(ord.filter((o) => { const d = (dataSpesaOrdine(o) || '').slice(0, 10); return d >= da && d <= a; }).reduce((t, o) => t + spesaOrdine(o), 0));
  };
  aggTot(); $('#fs-da', el).addEventListener('change', aggTot); $('#fs-a', el).addEventListener('change', aggTot);
  if (typeof sezioneAppunti === 'function' && moduloAttivo('appunti')) sezioneAppunti($('#fo-appunti', el), 'fornitore', id);
  $$('[data-ordine]', el).forEach((b) => b.addEventListener('click', async () => apriOrdine({ ordine: await Repo.ordini_fornitore.get(b.dataset.ordine) })));
  $$('[data-prod]', el).forEach((b) => b.addEventListener('click', () => apriProdotto(b.dataset.prod)));
  const az = {
    ordine: () => apriOrdine({ fornitoreId: id }),
    modifica: () => apriModuloFornitore(f),
    prodotto: () => apriModuloProdotto({ ...{ nome: '', marca: '', linea: '', codiceColore: '', categoria: '', unita: 'pz', uso: 'interno', archiviato: false }, fornitoreId: id }).then(() => aggiornaVista()),
    ripristina: async () => { await Repo.fornitori.ripristina(id); aggiornaVista(); },
    archivia: async () => {
      if (!(await conferma({ titolo: 'Archiviare il fornitore?', messaggio: 'Prodotti e ordini restano; il fornitore non comparirà più negli elenchi.', ok: 'Archivia' }))) return;
      await Repo.fornitori.archivia(id); toastAnnulla('Fornitore archiviato', async () => { await Repo.fornitori.ripristina(id); }); vai('#/fornitori');
    }
  };
  $$('[data-az]', el).forEach((b) => b.addEventListener('click', () => Promise.resolve(az[b.dataset.az]()).catch(erroreUI)));
}

/* ----- Ordini ----- */
function rigaOrdine(o, forn) {
  const st = STATI_ORDINE[o.stato] || STATI_ORDINE.bozza;
  const n = (o.righe || []).length;
  return `<li><button type="button" class="riga" data-ordine="${esc(o.id)}">
    <span class="barra" style="background:${st.colore}"></span>
    <span class="principale"><span class="titolo">${forn ? esc(nomeFornitore(forn)) : `Ordine del ${esc(F.dataKey((o.dataCreazione || '').slice(0, 10)))}`}${o.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}</span>
      <div class="sotto">${forn ? `${esc(F.dataKey((o.dataCreazione || '').slice(0, 10)))} · ` : ''}${n} rig${n === 1 ? 'a' : 'he'} · ${F.euro(totaleOrdine(o))}${o.dataInvio ? ` · inviato ${esc(F.dataKey(o.dataInvio.slice(0, 10)))}` : ''}${o.dataRicezione ? ` · ricevuto ${esc(F.dataKey(o.dataRicezione.slice(0, 10)))}` : ''}</div></span>
    <span class="stato" style="background:${st.colore}">${st.nome}</span></button></li>`;
}
const statoOrdini = { filtro: 'aperti' };
async function vistaOrdini(el) {
  const [ordini, mf] = await Promise.all([Repo.ordini_fornitore.list(), mappaFornitori()]);
  ordini.sort((a, b) => (b.dataCreazione || '').localeCompare(a.dataCreazione || ''));
  const filtri = { aperti: ['bozza', 'inviato', 'parziale'], ricevuti: ['ricevuto'], annullati: ['annullato'], tutti: null };
  const conta = (k) => ordini.filter((o) => !filtri[k] || filtri[k].includes(o.stato)).length;
  el.innerHTML = `
    <div class="intestazione"><h1>Ordini ai fornitori</h1>
      <div class="gruppo-btn">${moduloAttivo('magazzino') ? '<button class="btn" type="button" id="or-sotto">Crea dai sotto scorta</button>' : ''}<button class="btn btn-primario" type="button" id="or-nuovo">${icona('piu')} Nuovo ordine</button></div></div>
    <div class="chips" style="margin-bottom:10px">${[['aperti', 'Aperti'], ['ricevuti', 'Ricevuti'], ['annullati', 'Annullati'], ['tutti', 'Tutti']].map(([k, n]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${statoOrdini.filtro === k}">${n} (${conta(k)})</button>`).join('')}</div>
    <div class="card"><ul class="lista" id="or-lista"></ul></div>`;
  const disegna = () => {
    const f = filtri[statoOrdini.filtro];
    $('#or-lista', el).innerHTML = ordini.filter((o) => !f || f.includes(o.stato)).map((o) => rigaOrdine(o, mf.get(o.fornitoreId) || { ragioneSociale: 'Fornitore eliminato' })).join('') || '<li class="vuoto">Nessun ordine.</li>';
    $$('[data-ordine]', el).forEach((b) => b.addEventListener('click', () => apriOrdine({ ordine: ordini.find((o) => o.id === b.dataset.ordine) })));
  };
  disegna();
  $$('[data-f]', el).forEach((b) => b.addEventListener('click', () => { statoOrdini.filtro = b.dataset.f; $$('[data-f]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); disegna(); }));
  $('#or-nuovo', el).addEventListener('click', () => apriOrdine({}));
  $('#or-sotto', el)?.addEventListener('click', () => creaOrdiniSottoScorta().catch(erroreUI));
}

function testoOrdine(o, forn) {
  const righe = (o.righe || []).filter((r) => Number(r.quantita) > 0).map((r) => `• ${String(qta(r.quantita)).replace('.', ',')} × ${r.nome}${r.codiceFornitore ? ` (cod. ${r.codiceFornitore})` : ''}`);
  const att = cfg().attivita;
  return [
    compilaModello(cfg().messaggiOrdine || CONFIG.messaggiOrdine, { attivita: att.nome || '', fornitore: nomeFornitore(forn), referente: forn?.referente || '' }),
    '', ...righe, '',
    o.note ? `Note: ${o.note}` : null,
    [att.nome, att.titolare, att.telefono].filter(Boolean).join(' — ') || null,
    'Grazie!'
  ].filter((x) => x !== null).join('\n');
}

async function apriOrdine({ ordine = null, fornitoreId = null, righeIniziali = null }) {
  const o = ordine ? clona(ordine) : { fornitoreId, righe: righeIniziali || [], stato: 'bozza', dataCreazione: new Date().toISOString(), dataInvio: null, dataRicezione: null, speseSpedizioneCent: null, note: '', archiviato: false };
  const [fornitori, prodotti] = await Promise.all([Repo.fornitori.list(), prodottiAttivi()]);
  if (o.fornitoreId && !fornitori.some((f) => f.id === o.fornitoreId)) { const f = await Repo.fornitori.get(o.fornitoreId); if (f) fornitori.push(f); }
  const modificabile = o.stato === 'bozza';
  const corpo = document.createElement('div');
  const ridisegna = () => {
    const forn = fornitori.find((f) => f.id === o.fornitoreId);
    const tot = totaleOrdine(o);
    const propri = prodotti.filter((p) => p.fornitoreId === o.fornitoreId); const altri = prodotti.filter((p) => p.fornitoreId !== o.fornitoreId);
    corpo.innerHTML = `
      <p style="margin-top:0"><span class="stato" style="background:${STATI_ORDINE[o.stato].colore}">${STATI_ORDINE[o.stato].nome}</span> <span class="muted piccolo">creato il ${esc(F.dataOra(new Date(o.dataCreazione)))}</span></p>
      <div class="campo"><label for="or-forn">Fornitore *</label><select id="or-forn" ${modificabile ? '' : 'disabled'}><option value=""></option>${fornitori.map((f) => `<option value="${esc(f.id)}" ${f.id === o.fornitoreId ? 'selected' : ''}>${esc(nomeFornitore(f))}</option>`).join('')}</select>
        ${modificabile && moduloAttivo('fornitori') ? '<button type="button" class="btn btn-ghost btn-piccolo" id="or-nuovo-forn">+ Nuovo fornitore</button>' : ''}</div>
      ${forn && forn.minimoOrdineCent && tot < forn.minimoOrdineCent ? `<div class="box box-avviso piccolo">Il minimo d'ordine di questo fornitore è ${F.euro(forn.minimoOrdineCent)}.</div>` : ''}
      <fieldset><legend>Righe</legend>
        ${(o.righe || []).map((r, i) => `<div class="riga-campi" style="grid-template-columns: 2.5fr 1fr 1fr ${o.stato !== 'bozza' ? '1fr ' : ''}auto;align-items:end;border-top:1px solid var(--bordo);padding-top:6px">
          <div class="campo"><span class="etichetta">Prodotto</span><div>${esc(r.nome)}${r.codiceFornitore ? ` <span class="muted piccolo">cod. ${esc(r.codiceFornitore)}</span>` : ''}</div></div>
          <div class="campo"><label for="or-q-${i}">Quantità</label><input type="text" inputmode="decimal" id="or-q-${i}" data-r="${i}" data-k="quantita" value="${esc(String(r.quantita).replace('.', ','))}" ${modificabile ? '' : 'disabled'}></div>
          <div class="campo"><label for="or-c-${i}">Costo unit. (€)</label><input type="text" inputmode="decimal" id="or-c-${i}" data-r="${i}" data-k="costoCent" value="${F.testoDaCent(r.costoCent)}" ${modificabile ? '' : 'disabled'}></div>
          ${o.stato !== 'bozza' ? `<div class="campo"><span class="etichetta">Ricevuti</span><div>${esc(String(qta(r.ricevuta || 0)).replace('.', ','))}</div></div>` : ''}
          ${modificabile ? `<button type="button" class="btn btn-ghost" style="margin-bottom:12px" data-rim="${i}" aria-label="Rimuovi riga">${icona('chiudi')}</button>` : '<span></span>'}
        </div>`).join('') || '<p class="muted">Nessuna riga.</p>'}
        ${modificabile ? `<div class="riga-campi" style="margin-top:8px"><select id="or-agg" aria-label="Aggiungi prodotto"><option value="">+ Aggiungi prodotto…</option>
          ${propri.length ? `<optgroup label="Di questo fornitore">${propri.map((p) => `<option value="${esc(p.id)}">${esc(nomeProdotto(p))}${p.marca ? ` — ${esc(p.marca)}` : ''}</option>`).join('')}</optgroup>` : ''}
          ${altri.length ? `<optgroup label="Altri prodotti">${altri.map((p) => `<option value="${esc(p.id)}">${esc(nomeProdotto(p))}${p.marca ? ` — ${esc(p.marca)}` : ''}</option>`).join('')}</optgroup>` : ''}
          </select></div>` : ''}
      </fieldset>
      <div class="riga-campi">
        <div class="campo"><label for="or-sped">Spese di spedizione (€)</label><input type="text" inputmode="decimal" id="or-sped" value="${F.testoDaCent(o.speseSpedizioneCent)}" ${modificabile ? '' : 'disabled'}></div>
        <div class="stat"><div class="val">${F.euro(tot)}</div><div class="lab">Totale ordine</div></div>
      </div>
      <div class="campo"><label for="or-note">Note</label><textarea id="or-note">${esc(o.note || '')}</textarea></div>`;
    const s = (q) => $(q, corpo);
    s('#or-forn').addEventListener('change', (e) => { leggi(); o.fornitoreId = e.target.value || null; const f = fornitori.find((x) => x.id === o.fornitoreId); if (f && o.speseSpedizioneCent == null) o.speseSpedizioneCent = f.speseSpedizioneCent; ridisegna(); });
    s('#or-nuovo-forn')?.addEventListener('click', async () => { leggi(); const f = await apriModuloFornitore(null); if (f) { fornitori.push(f); o.fornitoreId = f.id; } ridisegna(); });
    s('#or-agg')?.addEventListener('change', (e) => {
      leggi(); const p = prodotti.find((x) => x.id === e.target.value); if (!p) return;
      if (o.righe.some((r) => r.prodottoId === p.id)) { toast('Il prodotto è già nell\'ordine.'); ridisegna(); return; }
      o.righe.push({ prodottoId: p.id, nome: nomeProdotto(p) + (p.marca ? ` — ${p.marca}` : ''), codiceFornitore: p.codiceFornitore || '', quantita: 1, costoCent: p.costoCent ?? null, ricevuta: 0 });
      if (!o.fornitoreId && p.fornitoreId) o.fornitoreId = p.fornitoreId;
      ridisegna();
    });
    $$('[data-rim]', corpo).forEach((b) => b.addEventListener('click', () => { leggi(); o.righe.splice(Number(b.dataset.rim), 1); ridisegna(); }));
    $$('[data-r]', corpo).forEach((inp) => inp.addEventListener('change', () => { leggi(); ridisegna(); }));
  };
  const leggi = () => {
    if (!$('#or-note', corpo)) return;
    o.note = $('#or-note', corpo).value.trim();
    if (!modificabile) return;
    $$('[data-r]', corpo).forEach((inp) => {
      const r = o.righe[Number(inp.dataset.r)];
      if (inp.dataset.k === 'quantita') { const n = Number(String(inp.value).replace(',', '.')); r.quantita = Number.isFinite(n) && n > 0 ? qta(n) : r.quantita; }
      else r.costoCent = F.centDaTesto(inp.value);
    });
    o.speseSpedizioneCent = F.centDaTesto($('#or-sped', corpo).value);
  };
  ridisegna();
  const salva = async ({ silenzioso = false } = {}) => {
    leggi();
    if (!o.fornitoreId) { toast('Scegli il fornitore.'); return false; }
    if (!o.righe.length) { toast('Aggiungi almeno un prodotto.'); return false; }
    await Repo.ordini_fornitore.put(o);
    if (!silenzioso) toast('Ordine salvato');
    aggiornaVista(); return true;
  };
  const azioni = [{ testo: 'Chiudi' }];
  if (o.id && o.stato !== 'annullato' && o.stato !== 'ricevuto') azioni.push({ testo: 'Annulla ordine', classe: 'btn-ghost', onClick: async () => {
    if (!(await conferma({ titolo: 'Annullare l\'ordine?', messaggio: o.stato === 'parziale' ? 'La merce già ricevuta resta in magazzino.' : '', ok: 'Annulla ordine', annulla: 'Indietro', pericolo: true }))) return false;
    const prec = o.stato; o.stato = 'annullato'; await Repo.ordini_fornitore.put(o);
    toastAnnulla('Ordine annullato', async () => { const x = await Repo.ordini_fornitore.get(o.id); x.stato = prec; await Repo.ordini_fornitore.put(x); }); aggiornaVista(); return true;
  } });
  if (modificabile) azioni.push({ testo: 'Salva bozza', onClick: () => salva() });
  if (o.stato !== 'annullato') azioni.push({ testo: modificabile ? 'Invia…' : 'Testo ordine', onClick: async ({ chiudi }) => { if (modificabile && !(await salva({ silenzioso: true }))) return false; chiudi(); setTimeout(() => apriInvioOrdine(o), 0); return false; } });
  if (['inviato', 'parziale'].includes(o.stato)) azioni.push({ testo: 'Ricevi merce', classe: 'btn-primario', onClick: ({ chiudi }) => { leggi(); chiudi(); setTimeout(() => apriRicevimento(o), 0); return false; } });
  else if (o.stato !== 'bozza' && o.stato !== 'annullato') azioni.push({ testo: 'Salva note', classe: 'btn-primario', onClick: () => salva() });
  apriModale({ titolo: o.id ? 'Ordine' : 'Nuovo ordine', corpo, grande: true, azioni });
}

async function apriInvioOrdine(o) {
  const forn = await Repo.fornitori.get(o.fornitoreId);
  const corpo = document.createElement('div');
  const wa = forn && (forn.whatsapp || forn.telefono);
  corpo.innerHTML = `
    <p class="muted" style="margin-top:0">Puoi modificare il testo prima di inviarlo. L'invio lo fai tu da WhatsApp o dalla posta.</p>
    <textarea id="io-testo" style="min-height:220px">${esc(testoOrdine(o, forn))}</textarea>
    <div class="gruppo-btn" style="margin-top:10px">
      <button type="button" class="btn" id="io-copia">Copia testo</button>
      ${wa ? `<button type="button" class="btn btn-wa" id="io-wa">${icona('wa')} Apri in WhatsApp</button>` : ''}
      ${forn && forn.email ? '<button type="button" class="btn" id="io-mail">Apri email</button>' : ''}
    </div>
    ${!wa && !(forn && forn.email) ? '<p class="muted piccolo">Aggiungi telefono/WhatsApp o email nella scheda del fornitore per inviare con un tocco.</p>' : ''}`;
  const testo = () => $('#io-testo', corpo).value;
  const segnaInviato = async () => {
    if (o.stato !== 'bozza') return;
    const prec = { stato: o.stato, dataInvio: o.dataInvio };
    o.stato = 'inviato'; o.dataInvio = new Date().toISOString(); await Repo.ordini_fornitore.put(o);
    toastAnnulla('Ordine segnato come inviato', async () => { const x = await Repo.ordini_fornitore.get(o.id); Object.assign(x, prec); await Repo.ordini_fornitore.put(x); });
    aggiornaVista();
  };
  $('#io-copia', corpo).addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(testo()); toast('Testo copiato'); }
    catch (e) { $('#io-testo', corpo).select(); toast('Seleziona il testo e copialo a mano (Ctrl+C).'); }
  });
  $('#io-wa', corpo)?.addEventListener('click', async () => { window.open(linkWhatsApp(wa, testo()), '_blank', 'noopener'); await segnaInviato(); });
  $('#io-mail', corpo)?.addEventListener('click', async () => {
    const ogg = `Ordine ${cfg().attivita.nome || ''} del ${F.data(new Date())}`.replace(/\s+/g, ' ');
    location.href = `mailto:${encodeURIComponent(forn.email)}?subject=${encodeURIComponent(ogg)}&body=${encodeURIComponent(testo())}`;
    await segnaInviato();
  });
  const azioni = [{ testo: 'Chiudi' }];
  if (o.stato === 'bozza') azioni.push({ testo: 'Segna come inviato', classe: 'btn-primario', onClick: async () => { await segnaInviato(); return true; } });
  apriModale({ titolo: 'Invia ordine', corpo, azioni });
}

async function apriRicevimento(o) {
  const mp = await mappaProdotti();
  const corpo = document.createElement('div');
  const righe = (o.righe || []).map((r, i) => ({ r, i, resto: qta(Math.max(0, (Number(r.quantita) || 0) - (Number(r.ricevuta) || 0))) }));
  corpo.innerHTML = `
    <p class="muted" style="margin-top:0">Indica cosa è arrivato. Per ogni quantità viene registrato un carico in magazzino.</p>
    ${righe.map(({ r, i, resto }) => { const p = mp.get(r.prodottoId); return `<div class="riga-campi" style="grid-template-columns: 2fr 1fr 1fr 1fr;align-items:end;border-top:1px solid var(--bordo);padding-top:6px">
      <div class="campo"><span class="etichetta">${esc(r.nome)}</span><span class="aiuto">Ordinati ${esc(String(qta(r.quantita)).replace('.', ','))} · già ricevuti ${esc(String(qta(r.ricevuta || 0)).replace('.', ','))}${!p ? ' · prodotto non più in magazzino' : ''}</span></div>
      <div class="campo"><label for="rc-q-${i}">Arrivati ora</label><input type="text" inputmode="decimal" id="rc-q-${i}" value="${esc(String(resto).replace('.', ','))}" ${p ? '' : 'disabled'}></div>
      <div class="campo"><label for="rc-l-${i}">Lotto</label><input type="text" id="rc-l-${i}" ${p ? '' : 'disabled'}></div>
      <div class="campo"><label for="rc-s-${i}">Scadenza</label><input type="date" id="rc-s-${i}" ${p ? '' : 'disabled'}></div></div>`; }).join('')}
    <label class="check"><input type="checkbox" id="rc-costo" checked> Aggiorna il costo dei prodotti con quello dell'ordine</label>`;
  apriModale({ titolo: 'Ricevi merce', corpo, grande: true, azioni: [{ testo: 'Annulla' }, { testo: 'Registra arrivo', classe: 'btn-primario', onClick: async () => {
    const movimenti = []; const precProdotti = []; const precOrdine = clona(o);
    const aggCosto = $('#rc-costo', corpo).checked;
    for (const { r, i } of righe) {
      const p = mp.get(r.prodottoId); if (!p) continue;
      const n = Number(String($(`#rc-q-${i}`, corpo).value).replace(',', '.'));
      if (!Number.isFinite(n) || n < 0) { toast(`Controlla la quantità di ${r.nome}.`); return false; }
      if (!n) continue;
      const lotto = $(`#rc-l-${i}`, corpo).value.trim(); const scad = $(`#rc-s-${i}`, corpo).value;
      movimenti.push(await registraMovimento({ prodottoId: p.id, tipo: 'carico', quantita: n, nota: `Ordine a ${(await Repo.fornitori.get(o.fornitoreId))?.ragioneSociale || 'fornitore'}`, riferimento: { tipo: 'ordine', id: o.id }, costoCent: r.costoCent, lotto }));
      r.ricevuta = qta((Number(r.ricevuta) || 0) + n);
      precProdotti.push(clona(p));
      if (aggCosto && r.costoCent != null) p.costoCent = r.costoCent;
      if (lotto) p.lotto = lotto; if (scad) p.scadenza = scad;
      await Repo.prodotti.put(p);
    }
    if (!movimenti.length) { toast('Nessuna quantità indicata.'); return false; }
    o.stato = o.righe.every((r) => (Number(r.ricevuta) || 0) >= (Number(r.quantita) || 0) || !mp.get(r.prodottoId)) ? 'ricevuto' : 'parziale';
    o.dataRicezione = new Date().toISOString();
    await Repo.ordini_fornitore.put(o);
    toastAnnulla(o.stato === 'ricevuto' ? 'Ordine ricevuto: magazzino aggiornato' : 'Arrivo parziale registrato', async () => {
      for (const m of movimenti) await Repo.movimenti_magazzino.delete(m.id);
      for (const p of precProdotti) await Repo.prodotti.put(p);
      await Repo.ordini_fornitore.put(precOrdine);
    });
    aggiornaVista(); return true;
  } }] });
}

// Prodotti già presenti in un ordine aperto (con quantità ancora da ricevere)
async function prodottiInOrdiniAperti() {
  const s = new Set();
  for (const o of await Repo.ordini_fornitore.list()) if (['bozza', 'inviato', 'parziale'].includes(o.stato)) for (const r of o.righe || []) if ((Number(r.ricevuta) || 0) < (Number(r.quantita) || 0)) s.add(r.prodottoId);
  return s;
}
async function creaOrdiniSottoScorta() {
  const avv = await avvisiMagazzino();
  const inOrdine = await prodottiInOrdiniAperti();
  const mf = await mappaFornitori();
  const molt = Math.max(1, Number(cfg().magazzino?.moltiplicatoreRiordino) || 2);
  const candidati = [...avv.sottoScorta, ...avv.negativi.filter((x) => !avv.sottoScorta.some((y) => y.p.id === x.p.id))];
  const daOrdinare = candidati.filter(({ p }) => !inOrdine.has(p.id)).map(({ p, g }) => ({ p, g, q: qta(Math.max(1, Math.ceil(Number(p.scortaMinima) * molt - g))) }));
  const giaInOrdine = candidati.length - daOrdinare.length;
  if (!daOrdinare.length) { toast(giaInOrdine ? 'I prodotti sotto scorta sono già tutti in un ordine aperto.' : 'Nessun prodotto sotto scorta.'); return; }
  const gruppi = new Map();
  for (const x of daOrdinare) { const k = x.p.fornitoreId && mf.get(x.p.fornitoreId) ? x.p.fornitoreId : ''; if (!gruppi.has(k)) gruppi.set(k, []); gruppi.get(k).push(x); }
  const corpo = `<p>Proposta: riportare ogni prodotto a ${molt} volte la scorta minima. Potrai cambiare le quantità in ogni bozza.</p>
    ${[...gruppi].map(([k, lista]) => `<h3>${k ? esc(nomeFornitore(mf.get(k))) : 'Senza fornitore preferito'}</h3><ul>${lista.map(({ p, g, q }) => `<li>${esc(nomeProdotto(p))}: hai ${esc(fmtQta(g, p.unita))}, ordina <strong>${esc(fmtQta(q, p.unita))}</strong></li>`).join('')}</ul>`).join('')}
    ${gruppi.has('') ? '<div class="box box-avviso piccolo">Per i prodotti senza fornitore verrà creata una bozza a parte: scegli il fornitore prima di inviarla.</div>' : ''}
    ${giaInOrdine ? `<p class="muted piccolo">${giaInOrdine} prodotti sotto scorta sono già in un ordine aperto e non vengono ripetuti.</p>` : ''}`;
  if (!(await conferma({ titolo: `Creare ${gruppi.size} bozz${gruppi.size === 1 ? 'a' : 'e'} d'ordine?`, messaggio: corpo, ok: 'Crea bozze' }))) return;
  const creati = [];
  for (const [k, lista] of gruppi) {
    const f = k ? mf.get(k) : null;
    creati.push(await Repo.ordini_fornitore.put({ fornitoreId: k || null, righe: lista.map(({ p, q }) => ({ prodottoId: p.id, nome: nomeProdotto(p) + (p.marca ? ` — ${p.marca}` : ''), codiceFornitore: p.codiceFornitore || '', quantita: q, costoCent: p.costoCent ?? null, ricevuta: 0 })), stato: 'bozza', dataCreazione: new Date().toISOString(), dataInvio: null, dataRicezione: null, speseSpedizioneCent: f ? f.speseSpedizioneCent ?? null : null, note: '', archiviato: false }));
  }
  toastAnnulla(`${creati.length} bozz${creati.length === 1 ? 'a creata' : 'e create'}`, async () => { for (const o of creati) await Repo.ordini_fornitore.delete(o.id); });
  statoOrdini.filtro = 'aperti';
  vai('#/ordini');
}
async function aggiungiAOrdine(p) {
  const aperti = (await Repo.ordini_fornitore.list()).filter((o) => o.stato === 'bozza' && (!p.fornitoreId || o.fornitoreId === p.fornitoreId || !o.fornitoreId));
  const riga = { prodottoId: p.id, nome: nomeProdotto(p) + (p.marca ? ` — ${p.marca}` : ''), codiceFornitore: p.codiceFornitore || '', quantita: Math.max(1, Number(p.scortaMinima) || 1), costoCent: p.costoCent ?? null, ricevuta: 0 };
  if (!aperti.length) { apriOrdine({ fornitoreId: p.fornitoreId || null, righeIniziali: [riga] }); return; }
  const mf = await mappaFornitori();
  const scelta = await apriModale({ titolo: 'Aggiungi a un ordine', corpo: '<p>Vuoi aggiungerlo a una bozza esistente o creare un nuovo ordine?</p>', azioni: [
    { testo: 'Nuovo ordine', valore: 'nuovo' },
    ...aperti.slice(0, 3).map((o) => ({ testo: `Bozza ${nomeFornitore(mf.get(o.fornitoreId)) || 'senza fornitore'} (${F.dataKey(o.dataCreazione.slice(0, 10))})`, valore: o.id, classe: 'btn-primario' }))
  ] }).promessa;
  if (!scelta) return;
  if (scelta === 'nuovo') { apriOrdine({ fornitoreId: p.fornitoreId || null, righeIniziali: [riga] }); return; }
  const o = aperti.find((x) => x.id === scelta);
  if (!o.righe.some((r) => r.prodottoId === p.id)) o.righe.push(riga);
  if (!o.fornitoreId && p.fornitoreId) o.fornitoreId = p.fornitoreId;
  await Repo.ordini_fornitore.put(o);
  apriOrdine({ ordine: o });
}
</script>
<script>
'use strict';
/* =====================================================================================
   APPUNTI — note con tag, colori, fissate in alto, promemoria con data e collegamento
   facoltativo a una cliente, un fornitore, un prodotto o un appuntamento.
   ===================================================================================== */
const TIPI_COLLEGAMENTO = { cliente: 'Cliente', fornitore: 'Fornitore', prodotto: 'Prodotto', appuntamento: 'Appuntamento' };

async function nomeCollegamento(c) {
  if (!c || !c.tipo || !c.id) return null;
  try {
    if (c.tipo === 'cliente') { const x = await Repo.clienti.get(c.id); return x ? nomeCliente(x) : 'Cliente eliminata'; }
    if (c.tipo === 'fornitore') { const x = await Repo.fornitori.get(c.id); return x ? nomeFornitore(x) : 'Fornitore eliminato'; }
    if (c.tipo === 'prodotto') { const x = await Repo.prodotti.get(c.id); return x ? nomeProdotto(x) : 'Prodotto eliminato'; }
    if (c.tipo === 'appuntamento') {
      const x = await Repo.appuntamenti.get(c.id); if (!x) return 'Appuntamento eliminato';
      const cl = await Repo.clienti.get(x.clienteId);
      return `${F.giornoBreve(new Date(x.inizio))} ${D.hhmm(new Date(x.inizio))} · ${cl ? nomeCliente(cl) : x.clienteNome || ''}`;
    }
  } catch (e) { /* ignorato */ }
  return null;
}
function apriCollegamento(c) {
  if (!c) return;
  if (c.tipo === 'cliente') vai(`#/cliente/${encodeURIComponent(c.id)}`);
  else if (c.tipo === 'fornitore') vai(`#/fornitore/${encodeURIComponent(c.id)}`);
  else if (c.tipo === 'prodotto') apriProdotto(c.id);
  else if (c.tipo === 'appuntamento') apriDettaglioAppuntamento(c.id);
}
function statoPromemoria(a) {
  if (!a.promemoria || a.fatto) return null;
  const oggi = D.oggiKey();
  if (a.promemoria < oggi) return { classe: 'badge-pericolo', testo: `scaduto ${F.dataKey(a.promemoria)}` };
  if (a.promemoria === oggi) return { classe: 'badge-avviso', testo: 'oggi' };
  return { classe: '', testo: F.dataKey(a.promemoria) };
}
async function promemoriaInArrivo(giorni = 7) {
  const limite = D.aggiungiGiorniKey(D.oggiKey(), giorni);
  return (await Repo.appunti.list()).filter((a) => a.promemoria && !a.fatto && a.promemoria <= limite).sort((a, b) => a.promemoria.localeCompare(b.promemoria));
}
function coloreTestoAppunto() { return '#1f1a1b'; } // gli sfondi degli appunti sono sempre chiari

async function cardAppunto(a) {
  const st = statoPromemoria(a);
  const link = await nomeCollegamento(a.collegamento);
  const sfondo = COLORI_APPUNTI[a.colore] || COLORI_APPUNTI.giallo;
  const testo = a.testo || '';
  return `<article class="appunto" style="background:${sfondo};color:${coloreTestoAppunto()}" data-appunto="${esc(a.id)}" tabindex="0" role="button" aria-label="Apri appunto ${esc(a.titolo || '')}">
    <div style="display:flex;gap:6px;align-items:flex-start">${a.fissato ? '<span title="Fissato in alto" aria-label="Fissato">📌</span>' : ''}<strong style="flex:1">${esc(a.titolo || 'Senza titolo')}</strong>${a.demo ? '<span class="badge badge-demo">PROVA</span>' : ''}</div>
    ${testo ? `<div class="appunto-testo">${esc(testo.length > 320 ? testo.slice(0, 320) + '…' : testo)}</div>` : ''}
    <div class="chips" style="margin-top:6px;gap:4px">
      ${st ? `<span class="badge ${st.classe}">⏰ ${esc(st.testo)}</span>` : (a.promemoria && a.fatto ? '<span class="badge badge-ok">✓ fatto</span>' : '')}
      ${link ? `<button type="button" class="badge" data-link="${esc(a.id)}" style="border:0;cursor:pointer;min-height:28px">🔗 ${esc(TIPI_COLLEGAMENTO[a.collegamento.tipo])}: ${esc(link)}</button>` : ''}
      ${(a.tag || []).map((t) => `<span class="badge">#${esc(t)}</span>`).join('')}
    </div>
  </article>`;
}
function ordinaAppunti(lista) {
  return lista.sort((a, b) => (b.fissato ? 1 : 0) - (a.fissato ? 1 : 0) || (b.updatedAt || '').localeCompare(a.updatedAt || ''));
}
function collegaEventiCard(cont, lista, dopo) {
  $$('[data-appunto]', cont).forEach((el) => {
    const apri = (e) => { if (e.target.closest('[data-link]')) return; apriAppunto({ appunto: lista.find((x) => x.id === el.dataset.appunto), dopo }); };
    el.addEventListener('click', apri);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); apri(e); } });
  });
  $$('[data-link]', cont).forEach((b) => b.addEventListener('click', (e) => { e.stopPropagation(); const a = lista.find((x) => x.id === b.dataset.link); for (const d of [...modaliAperte]) d.close(); apriCollegamento(a.collegamento); }));
}

/* ----- Vista appunti ----- */
const statoAppunti = { q: '', tag: '', filtro: '' };
async function vistaAppunti(el) {
  const tutti = ordinaAppunti(await Repo.appunti.list());
  const tags = [...new Set(tutti.flatMap((a) => a.tag || []))].sort((a, b) => a.localeCompare(b, 'it'));
  el.innerHTML = `
    <div class="intestazione"><h1>Appunti <span class="muted" style="font-weight:400">(${tutti.length})</span></h1>
      <button class="btn btn-primario" type="button" id="ap-nuovo">${icona('piu')} Nuovo appunto</button></div>
    <div class="card" style="margin-bottom:12px">
      <input type="search" id="apn-q" placeholder="Cerca nel titolo, nel testo e nei tag" value="${esc(statoAppunti.q)}" aria-label="Cerca negli appunti" autocomplete="off">
      <div class="chips" style="margin-top:10px">
        ${[['', 'Tutti'], ['fissati', 'Fissati'], ['promemoria', 'Con promemoria'], ['dafare', 'Promemoria da fare']].map(([k, n]) => `<button type="button" class="chip" data-f="${k}" aria-pressed="${statoAppunti.filtro === k}">${n}</button>`).join('')}
      </div>
      ${tags.length ? `<div class="chips" style="margin-top:8px"><button type="button" class="chip" data-tag="" aria-pressed="${!statoAppunti.tag}">Tutti i tag</button>${tags.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${statoAppunti.tag === t}">#${esc(t)}</button>`).join('')}</div>` : ''}
    </div>
    <div class="griglia-appunti" id="apn-lista"></div>`;
  const disegna = async () => {
    const q = normTesto(statoAppunti.q).trim();
    const lista = tutti.filter((a) => {
      if (statoAppunti.tag && !(a.tag || []).includes(statoAppunti.tag)) return false;
      if (statoAppunti.filtro === 'fissati' && !a.fissato) return false;
      if (statoAppunti.filtro === 'promemoria' && !a.promemoria) return false;
      if (statoAppunti.filtro === 'dafare' && !(a.promemoria && !a.fatto)) return false;
      if (q && !q.split(/\s+/).every((p) => normTesto([a.titolo, a.testo, ...(a.tag || [])].join(' ')).includes(p))) return false;
      return true;
    });
    const cont = $('#apn-lista', el);
    cont.innerHTML = lista.length ? (await Promise.all(lista.map(cardAppunto))).join('') : `<p class="vuoto">${tutti.length ? 'Nessun appunto corrisponde.' : 'Nessun appunto. Scrivi il primo con “Nuovo appunto”.'}</p>`;
    collegaEventiCard(cont, lista);
  };
  await disegna();
  $('#apn-q', el).addEventListener('input', (e) => { statoAppunti.q = e.target.value; disegna(); });
  $$('[data-f]', el).forEach((b) => b.addEventListener('click', () => { statoAppunti.filtro = b.dataset.f; $$('[data-f]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); disegna(); }));
  $$('[data-tag]', el).forEach((b) => b.addEventListener('click', () => { statoAppunti.tag = b.dataset.tag; $$('[data-tag]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); disegna(); }));
  $('#ap-nuovo', el).addEventListener('click', () => apriAppunto({}));
}

/* ----- Sezione "Appunti" dentro una scheda collegata (cliente, fornitore, prodotto, appuntamento) ----- */
async function sezioneAppunti(cont, tipo, id, chiudiContenitore) {
  if (!cont) return;
  const lista = ordinaAppunti((await Repo.appunti.list()).filter((a) => a.collegamento && a.collegamento.tipo === tipo && a.collegamento.id === id));
  const ridisegna = () => sezioneAppunti(cont, tipo, id, chiudiContenitore);
  cont.innerHTML = `<div class="card" style="margin-top:12px"><div class="card-titolo"><h2>Appunti (${lista.length})</h2><button type="button" class="btn btn-piccolo" data-nuovo-app>${icona('piu')} Appunto</button></div>
    <div class="griglia-appunti">${(await Promise.all(lista.map(cardAppunto))).join('') || '<p class="vuoto">Nessun appunto collegato.</p>'}</div></div>`;
  collegaEventiCard(cont, lista, ridisegna);
  $('[data-nuovo-app]', cont).addEventListener('click', () => apriAppunto({ collegamento: { tipo, id }, dopo: ridisegna }));
}

/* ----- Modulo appunto ----- */
async function apriAppunto({ appunto = null, collegamento = null, dopo = null }) {
  const a = appunto ? clona(appunto) : { titolo: '', testo: '', tag: [], fissato: false, colore: 'giallo', promemoria: '', fatto: false, collegamento: collegamento || null, archiviato: false };
  let coll = a.collegamento;
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="campo"><label for="an-tit">Titolo</label><input type="text" id="an-tit" value="${esc(a.titolo)}"></div>
    <div class="campo"><label for="an-testo">Testo</label><textarea id="an-testo" style="min-height:140px">${esc(a.testo)}</textarea></div>
    <div class="campo"><label for="an-tag">Tag (separati da virgola)</label><input type="text" id="an-tag" value="${esc((a.tag || []).join(', '))}" placeholder="es. ordini, idee, formazione"></div>
    <div class="campo"><span class="etichetta">Colore</span><div class="chips">${Object.entries(COLORI_APPUNTI).map(([k, v]) => `<button type="button" class="chip" data-col="${k}" aria-pressed="${a.colore === k}" style="background:${v};color:#1f1a1b;border:2px solid ${a.colore === k ? 'var(--testo)' : 'var(--bordo)'}">${k}</button>`).join('')}</div></div>
    <label class="check"><input type="checkbox" id="an-fiss" ${a.fissato ? 'checked' : ''}> 📌 Fissa in alto</label>
    <div class="riga-campi">
      <div class="campo"><label for="an-prom">Promemoria il</label><input type="date" id="an-prom" value="${esc(a.promemoria || '')}"></div>
      <label class="check" style="align-self:end;margin-bottom:12px"><input type="checkbox" id="an-fatto" ${a.fatto ? 'checked' : ''}> Fatto</label>
    </div>
    <fieldset><legend>Collegamento (facoltativo)</legend>
      <div id="an-coll-scelto"></div>
      <div class="riga-campi" id="an-coll-cerca">
        <select id="an-coll-tipo" aria-label="Collega a">${Object.entries(TIPI_COLLEGAMENTO).filter(([k]) => (k !== 'fornitore' || moduloAttivo('fornitori')) && (k !== 'prodotto' || moduloAttivo('magazzino')) && (k !== 'appuntamento' || moduloAttivo('agenda'))).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>
        <input type="search" id="an-coll-q" placeholder="Cerca da collegare…" aria-label="Cerca elemento da collegare" autocomplete="off">
      </div>
      <div class="risultati nascosto" id="an-coll-ris"></div>
    </fieldset>`;
  const s = (q) => $(q, corpo);
  let colore = a.colore || 'giallo';
  $$('[data-col]', corpo).forEach((b) => b.addEventListener('click', () => { colore = b.dataset.col; $$('[data-col]', corpo).forEach((x) => { x.setAttribute('aria-pressed', String(x === b)); x.style.borderColor = x === b ? 'var(--testo)' : 'var(--bordo)'; }); }));
  const mostraColl = async () => {
    const nome = await nomeCollegamento(coll);
    s('#an-coll-scelto').innerHTML = coll && nome ? `<div class="cliente-scelta"><span style="flex:1">🔗 ${esc(TIPI_COLLEGAMENTO[coll.tipo])}: <strong>${esc(nome)}</strong></span><button type="button" class="btn btn-piccolo" id="an-coll-via">Scollega</button></div>` : '';
    s('#an-coll-cerca').classList.toggle('nascosto', !!(coll && nome));
    s('#an-coll-via')?.addEventListener('click', () => { coll = null; mostraColl(); });
  };
  await mostraColl();
  const cerca = async () => {
    const tipo = s('#an-coll-tipo').value; const q = normTesto(s('#an-coll-q').value).trim(); const ris = s('#an-coll-ris');
    if (!q) { ris.classList.add('nascosto'); return; }
    let voci = [];
    if (tipo === 'cliente') voci = (await Repo.clienti.list()).filter((c) => normTesto(nomeCliente(c) + ' ' + (c.telefono || '')).includes(q)).map((c) => [c.id, nomeCliente(c)]);
    if (tipo === 'fornitore') voci = (await Repo.fornitori.list()).filter((f) => normTesto(nomeFornitore(f)).includes(q)).map((f) => [f.id, nomeFornitore(f)]);
    if (tipo === 'prodotto') voci = (await Repo.prodotti.list()).filter((p) => normTesto([p.nome, p.marca, p.codiceColore].join(' ')).includes(q)).map((p) => [p.id, nomeProdotto(p) + (p.marca ? ` — ${p.marca}` : '')]);
    if (tipo === 'appuntamento') {
      const mc = await mappaClienti();
      voci = (await Repo.appuntamenti.list()).filter((x) => normTesto(nomeCliente(mc.get(x.clienteId)) + ' ' + F.data(new Date(x.inizio))).includes(q))
        .sort((x, y) => y.inizio.localeCompare(x.inizio)).map((x) => [x.id, `${F.giornoBreve(new Date(x.inizio))} ${D.hhmm(new Date(x.inizio))} · ${nomeCliente(mc.get(x.clienteId))}`]);
    }
    ris.innerHTML = voci.slice(0, 8).map(([id, n]) => `<button type="button" data-id="${esc(id)}">${esc(n)}</button>`).join('') || '<div class="vuoto">Nessun risultato</div>';
    ris.classList.remove('nascosto');
    $$('[data-id]', ris).forEach((b) => b.addEventListener('click', () => { coll = { tipo, id: b.dataset.id }; s('#an-coll-q').value = ''; ris.classList.add('nascosto'); mostraColl(); }));
  };
  s('#an-coll-q').addEventListener('input', cerca);
  s('#an-coll-tipo').addEventListener('change', cerca);
  const azioni = [{ testo: 'Annulla' }];
  if (appunto) azioni.push({ testo: 'Elimina', classe: 'btn-pericolo', onClick: async () => {
    await Repo.appunti.archivia(appunto.id);
    toastAnnulla('Appunto eliminato', async () => { await Repo.appunti.ripristina(appunto.id); if (dopo) dopo(); });
    if (dopo) dopo(); else aggiornaVista(); return true;
  } });
  azioni.push({ testo: 'Salva', classe: 'btn-primario', onClick: async () => {
    const titolo = s('#an-tit').value.trim(); const testo = s('#an-testo').value.trim();
    if (!titolo && !testo) { toast('Scrivi almeno un titolo o un testo.'); return false; }
    Object.assign(a, { titolo, testo, tag: [...new Set(s('#an-tag').value.split(',').map((t) => t.trim().replace(/^#/, '')).filter(Boolean))], colore, fissato: s('#an-fiss').checked, promemoria: s('#an-prom').value, fatto: s('#an-fatto').checked, collegamento: coll });
    await Repo.appunti.put(a); toast(appunto ? 'Appunto aggiornato' : 'Appunto salvato');
    if (dopo) dopo(); else aggiornaVista(); return true;
  } });
  apriModale({ titolo: appunto ? 'Appunto' : 'Nuovo appunto', corpo, grande: true, azioni, onApri: () => { if (!appunto) setTimeout(() => s('#an-tit').focus(), 50); } });
}

<script>
'use strict';
/* =====================================================================================
   REPORT — incassi, servizi più richiesti, no-show, consumi, vendite, spesa fornitori.
   Esportazione CSV con separatore ";" e virgola decimale (Excel in italiano).
   ===================================================================================== */
const statoReport = { preset: 'mese', da: '', a: '', gruppo: '' };

function periodoReport() {
  const oggi = new Date(); const k = D.oggiKey(); const y = oggi.getFullYear(), m = oggi.getMonth();
  const kk = (yy, mm, gg) => D.key(new Date(yy, mm, gg));
  switch (statoReport.preset) {
    case 'mese': return [kk(y, m, 1), k];
    case 'mesescorso': return [kk(y, m - 1, 1), kk(y, m, 0)];
    case '30': return [D.aggiungiGiorniKey(k, -29), k];
    case '90': return [D.aggiungiGiorniKey(k, -89), k];
    case 'anno': return [`${y}-01-01`, k];
    case 'annoscorso': return [`${y - 1}-01-01`, `${y - 1}-12-31`];
    default: return [statoReport.da || kk(y, m, 1), statoReport.a || k];
  }
}
function chiaveGruppo(key, gruppo) {
  if (gruppo === 'mese') return key.slice(0, 7);
  if (gruppo === 'settimana') return D.key(D.inizioSettimana(D.daKey(key)));
  return key;
}
function etichettaGruppo(k, gruppo) {
  if (gruppo === 'mese') { const [y, m] = k.split('-').map(Number); const s = new Intl.DateTimeFormat('it-IT', { month: 'long', year: 'numeric' }).format(new Date(y, m - 1, 1)); return s.charAt(0).toUpperCase() + s.slice(1); }
  if (gruppo === 'settimana') return `Sett. dal ${F.dataKey(k)}`;
  return F.giornoBreve(D.daKey(k));
}
function chiaviPeriodo(da, a, gruppo) {
  const out = []; let k = da;
  for (let i = 0; k <= a && i < 1200; i++) { const g = chiaveGruppo(k, gruppo); if (out[out.length - 1] !== g) out.push(g); k = D.aggiungiGiorniKey(k, 1); }
  return out;
}

/* ----- CSV ----- */
function csvCampo(v) {
  if (v == null) return '';
  const s = typeof v === 'number' ? String(v).replace('.', ',') : String(v);
  return /[";\n\r]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}
function euroCsv(cent) { return cent == null ? '' : (cent / 100).toFixed(2).replace('.', ','); }
function scaricaCSV(nome, intestazioni, righe) {
  const testo = '﻿' + [intestazioni, ...righe].map((r) => r.map(csvCampo).join(';')).join('\r\n');
  scaricaFile(nome, testo, 'text/csv;charset=utf-8');
}

/* ----- Grafico a barre (una serie, con valore al passaggio/tocco) ----- */
function graficoBarre(dati, { formato = (v) => String(v), etichettaAria = 'Grafico' } = {}) {
  const max = Math.max(1, ...dati.map((d) => d.valore));
  const molte = dati.length > 16;
  return `<div class="grafico" role="img" aria-label="${esc(etichettaAria)}">
    <div class="grafico-area" style="grid-template-columns: repeat(${dati.length}, minmax(${molte ? 6 : 18}px, 1fr))">
      ${dati.map((d) => `<button type="button" class="barra-col" aria-label="${esc(d.etichetta)}: ${esc(formato(d.valore))}">
        <span class="barra-val">${esc(formato(d.valore))}</span>
        <span class="barra" style="height:${d.valore > 0 ? Math.max(2, Math.round((d.valore / max) * 100)) : 0}%"></span>
      </button>`).join('')}
    </div>
    <div class="grafico-assi" style="grid-template-columns: repeat(${dati.length}, minmax(${molte ? 6 : 18}px, 1fr))">
      ${dati.map((d, i) => `<span>${!molte || i % Math.ceil(dati.length / 8) === 0 ? esc(d.breve || d.etichetta) : ''}</span>`).join('')}
    </div>
  </div>`;
}
function barreOrizzontali(dati, formato) {
  const max = Math.max(1, ...dati.map((d) => d.valore));
  return dati.map((d) => `<div class="barra-or"><span class="barra-or-nome">${esc(d.etichetta)}</span><span class="barra-or-traccia"><span style="width:${Math.max(1, Math.round((d.valore / max) * 100))}%"></span></span><span class="barra-or-val">${esc(formato(d.valore))}</span></div>`).join('');
}
function tabella(intestazioni, righe, allinea = []) {
  return `<div style="overflow-x:auto"><table class="tabella"><thead><tr>${intestazioni.map((h, i) => `<th style="text-align:${allinea[i] || 'left'}">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${righe.map((r) => `<tr>${r.map((c, i) => `<td style="text-align:${allinea[i] || 'left'}">${esc(c)}</td>`).join('')}</tr>`).join('') || `<tr><td colspan="${intestazioni.length}" class="vuoto">Nessun dato nel periodo</td></tr>`}</tbody></table></div>`;
}

async function vistaReport(el) {
  const [da, a] = periodoReport();
  const giorni = D.diffGiorni(da, a) + 1;
  const gruppo = statoReport.gruppo || (giorni <= 45 ? 'giorno' : giorni <= 200 ? 'settimana' : 'mese');
  const [visite, apps, movimenti, ordini, mp, mf] = await Promise.all([tutteLeVisite(), Repo.appuntamenti.list(), Repo.movimenti_magazzino.list({ archiviati: true }), Repo.ordini_fornitore.list(), mappaProdotti(), mappaFornitori()]);
  const dentro = (k) => k >= da && k <= a;
  const vPer = visite.filter((v) => dentro(v.data));
  const vendite = movimenti.filter((m) => m.tipo === 'vendita' && dentro(D.key(new Date(m.data))));
  const consumi = movimenti.filter((m) => ['consumo', 'scarico'].includes(m.tipo) && dentro(D.key(new Date(m.data))));
  const appPer = apps.filter((x) => dentro(D.key(new Date(x.inizio))));
  const ordPer = ordini.filter((o) => spesaOrdine(o) > 0 && dentro((dataSpesaOrdine(o) || '').slice(0, 10)));

  // Incassi per gruppo
  const chiavi = chiaviPeriodo(da, a, gruppo);
  const perGruppo = new Map(chiavi.map((k) => [k, { servizi: 0, vendite: 0, visite: 0 }]));
  for (const v of vPer) { const g = perGruppo.get(chiaveGruppo(v.data, gruppo)); if (g) { g.servizi += v.importoCent || 0; g.visite++; } }
  for (const m of vendite) { const g = perGruppo.get(chiaveGruppo(D.key(new Date(m.data)), gruppo)); if (g) g.vendite += m.importoCent || 0; }
  const totServizi = vPer.reduce((t, v) => t + (v.importoCent || 0), 0);
  const totVendite = vendite.reduce((t, m) => t + (m.importoCent || 0), 0);
  // Servizi più richiesti
  const serv = new Map();
  for (const v of vPer) for (const s of v.servizi || []) { const k = s.servizioId || s.nome; const r = serv.get(k) || { nome: s.nome, n: 0, cent: 0 }; r.n += s.quantita || 1; r.cent += (s.prezzoCent || 0) * (s.quantita || 1); serv.set(k, r); }
  const servLista = [...serv.values()].sort((x, y) => y.n - x.n || y.cent - x.cent);
  // No-show
  const completati = appPer.filter((x) => x.stato === 'completato').length;
  const noShow = appPer.filter((x) => x.stato === 'non_presentata').length;
  const annullati = appPer.filter((x) => x.stato === 'annullato').length;
  const tassoNoShow = completati + noShow ? noShow / (completati + noShow) : null;
  // Consumi
  const cons = new Map();
  for (const m of consumi) { const p = mp.get(m.prodottoId); const r = cons.get(m.prodottoId) || { nome: p ? nomeProdotto(p) + (p.marca ? ` — ${p.marca}` : '') : 'Prodotto eliminato', unita: p?.unita || 'pz', q: 0, cent: 0 }; r.q = qta(r.q - m.quantita); r.cent += Math.round(-m.quantita * (p?.costoCent || 0)); cons.set(m.prodottoId, r); }
  const consLista = [...cons.values()].sort((x, y) => y.cent - x.cent || y.q - x.q);
  // Vendite per prodotto
  const vend = new Map();
  for (const m of vendite) { const p = mp.get(m.prodottoId); const r = vend.get(m.prodottoId) || { nome: p ? nomeProdotto(p) : 'Prodotto eliminato', unita: p?.unita || 'pz', q: 0, cent: 0 }; r.q = qta(r.q - m.quantita); r.cent += m.importoCent || 0; vend.set(m.prodottoId, r); }
  const vendLista = [...vend.values()].sort((x, y) => y.cent - x.cent);
  // Spesa fornitori
  const spesa = new Map();
  for (const o of ordPer) { const r = spesa.get(o.fornitoreId) || { nome: nomeFornitore(mf.get(o.fornitoreId)) || 'Fornitore eliminato', n: 0, cent: 0 }; r.n++; r.cent += spesaOrdine(o); spesa.set(o.fornitoreId, r); }
  const spesaLista = [...spesa.values()].sort((x, y) => y.cent - x.cent);
  const totSpesa = spesaLista.reduce((t, r) => t + r.cent, 0);
  const totConsumi = consLista.reduce((t, r) => t + r.cent, 0);

  const pct = (x) => (x == null ? '—' : `${(x * 100).toFixed(1).replace('.', ',')}%`);
  const nomeFile = (n) => `${n}-${da}_${a}.csv`;
  el.innerHTML = `
    <div class="intestazione"><h1>Report</h1></div>
    <div class="card" style="margin-bottom:12px">
      <div class="riga-campi">
        <div class="campo" style="margin:0"><label for="rp-preset">Periodo</label><select id="rp-preset">${[['mese', 'Questo mese'], ['mesescorso', 'Mese scorso'], ['30', 'Ultimi 30 giorni'], ['90', 'Ultimi 90 giorni'], ['anno', 'Quest\'anno'], ['annoscorso', 'Anno scorso'], ['pers', 'Personalizzato']].map(([k, n]) => `<option value="${k}" ${statoReport.preset === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
        <div class="campo" style="margin:0"><label for="rp-da">Dal</label><input type="date" id="rp-da" value="${da}"></div>
        <div class="campo" style="margin:0"><label for="rp-a">Al</label><input type="date" id="rp-a" value="${a}"></div>
        <div class="campo" style="margin:0"><label for="rp-gr">Raggruppa per</label><select id="rp-gr">${[['', 'Automatico'], ['giorno', 'Giorno'], ['settimana', 'Settimana'], ['mese', 'Mese']].map(([k, n]) => `<option value="${k}" ${statoReport.gruppo === k ? 'selected' : ''}>${n}</option>`).join('')}</select></div>
      </div>
    </div>
    <div class="statistiche" style="margin-bottom:12px">
      <div class="stat"><div class="val">${F.euro(totServizi + totVendite)}</div><div class="lab">Incasso totale</div></div>
      <div class="stat"><div class="val">${F.euro(totServizi)}</div><div class="lab">Servizi (${vPer.length} visite)</div></div>
      ${moduloAttivo('magazzino') ? `<div class="stat"><div class="val">${F.euro(totVendite)}</div><div class="lab">Vendita prodotti</div></div>` : ''}
      <div class="stat"><div class="val">${vPer.length ? F.euro(Math.round(totServizi / vPer.length)) : '—'}</div><div class="lab">Incasso medio per visita</div></div>
      <div class="stat"><div class="val">${pct(tassoNoShow)}</div><div class="lab">Non presentate (${noShow} su ${completati + noShow})</div></div>
      ${moduloAttivo('magazzino') ? `<div class="stat"><div class="val">${F.euro(totConsumi)}</div><div class="lab">Prodotti consumati (a costo)</div></div>` : ''}
      ${moduloAttivo('ordini') ? `<div class="stat"><div class="val">${F.euro(totSpesa)}</div><div class="lab">Spesa fornitori</div></div>` : ''}
    </div>
    <div class="card"><div class="card-titolo"><h2>Incassi per ${gruppo}</h2><button type="button" class="btn btn-piccolo" data-csv="incassi">CSV</button></div>
      ${graficoBarre(chiavi.map((k) => { const g = perGruppo.get(k); return { etichetta: etichettaGruppo(k, gruppo), breve: gruppo === 'giorno' ? String(Number(k.slice(8))) : gruppo === 'mese' ? etichettaGruppo(k, gruppo).slice(0, 3) : F.dataKey(k).slice(0, 5), valore: g.servizi + g.vendite }; }), { formato: (v) => F.euro(v), etichettaAria: `Incassi per ${gruppo} dal ${F.dataKey(da)} al ${F.dataKey(a)}` })}
      <details style="margin-top:10px"><summary class="muted">Mostra la tabella</summary>
        ${tabella(['Periodo', 'Visite', 'Servizi', 'Vendite', 'Totale'], chiavi.map((k) => { const g = perGruppo.get(k); return [etichettaGruppo(k, gruppo), g.visite, F.euro(g.servizi), F.euro(g.vendite), F.euro(g.servizi + g.vendite)]; }), ['left', 'right', 'right', 'right', 'right'])}
      </details>
    </div>
    <div class="griglia-dash">
      <div class="card"><div class="card-titolo"><h2>Servizi più richiesti</h2><button type="button" class="btn btn-piccolo" data-csv="servizi">CSV</button></div>
        ${servLista.length ? barreOrizzontali(servLista.slice(0, 10).map((s) => ({ etichetta: s.nome, valore: s.n })), (v) => `${v}×`) : ''}
        ${tabella(['Servizio', 'Volte', 'Incasso a listino'], servLista.map((s) => [s.nome, s.n, F.euro(s.cent)]), ['left', 'right', 'right'])}
      </div>
      <div class="card"><div class="card-titolo"><h2>Appuntamenti</h2><button type="button" class="btn btn-piccolo" data-csv="noshow">CSV</button></div>
        ${tabella(['Esito', 'Numero'], [['Completati', completati], ['Non presentata', noShow], ['Annullati', annullati], ['Ancora da svolgere', appPer.filter((x) => ['prenotato', 'confermato'].includes(x.stato)).length], ['Tasso di non presentazione', pct(tassoNoShow)]], ['left', 'right'])}
        <p class="muted piccolo">Tasso = non presentate ÷ (completati + non presentate).</p>
      </div>
      ${moduloAttivo('magazzino') ? `<div class="card"><div class="card-titolo"><h2>Consumo prodotti</h2><button type="button" class="btn btn-piccolo" data-csv="consumi">CSV</button></div>
        ${tabella(['Prodotto', 'Quantità', 'Valore a costo'], consLista.map((r) => [r.nome, fmtQta(r.q, r.unita), F.euro(r.cent)]), ['left', 'right', 'right'])}</div>
      <div class="card"><div class="card-titolo"><h2>Vendita prodotti</h2><button type="button" class="btn btn-piccolo" data-csv="vendite">CSV</button></div>
        ${tabella(['Prodotto', 'Quantità', 'Incasso'], vendLista.map((r) => [r.nome, fmtQta(r.q, r.unita), F.euro(r.cent)]), ['left', 'right', 'right'])}</div>` : ''}
      ${moduloAttivo('ordini') ? `<div class="card"><div class="card-titolo"><h2>Spesa per fornitore</h2><button type="button" class="btn btn-piccolo" data-csv="fornitori">CSV</button></div>
        ${spesaLista.length ? barreOrizzontali(spesaLista.map((s) => ({ etichetta: s.nome, valore: s.cent })), (v) => F.euro(v)) : ''}
        ${tabella(['Fornitore', 'Ordini ricevuti', 'Spesa'], spesaLista.map((r) => [r.nome, r.n, F.euro(r.cent)]), ['left', 'right', 'right'])}</div>` : ''}
    </div>
    <p class="muted piccolo">Gli incassi dei servizi sono gli importi registrati nelle schede lavoro (o il prezzo degli appuntamenti completati senza scheda). Il report è uno strumento interno e non sostituisce la contabilità.</p>`;
  const ricarica = () => vistaReport(el);
  $('#rp-preset', el).addEventListener('change', (e) => { statoReport.preset = e.target.value; if (e.target.value === 'pers') { statoReport.da = da; statoReport.a = a; } ricarica(); });
  for (const id of ['#rp-da', '#rp-a']) $(id, el).addEventListener('change', () => { statoReport.preset = 'pers'; statoReport.da = $('#rp-da', el).value; statoReport.a = $('#rp-a', el).value; if (statoReport.da && statoReport.a && statoReport.da <= statoReport.a) ricarica(); });
  $('#rp-gr', el).addEventListener('change', (e) => { statoReport.gruppo = e.target.value; ricarica(); });
  const csv = {
    incassi: () => scaricaCSV(nomeFile('incassi'), ['Periodo', 'Visite', 'Servizi (€)', 'Vendite (€)', 'Totale (€)'], chiavi.map((k) => { const g = perGruppo.get(k); return [etichettaGruppo(k, gruppo), g.visite, euroCsv(g.servizi), euroCsv(g.vendite), euroCsv(g.servizi + g.vendite)]; })),
    servizi: () => scaricaCSV(nomeFile('servizi'), ['Servizio', 'Volte', 'Incasso a listino (€)'], servLista.map((s) => [s.nome, s.n, euroCsv(s.cent)])),
    noshow: () => scaricaCSV(nomeFile('appuntamenti'), ['Esito', 'Numero'], [['Completati', completati], ['Non presentata', noShow], ['Annullati', annullati], ['Tasso non presentazione (%)', tassoNoShow == null ? '' : Math.round(tassoNoShow * 1000) / 10]]),
    consumi: () => scaricaCSV(nomeFile('consumi'), ['Prodotto', 'Quantità', 'Unità', 'Valore a costo (€)'], consLista.map((r) => [r.nome, r.q, r.unita, euroCsv(r.cent)])),
    vendite: () => scaricaCSV(nomeFile('vendite'), ['Prodotto', 'Quantità', 'Unità', 'Incasso (€)'], vendLista.map((r) => [r.nome, r.q, r.unita, euroCsv(r.cent)])),
    fornitori: () => scaricaCSV(nomeFile('spesa-fornitori'), ['Fornitore', 'Ordini ricevuti', 'Spesa (€)'], spesaLista.map((r) => [r.nome, r.n, euroCsv(r.cent)]))
  };
  $$('[data-csv]', el).forEach((b) => b.addEventListener('click', () => csv[b.dataset.csv]()));
}
</script>
<script>
'use strict';
/* =====================================================================================
   SICUREZZA, BACKUP AVANZATO, OFFLINE, SERIE RIPETUTE
   ===================================================================================== */

/* ---------- Base64 / cifratura (WebCrypto: PBKDF2 → AES-GCM 256) ---------- */
const ITERAZIONI_KDF = 310000;
const MAGIC_CIFRATO = 'AGENDA-NAILS-CIFRATO-1\n';
function bufInB64(buf) { const b = new Uint8Array(buf); let s = ''; for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(s); }
function b64InBuf(b64) { const s = atob(b64); const b = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) b[i] = s.charCodeAt(i); return b; }
const cifraturaDisponibile = () => !!(window.crypto && crypto.subtle);
async function derivaChiave(password, sale, iterazioni, uso) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey', 'deriveBits']);
  if (uso === 'bits') return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: sale, iterations: iterazioni, hash: 'SHA-256' }, base, 256));
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sale, iterations: iterazioni, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, uso);
}
async function cifraBlob(blob, password, info = {}) {
  const sale = crypto.getRandomValues(new Uint8Array(16)); const iv = crypto.getRandomValues(new Uint8Array(12));
  const chiave = await derivaChiave(password, sale, ITERAZIONI_KDF, ['encrypt']);
  const dati = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, chiave, await blob.arrayBuffer());
  const testa = JSON.stringify({ app: APP_ID, tipo: 'backup-cifrato', formato: 1, kdf: { nome: 'PBKDF2', hash: 'SHA-256', iterazioni: ITERAZIONI_KDF, sale: bufInB64(sale) }, cifratura: { nome: 'AES-GCM', lunghezza: 256, iv: bufInB64(iv) }, ...info });
  return new Blob([MAGIC_CIFRATO, testa, '\n', dati], { type: 'application/octet-stream' });
}
async function eCifrato(file) { const t = await file.slice(0, MAGIC_CIFRATO.length).text(); return t === MAGIC_CIFRATO; }
async function decifraFile(file, password) {
  const buf = new Uint8Array(await file.arrayBuffer());
  let fineTesta = buf.indexOf(10, MAGIC_CIFRATO.length); if (fineTesta < 0) throw new Error('File cifrato danneggiato.');
  const testa = JSON.parse(new TextDecoder().decode(buf.subarray(MAGIC_CIFRATO.length, fineTesta)));
  if (testa.app !== APP_ID || testa.tipo !== 'backup-cifrato') throw new Error('Questo file non è un backup cifrato di questa agenda.');
  const chiave = await derivaChiave(password, b64InBuf(testa.kdf.sale), testa.kdf.iterazioni, ['decrypt']);

async function creaBlobBackup({ conFoto = true } = {}) {
  const parti = [];

  const nomi = Object.keys(ARCHIVI).filter((n) => n !== 'foto');

    if (n === 'meta') righe = righe.filter((m) => !META_LOCALI.includes(m.id) && !m.id.startsWith('elim:')); // token del cloud e dati del dispositivo restano fuori
    parti.push(`${JSON.stringify(n)}:${JSON.stringify(righe)},`);

    const foto = await richiesta(db.transaction('foto').objectStore('foto').getAll());

function spostaComeIlPrimo(lista, vecchioInizio, nuovoInizio, nuovaDurataMin) {
  const giorni = D.diffGiorni(D.key(vecchioInizio), D.key(nuovoInizio));
  const deltaMin = D.minutiDelGiorno(nuovoInizio) - D.minutiDelGiorno(vecchioInizio);
  return lista.map((x) => {
    const i = new Date(x.inizio); const k = D.aggiungiGiorniKey(D.key(i), giorni);
    const m = Math.min(1439, Math.max(0, D.minutiDelGiorno(i) + deltaMin));
    const ni = D.combina(k, D.hhmmDaMin(m));
    return { app: x, inizio: ni, fine: D.aggiungiMinuti(ni, nuovaDurataMin ?? durataApp(x)) };
  });
}

  try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files: [file] })); } catch (e) { return false; }
}
function usaCondivisionePerFile() { return eiOS() && !!navigator.share; }

/* Salvataggio in due passi: il file viene preparato prima, poi il tocco sul pulsante apre
   subito il foglio Condividi (Safari lo consente solo durante un tocco dell'utente). */
function offriFile(nomeFile, blob) {
  let file = new File([blob], nomeFile, { type: blob.type || 'application/octet-stream' });
  if (!puoCondividereFile(file)) file = new File([blob], nomeFile, { type: 'application/octet-stream' });
  const kb = Math.max(1, Math.round(blob.size / 1024));
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <p style="margin-top:0"><strong>${esc(nomeFile)}</strong> <span class="muted">(${kb >= 1024 ? (kb / 1024).toFixed(1).replace('.', ',') + ' MB' : kb + ' KB'})</span></p>
    <p>Tocca il pulsante e scegli <strong>Salva su File</strong> (per esempio in iCloud Drive), oppure mandalo via WhatsApp o email.</p>
    <button type="button" class="btn btn-primario btn-blocco" id="of-share">Salva o condividi il file</button>
    ${!eStandalone() ? '<button type="button" class="btn btn-ghost btn-blocco" id="of-scarica" style="margin-top:8px">Scarica nella cartella Download</button>' : ''}`;
  const m = apriModale({ titolo: 'File pronto', corpo, azioni: [{ testo: 'Chiudi' }] });
  return new Promise((risolvi) => {
    $('#of-share', corpo).addEventListener('click', async () => {
      if (!puoCondividereFile(file)) { scaricaConLink(nomeFile, blob); m.chiudi(); risolvi(true); return; }
      try { await navigator.share({ files: [file], title: nomeFile }); m.chiudi(); toast('File salvato o condiviso.'); risolvi(true); }
      catch (e) { if (e.name !== 'AbortError') erroreUI(e); }
    });
    $('#of-scarica', corpo)?.addEventListener('click', () => { scaricaConLink(nomeFile, blob); m.chiudi(); risolvi(true); });
    m.promessa.then(() => risolvi(false));
  });
}
function scaricaConLink(nomeFile, blob) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nomeFile; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();

}

<script>
'use strict';
/* =====================================================================================
   PUNTI DI RIPRISTINO AUTOMATICI
   Una copia al giorno di tutti i dati (foto escluse: restano quelle presenti) in un
   archivio separato sullo stesso dispositivo. Proteggono dagli errori (cancellazioni,
   ripristini sbagliati), NON dalla perdita del dispositivo: per quello servono i backup.
   ===================================================================================== */
const COPIE_DB = `${IDB_NOME}-ripristino`;
const MAX_COPIE = { giornaliera: 7, prima: 5, manuale: 5 };
const MOTIVI_COPIA = { giornaliera: 'Automatica giornaliera', prima: 'Prima di un ripristino o di una pulizia', manuale: 'Creata a mano' };
let dbCopie = null;
function apriDBCopie() {
  if (dbCopie) return Promise.resolve(dbCopie);
  return new Promise((ok, ko) => {
    const r = indexedDB.open(COPIE_DB, 1);
    r.onupgradeneeded = () => { const s = r.result.createObjectStore('copie', { keyPath: 'id' }); s.createIndex('creata', 'creata'); };
    r.onsuccess = () => { dbCopie = r.result; dbCopie.onversionchange = () => { dbCopie.close(); dbCopie = null; }; ok(dbCopie); };
    r.onerror = () => ko(r.error);
  });
}
async function elencoCopie() {
  const d = await apriDBCopie();
  // solo le informazioni, senza caricare i dati di ogni copia
  const tutte = await richiesta(d.transaction('copie').objectStore('copie').getAll());
  return tutte.map(({ dati, ...info }) => info).sort((a, b) => b.creata.localeCompare(a.creata));
}
async function creaCopiaRipristino(motivo = 'manuale') {
  const tutto = await leggiTutto();
  delete tutto.foto;
  tutto.meta = tutto.meta.filter((m) => !META_LOCALI.includes(m.id) && !m.id.startsWith('elim:'));
  const rec = {
    id: uid(), creata: new Date().toISOString(), giorno: D.oggiKey(), motivo, schemaVersion: SCHEMA_VERSION,
    conteggi: { clienti: tutto.clienti.length, appuntamenti: tutto.appuntamenti.length, schede: tutto.schede_lavoro.length, prodotti: tutto.prodotti.length, appunti: tutto.appunti.length },
    dati: tutto
  };
  const d = await apriDBCopie();
  const tx = d.transaction('copie', 'readwrite'); tx.objectStore('copie').put(rec); await fineTransazione(tx);
  // tieni solo le più recenti per ogni motivo
  const elenco = (await elencoCopie()).filter((c) => c.motivo === motivo);
  const via = elenco.slice(MAX_COPIE[motivo] || 5);
  if (via.length) { const t2 = d.transaction('copie', 'readwrite'); for (const c of via) t2.objectStore('copie').delete(c.id); await fineTransazione(t2); }
  return rec;
}
async function copiaGiornaliera() {
  const oggi = D.oggiKey();
  if ((await elencoCopie()).some((c) => c.motivo === 'giornaliera' && c.giorno === oggi)) return false;
  if (!((await Repo.clienti.count()) + (await Repo.appuntamenti.count()) + (await Repo.prodotti.count()))) return false; // archivio vuoto: niente da copiare
  await creaCopiaRipristino('giornaliera');

}
async function ripristinaCopia(id) {

  if (!copia) { toast('Punto di ripristino non trovato.'); return; }
  const ok = await conferma({ titolo: 'Tornare a questo punto di ripristino?', messaggio: `
    <p><strong>${esc(F.dataOra(new Date(copia.creata)))}</strong> — ${esc(MOTIVI_COPIA[copia.motivo] || copia.motivo)}</p>
    <p>${copia.conteggi.clienti} clienti · ${copia.conteggi.appuntamenti} appuntamenti · ${copia.conteggi.schede} schede · ${copia.conteggi.prodotti} prodotti · ${copia.conteggi.appunti} appunti</p>
    <div class="box box-avviso piccolo"><strong>Le modifiche fatte dopo andranno perse.</strong>Prima di procedere viene creato in automatico un punto di ripristino della situazione attuale, così puoi tornare indietro. Le foto non cambiano.</div>`, ok: 'Ripristina' });
  if (!ok) return;
  await applicaBackup({ app: APP_ID, tipo: 'backup-completo', schemaVersion: copia.schemaVersion, conFoto: false, dati: copia.dati });
}
async function sezioneCopie(cont) {
  const elenco = await elencoCopie();
  cont.innerHTML = `
    <p class="muted piccolo" style="margin-top:0">Ogni giorno l'agenda salva da sola una copia dei dati su questo dispositivo (ultime ${MAX_COPIE.giornaliera}). Serve a rimediare agli errori, per esempio una cancellazione sbagliata. Non sostituisce il backup: se il dispositivo si rompe o viene perso, anche queste copie si perdono. Le foto non sono incluse.</p>
    <ul class="lista">${elenco.map((c) => `<li><div class="riga" style="cursor:default;flex-wrap:wrap"><span class="principale"><span class="titolo">${esc(F.dataOra(new Date(c.creata)))}</span>
      <div class="sotto">${esc(MOTIVI_COPIA[c.motivo] || c.motivo)} · ${c.conteggi.clienti} clienti · ${c.conteggi.appuntamenti} appuntamenti · ${c.conteggi.prodotti} prodotti</div></span>
      <button type="button" class="btn btn-piccolo" data-copia="${esc(c.id)}">Ripristina</button></div></li>`).join('') || '<li class="vuoto">Ancora nessun punto di ripristino.</li>'}</ul>
    <button type="button" class="btn btn-piccolo" id="cp-crea" style="margin-top:8px">Crea un punto di ripristino adesso</button>`;
  $$('[data-copia]', cont).forEach((b) => b.addEventListener('click', () => ripristinaCopia(b.dataset.copia).catch(erroreUI)));
