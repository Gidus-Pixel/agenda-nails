  $('#sp-trova', corpo).addEventListener('click', async () => {
    const k = $('#sp-data', corpo).value || D.oggiKey();
    const r = await trovaSlotLiberi({ durataMin: Number($('#sp-durata', corpo).value), operatriceId: app.operatriceId, servizi: app.servizi, da: D.combina(k, '00:00'), escludiId: app.id, quanti: 6 });
    mostraSlotSuggeriti($('#sp-slot', corpo), r, (d) => { $('#sp-data', corpo).value = D.key(d); $('#sp-ora', corpo).value = D.hhmm(d); });
  });
  apriModale({ titolo: 'Sposta appuntamento', corpo, azioni: [
    { testo: 'Annulla' },
    { testo: 'Continua', classe: 'btn-primario', onClick: async () => { const v = leggi(); if (!v) return false; return gestisciSpostamento(app, v.i, v.f); } }
  ] });
}
function mostraSlotSuggeriti(cont, r, scegli) {
  cont.innerHTML = '';
  if (r.errore) { cont.innerHTML = `<div class="box box-avviso">${esc(r.errore)}</div>`; return; }
  if (!r.slot.length) { cont.innerHTML = '<div class="box box-avviso">Nessuno slot libero trovato nei prossimi 90 giorni.</div>'; return; }
  for (const d of r.slot) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = `${F.giornoBreve(d)} · ${D.hhmm(d)}`;
    b.addEventListener('click', () => { $$('.chip', cont).forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); scegli(d); });
    cont.appendChild(b);
  }
}

/* ----- Trova slot (dalla barra dell'agenda) ----- */
async function apriTrovaSlot() {
  const servizi = await serviziAttivi();
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="campo"><label for="ts-serv">Servizio</label>
      <select id="ts-serv"><option value="">— durata libera —</option>${servizi.map((s) => `<option value="${esc(s.id)}" data-durata="${s.durata}">${esc(s.nome)} (${F.durata(s.durata)})</option>`).join('')}</select></div>
    <div class="riga-campi">
      <div class="campo"><label for="ts-durata">Durata (min)</label><input type="number" id="ts-durata" min="5" step="5" inputmode="numeric" value="${servizi[0] ? '' : 60}"></div>
      <div class="campo"><label for="ts-da">A partire dal</label><input type="date" id="ts-da" value="${D.oggiKey()}"></div>
      ${piuOperatrici() ? `<div class="campo"><label for="ts-op">Operatrice</label><select id="ts-op">${cfg().operatrici.map((o) => `<option value="${esc(o.id)}">${esc(o.nome || 'Operatrice')}</option>`).join('')}</select></div>` : ''}
    </div>
    <button type="button" class="btn btn-primario" id="ts-cerca">${icona('cerca')} Cerca</button>
    <p class="muted piccolo">Tocca uno slot per prenotarlo.</p>
    <div class="slot-suggeriti" id="ts-slot"></div>`;
  const m = apriModale({ titolo: 'Trova primo slot libero', corpo, azioni: [{ testo: 'Chiudi' }] });
  $('#ts-serv', corpo).addEventListener('change', (e) => { const o = e.target.selectedOptions[0]; if (o && o.dataset.durata) $('#ts-durata', corpo).value = o.dataset.durata; });
  $('#ts-cerca', corpo).addEventListener('click', async () => {
    const sid = $('#ts-serv', corpo).value; const serv = servizi.find((s) => s.id === sid);
    const opId = $('#ts-op', corpo)?.value || cfg().operatrici[0].id;
    const r = await trovaSlotLiberi({ durataMin: Number($('#ts-durata', corpo).value), operatriceId: opId, servizi: serv ? [{ servizioId: serv.id, cuscinetto: serv.cuscinetto }] : [], da: D.combina($('#ts-da', corpo).value || D.oggiKey(), '00:00'), quanti: 8 });
    mostraSlotSuggeriti($('#ts-slot', corpo), r, (d) => { m.chiudi(); apriModuloAppuntamento({ inizio: d, preServizi: serv ? [{ servizioId: serv.id, quantita: 1 }] : null, durata: Number($('#ts-durata', corpo).value), operatriceId: opId }); });
  });
}

/* ----- Modulo appuntamento (nuovo / modifica) ----- */
async function apriModuloAppuntamento({ app = null, inizio = null, fine = null, clienteId = null, preServizi = null, note = '', durata = null, operatriceId = null } = {}) {
  const [listino, clienti] = await Promise.all([serviziAttivi(), Repo.clienti.list()]);
  const modifica = !!app;
  const c = cfg(); const passo = (Number(c.agenda.slotMinuti) || 15);
  const st = {
    clienteId: app ? app.clienteId : clienteId,
    nuova: false,
    scelti: new Map(), // servizioId -> { quantita, snap }
    durataManuale: app ? !!app.durataManuale : !!(fine || durata),
    prezzoManuale: app ? !!app.prezzoManuale : false
  };
  // righe del listino + eventuali servizi dell'appuntamento non più a listino
  const righe = listino.map((s) => ({ id: s.id, nome: s.nome, categoria: s.categoria || 'Altro', durata: Number(s.durata) || 0, prezzoCent: Number(s.prezzoCent) || 0, colore: s.colore, cuscinetto: s.cuscinetto, richiamoGiorni: s.richiamoGiorni }));
  if (app) for (const s of app.servizi || []) {
    let r = righe.find((x) => x.id === s.servizioId);
    if (!r) { r = { id: s.servizioId || uid(), nome: s.nome, categoria: 'Non più a listino', durata: s.durata, prezzoCent: s.prezzoCent, colore: s.colore }; righe.push(r); }
    else { r.durata = s.durata; r.prezzoCent = s.prezzoCent; } // prezzi copiati al momento della prenotazione
    st.scelti.set(r.id, { quantita: s.quantita || 1 });
  }
  if (preServizi) for (const p of preServizi) { const r = righe.find((x) => x.id === p.servizioId) || (p.nome ? (righe.push({ id: p.servizioId || uid(), nome: p.nome, categoria: 'Non più a listino', durata: p.durata, prezzoCent: p.prezzoCent, colore: p.colore }), righe[righe.length - 1]) : null); if (r) st.scelti.set(r.id, { quantita: p.quantita || 1 }); }

  const ini0 = app ? new Date(app.inizio) : (inizio || D.arrotondaSu(new Date(), passo));
  const dur0 = app ? durataApp(app) : (fine && inizio ? D.minutiTra(inizio, fine) : (durata || 0));
  const categorie = [...new Set(righe.map((r) => r.categoria))];
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="campo">
      <span class="etichetta">Cliente</span>
      <div id="ap-cli-scelta"></div>
      <div id="ap-cli-cerca">
        <input type="search" id="ap-cerca" placeholder="Cerca per nome, cognome o telefono" autocomplete="off" aria-label="Cerca cliente">
        <div class="risultati nascosto" id="ap-risultati"></div>
        <button type="button" class="btn btn-ghost" id="ap-nuova-btn" style="margin-top:4px">${icona('piu')} Nuova cliente</button>
      </div>
      <div id="ap-nuova-box" class="nascosto">
        <div class="riga-campi">
          <div class="campo"><label for="ap-n-nome">Nome *</label><input type="text" id="ap-n-nome" autocomplete="off"></div>
          <div class="campo"><label for="ap-n-cognome">Cognome</label><input type="text" id="ap-n-cognome" autocomplete="off"></div>
          <div class="campo"><label for="ap-n-tel">Telefono</label><input type="tel" id="ap-n-tel" inputmode="tel" autocomplete="off"></div>
        </div>
        <button type="button" class="btn btn-ghost btn-piccolo" id="ap-nuova-annulla">Cerca tra le clienti esistenti</button>
      </div>
      <div id="ap-avvertenze"></div>
    </div>
    <fieldset><legend>Servizi</legend>
      ${righe.length ? categorie.map((cat) => `<div class="muted piccolo" style="margin-top:6px;font-weight:650">${esc(cat)}</div>` + righe.filter((r) => r.categoria === cat).map((r) => `
        <div class="servizio-riga" data-sid="${esc(r.id)}">
          <span class="pallino" style="background:${esc(r.colore || '#999')}"></span>
          <label class="check nome"><input type="checkbox" data-scelta ${st.scelti.has(r.id) ? 'checked' : ''}> <span>${esc(r.nome)} <span class="muted piccolo">· ${F.durata(r.durata)} · ${F.euro(r.prezzoCent)}</span></span></label>
          <span class="qta ${st.scelti.has(r.id) ? '' : 'nascosto'}"><button type="button" data-meno aria-label="Diminuisci quantità">−</button><span data-q>${st.scelti.get(r.id)?.quantita || 1}</span><button type="button" data-piu aria-label="Aumenta quantità">+</button></span>
        </div>`).join('')).join('') : '<div class="box box-avviso">Il listino è vuoto. Aggiungi i servizi in Impostazioni → Servizi, oppure indica la durata a mano qui sotto.</div>'}
    </fieldset>
    ${c.operatrici.length > 1 ? `<div class="campo"><label for="ap-op">Operatrice</label><select id="ap-op">${c.operatrici.map((o) => `<option value="${esc(o.id)}" ${(app ? app.operatriceId : (operatriceId || statoAgenda.operatrice || c.operatrici[0].id)) === o.id ? 'selected' : ''}>${esc(o.nome || 'Operatrice')}</option>`).join('')}</select></div>` : ''}
    <div class="riga-campi">
      <div class="campo"><label for="ap-data">Data</label><input type="date" id="ap-data" value="${D.key(ini0)}"></div>
      <div class="campo"><label for="ap-ora">Ora</label><input type="time" id="ap-ora" step="${passo * 60}" value="${D.hhmm(ini0)}"></div>
      <div class="campo"><label for="ap-durata">Durata (min)</label><input type="number" id="ap-durata" min="5" step="5" inputmode="numeric" value="${dur0 || ''}"><span class="aiuto" id="ap-fine"></span></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="ap-prezzo">Prezzo (€)</label><input type="text" id="ap-prezzo" inputmode="decimal" value="${app ? F.testoDaCent(app.prezzoTotaleCent) : ''}"></div>
      <div class="campo"><label for="ap-acconto">Acconto versato (€)</label><input type="text" id="ap-acconto" inputmode="decimal" value="${app && app.accontoCent ? F.testoDaCent(app.accontoCent) : ''}"></div>
      <div class="campo"><label for="ap-stato">Stato</label><select id="ap-stato">${Object.entries(STATI).filter(([k]) => modifica || ['prenotato', 'confermato'].includes(k)).map(([k, v]) => `<option value="${k}" ${(app ? app.stato : 'prenotato') === k ? 'selected' : ''}>${v.nome}</option>`).join('')}</select></div>
    </div>
    <div style="margin-bottom:12px">
      <button type="button" class="btn" id="ap-trova">Trova primo slot libero</button>
      <div class="slot-suggeriti" id="ap-slot"></div>
    </div>
    <div class="campo"><label for="ap-note">Note</label><textarea id="ap-note">${esc(app ? app.note || '' : note)}</textarea></div>
    ${!modifica ? `<fieldset><legend>Ripeti</legend><div class="riga-campi">
      <div class="campo"><label for="ap-rip">Frequenza</label><select id="ap-rip"><option value="0">Non ripetere</option><option value="1">Ogni settimana</option><option value="2">Ogni 2 settimane</option><option value="3">Ogni 3 settimane</option><option value="4">Ogni 4 settimane</option><option value="6">Ogni 6 settimane</option></select></div>
      <div class="campo"><label for="ap-rip-n">Numero di appuntamenti in totale</label><input type="number" id="ap-rip-n" min="2" max="26" value="4" inputmode="numeric"></div>
    </div></fieldset>` : ''}`;

  const sel = (s) => $(s, corpo);
  // --- Cliente ---
  const mostraCliente = async () => {
    const box = sel('#ap-cli-scelta'), cerca = sel('#ap-cli-cerca'), avv = sel('#ap-avvertenze');
    avv.innerHTML = '';
    if (st.clienteId) {
      const cli = await Repo.clienti.get(st.clienteId);
      box.innerHTML = `<div class="cliente-scelta"><div style="flex:1"><strong>${esc(nomeCliente(cli))}</strong>${cli && cli.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}<div class="piccolo">${esc(telefonoLeggibile(cli?.telefono || ''))}</div></div>
        <button type="button" class="btn btn-piccolo" id="ap-cambia">Cambia</button></div>`;
      cerca.classList.add('nascosto'); sel('#ap-nuova-box').classList.add('nascosto');
      sel('#ap-cambia').addEventListener('click', () => { st.clienteId = null; mostraCliente(); });
      if (haAvvertenze(cli)) avv.innerHTML = `<div class="avvertenze" style="margin-top:8px">⚠️ ${esc(cli.avvertenze)}</div>`;
      if (cli && cli.archiviato) avv.innerHTML += '<div class="box box-avviso">Questa cliente è archiviata.</div>';
    } else {
      box.innerHTML = ''; cerca.classList.toggle('nascosto', st.nuova); sel('#ap-nuova-box').classList.toggle('nascosto', !st.nuova);
    }
  };
  const norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  sel('#ap-cerca').addEventListener('input', () => {
    const q = norm(sel('#ap-cerca').value).trim(); const ris = sel('#ap-risultati');
    if (!q) { ris.classList.add('nascosto'); ris.innerHTML = ''; return; }
    const qCifre = q.replace(/\D/g, '');
    const trovate = clienti.filter((cl) => {
      const t = norm(`${cl.nome} ${cl.cognome} ${cl.cognome} ${cl.nome}`);
      return q.split(/\s+/).every((p) => t.includes(p)) || (qCifre.length >= 3 && (cl.telefono || '').replace(/\D/g, '').includes(qCifre));
    }).slice(0, 8);
    ris.innerHTML = trovate.map((cl) => `<button type="button" data-id="${esc(cl.id)}"><strong>${esc(nomeCliente(cl))}</strong> <span class="muted piccolo">${esc(telefonoLeggibile(cl.telefono))}</span>${haAvvertenze(cl) ? ' ⚠️' : ''}</button>`).join('')
      + `<button type="button" data-crea>${icona('piu')} Crea nuova cliente «${esc(sel('#ap-cerca').value.trim())}»</button>`;
    ris.classList.remove('nascosto');
    $$('[data-id]', ris).forEach((b) => b.addEventListener('click', () => { st.clienteId = b.dataset.id; ris.classList.add('nascosto'); mostraCliente(); }));
    $('[data-crea]', ris).addEventListener('click', () => {
      const v = sel('#ap-cerca').value.trim(); st.nuova = true;
      if (/^[+\d\s]+$/.test(v)) sel('#ap-n-tel').value = v; else { const [n, ...cg] = v.split(/\s+/); sel('#ap-n-nome').value = n || ''; sel('#ap-n-cognome').value = cg.join(' '); }
      ris.classList.add('nascosto'); mostraCliente(); sel('#ap-n-nome').focus();
    });
  });
  sel('#ap-nuova-btn').addEventListener('click', () => { st.nuova = true; mostraCliente(); sel('#ap-n-nome').focus(); });
  sel('#ap-nuova-annulla').addEventListener('click', () => { st.nuova = false; mostraCliente(); });

  // --- Servizi e totali ---
  const ricalcola = () => {
    let dur = 0, prezzo = 0;
    for (const [id, v] of st.scelti) { const r = righe.find((x) => x.id === id); if (r) { dur += (r.durata || 0) * v.quantita; prezzo += (r.prezzoCent || 0) * v.quantita; } }
    if (!st.durataManuale) sel('#ap-durata').value = dur || '';
    if (!st.prezzoManuale) sel('#ap-prezzo').value = st.scelti.size ? F.testoDaCent(prezzo) : '';
    aggiornaFine();
  };
  const aggiornaFine = () => {
    const k = sel('#ap-data').value, h = sel('#ap-ora').value, d = Number(sel('#ap-durata').value);
    sel('#ap-fine').textContent = k && h && d > 0 ? `Fine: ${D.hhmm(D.aggiungiMinuti(D.combina(k, h), d))}` : '';
  };
  $$('.servizio-riga', corpo).forEach((rigaEl) => {
    const id = rigaEl.dataset.sid; const cb = $('[data-scelta]', rigaEl); const qta = $('.qta', rigaEl); const q = $('[data-q]', rigaEl);
    cb.addEventListener('change', () => {
      if (cb.checked) st.scelti.set(id, { quantita: Number(q.textContent) || 1 }); else st.scelti.delete(id);
      qta.classList.toggle('nascosto', !cb.checked); st.durataManuale = false; st.prezzoManuale = false; ricalcola();
    });
    $('[data-meno]', rigaEl).addEventListener('click', () => { const v = Math.max(1, (Number(q.textContent) || 1) - 1); q.textContent = v; if (st.scelti.has(id)) st.scelti.get(id).quantita = v; ricalcola(); });
    $('[data-piu]', rigaEl).addEventListener('click', () => { const v = Math.min(50, (Number(q.textContent) || 1) + 1); q.textContent = v; if (st.scelti.has(id)) st.scelti.get(id).quantita = v; ricalcola(); });
  });
  sel('#ap-durata').addEventListener('input', () => { st.durataManuale = true; aggiornaFine(); });
  sel('#ap-prezzo').addEventListener('input', () => { st.prezzoManuale = true; });
  sel('#ap-data').addEventListener('change', aggiornaFine);
  sel('#ap-ora').addEventListener('change', aggiornaFine);
  sel('#ap-trova').addEventListener('click', async () => {
    const d = Number(sel('#ap-durata').value);
    const da = sel('#ap-data').value ? D.combina(sel('#ap-data').value, '00:00') : new Date();
    const r = await trovaSlotLiberi({ durataMin: d, operatriceId: sel('#ap-op')?.value || c.operatrici[0].id, servizi: serviziScelti(), da, escludiId: app ? app.id : null, quanti: 6 });
    mostraSlotSuggeriti(sel('#ap-slot'), r, (dd) => { sel('#ap-data').value = D.key(dd); sel('#ap-ora').value = D.hhmm(dd); aggiornaFine(); });
  });
  const serviziScelti = () => [...st.scelti].map(([id, v]) => {
    const r = righe.find((x) => x.id === id);
    return { servizioId: id, nome: r.nome, durata: r.durata, prezzoCent: r.prezzoCent, quantita: v.quantita, colore: r.colore || null, cuscinetto: r.cuscinetto ?? null, richiamoGiorni: r.richiamoGiorni ?? null };
  });

  await mostraCliente();
  if (!modifica) ricalcola(); else aggiornaFine();

  const salva = async () => {
    // Cliente
    let cliId = st.clienteId;
    if (!cliId) {
      if (!st.nuova) { toast('Scegli una cliente o creane una nuova.'); sel('#ap-cerca').focus(); return false; }
      const nome = sel('#ap-n-nome').value.trim(); if (!nome) { toast('Scrivi almeno il nome della nuova cliente.'); sel('#ap-n-nome').focus(); return false; }
      const tel = normalizzaTelefono(sel('#ap-n-tel').value);
      if (tel) {
        const dup = (await Repo.clienti.list({ archiviati: true })).find((x) => x.telefono === tel);
        if (dup) {
          const usa = await conferma({ titolo: 'Numero già presente', messaggio: `<p>Il numero ${esc(telefonoLeggibile(tel))} appartiene già a <strong>${esc(nomeCliente(dup))}</strong>.</p><p>Vuoi usare la cliente esistente?</p>`, ok: 'Usa cliente esistente', annulla: 'Crea comunque nuova' });
          if (usa) cliId = dup.id;
        }
      }
      if (!cliId) { const nuova = await Repo.clienti.put(nuovaClienteVuota({ nome, cognome: sel('#ap-n-cognome').value.trim(), telefono: tel })); cliId = nuova.id; }
      st.clienteId = cliId; st.nuova = false;
    }
    const k = sel('#ap-data').value, h = sel('#ap-ora').value, d = Number(sel('#ap-durata').value);
    if (!k || !h) { toast('Indica data e ora.'); return false; }
    if (!(d > 0)) { toast('Scegli almeno un servizio o indica la durata.'); return false; }
    const servizi = serviziScelti();
    const inizio = D.combina(k, h), fineApp = D.aggiungiMinuti(inizio, d);
    const opId = sel('#ap-op')?.value || (app && app.operatriceId) || c.operatrici[0].id;
    const cli = await Repo.clienti.get(cliId);
    const base = {
      clienteId: cliId, clienteNome: nomeCliente(cli), servizi, operatriceId: opId,
      stato: sel('#ap-stato').value, prezzoTotaleCent: F.centDaTesto(sel('#ap-prezzo').value) ?? 0,
      accontoCent: F.centDaTesto(sel('#ap-acconto').value) ?? 0, note: sel('#ap-note').value.trim(),
      durataManuale: st.durataManuale, prezzoManuale: st.prezzoManuale
    };
    // Occorrenze (ricorrenza facoltativa)
    const ogni = !modifica ? Number(sel('#ap-rip').value) : 0;
    const n = ogni ? Math.min(26, Math.max(2, Number(sel('#ap-rip-n').value) || 2)) : 1;
    const occ = [];
    for (let i = 0; i < n; i++) { const ii = D.combina(D.aggiungiGiorniKey(k, i * 7 * ogni), h); occ.push({ inizio: ii, fine: D.aggiungiMinuti(ii, d) }); }
    const problemiPer = [];
    for (const o of occ) {
      const p = await verificaSlot({ inizio: o.inizio, fine: o.fine, operatriceId: opId, escludiId: app ? app.id : null, servizi, ignoraPassato: modifica && +o.inizio === +new Date(app.inizio) });
      problemiPer.push(p);
    }
    let daCreare = occ.map((o, i) => ({ ...o, problemi: problemiPer[i] }));
    const conProblemi = daCreare.filter((o) => o.problemi.length);
    if (conProblemi.length) {
      if (occ.length === 1) {
        const ok = await conferma({ titolo: 'Ci sono dei problemi con questo orario', messaggio: `<p>${esc(F.giornoLungo(inizio))}, ${F.intervallo(inizio, fineApp)}</p>`, problemi: conProblemi[0].problemi, ok: 'Salva comunque', annulla: 'Torna al modulo' });
        if (!ok) return false;
      } else {
        const elenco = conProblemi.map((o) => `<li><strong>${esc(F.giornoLungo(o.inizio))} ${D.hhmm(o.inizio)}</strong>: ${esc(o.problemi.map((p) => p.msg).join(' '))}</li>`).join('');
        const scelta = await apriModale({ titolo: 'Alcune date hanno problemi', corpo: `<ul>${elenco}</ul>`, azioni: [
          { testo: 'Torna al modulo', valore: 'indietro' },
          { testo: `Crea solo le ${occ.length - conProblemi.length} libere`, valore: 'libere', classe: 'btn' },
          { testo: 'Crea tutte comunque', valore: 'tutte', classe: 'btn-pericolo' }
        ] }).promessa;
        if (!scelta || scelta === 'indietro') return false;
        if (scelta === 'libere') daCreare = daCreare.filter((o) => !o.problemi.length);
        if (!daCreare.length) { toast('Nessun appuntamento creato.'); return true; }
      }
    }
    if (modifica) {
      const ambito = await chiediAmbitoSerie(app, 'modificare');
      if (!ambito) return false;
      const vecchioInizio = new Date(app.inizio);
      const prec = [clona(app)];
      const aggiornati = [Object.assign(app, base, { inizio: inizio.toISOString(), fine: fineApp.toISOString() })];
      if (ambito.ambito === 'successivi') {
        for (const v of spostaComeIlPrimo(ambito.succ, vecchioInizio, inizio, d)) {
          prec.push(clona(v.app));
          const { stato, accontoCent, ...comuni } = base; // stato e acconto restano quelli di ogni appuntamento
          aggiornati.push(Object.assign(v.app, comuni, { inizio: v.inizio.toISOString(), fine: v.fine.toISOString() }));
        }
      }
      await Repo.appuntamenti.putMany(aggiornati);
      toastAnnulla(aggiornati.length > 1 ? `${aggiornati.length} appuntamenti aggiornati` : 'Appuntamento aggiornato', async () => { await Repo.appuntamenti.putMany(prec); });
    } else {
      const serieId = daCreare.length > 1 ? uid() : null;
      const creati = daCreare.map((o) => ({ ...clona(base), inizio: o.inizio.toISOString(), fine: o.fine.toISOString(), serieId, schedaId: null, archiviato: false }));
      await Repo.appuntamenti.putMany(creati);
      const altre = cli && cli.telefono && cfg().promemoriaWhatsApp ? [{ testo: 'WhatsApp', azione: () => promemoriaWhatsApp(cli, creati[0]) }] : [];
      toastAnnulla(creati.length > 1 ? `${creati.length} appuntamenti creati` : 'Appuntamento creato', async () => { for (const a of creati) await Repo.appuntamenti.delete(a.id); }, altre);
    }
    aggiornaVista();
    return true;
  };
  apriModale({ titolo: modifica ? 'Modifica appuntamento' : 'Nuovo appuntamento', corpo, grande: true, azioni: [
    { testo: 'Annulla' }, { testo: 'Salva', classe: 'btn-primario', id: 'salva', onClick: salva }
  ], onApri: () => { if (!st.clienteId) setTimeout(() => sel('#ap-cerca').focus(), 50); } });
}

/* ----- Dettaglio appuntamento ----- */
async function apriDettaglioAppuntamento(id) {
  const app = await Repo.appuntamenti.get(id);
  if (!app) { toast('Appuntamento non trovato.'); return; }
  const cli = await Repo.clienti.get(app.clienteId);
  const ini = new Date(app.inizio), fin = new Date(app.fine);
  const totale = app.prezzoTotaleCent || 0; const acconto = app.accontoCent || 0;
  const corpo = document.createElement('div');
  const attivo = ['prenotato', 'confermato'].includes(app.stato);
  corpo.innerHTML = `
    ${app.demo ? '<span class="badge badge-demo">DATI DI PROVA</span>' : ''}
    <p style="font-size:1.1rem;margin-top:0"><strong>${esc(F.giornoLungo(ini))}</strong><br>${F.intervallo(ini, fin)} · ${F.durata(D.minutiTra(ini, fin))}${piuOperatrici() ? ` · ${esc(nomeOperatrice(app.operatriceId))}` : ''}</p>
    <p><span class="stato" style="background:${STATI[app.stato].colore}">${STATI[app.stato].nome}</span>${app.promemoriaInviatoIl ? ` <span class="badge badge-ok">💬 promemoria inviato ${esc(F.dataOra(new Date(app.promemoriaInviatoIl)))}</span>` : ''}</p>
    <div class="cliente-scelta" style="margin:10px 0">
      <div style="flex:1"><strong>${esc(cli ? nomeCliente(cli) : app.clienteNome || 'Cliente eliminata')}</strong><div class="piccolo">${esc(telefonoLeggibile(cli?.telefono || ''))}</div></div>
      ${cli && moduloAttivo('clienti') ? `<button type="button" class="btn btn-piccolo" data-az="scheda-cliente">Scheda cliente</button>` : ''}
    </div>
    ${haAvvertenze(cli) ? `<div class="avvertenze">⚠️ ${esc(cli.avvertenze)}</div>` : ''}
    <ul class="lista" style="margin:10px 0">
      ${(app.servizi || []).map((s) => `<li class="riga" style="cursor:default;min-height:44px"><span class="principale">${esc(s.nome)}${s.quantita > 1 ? ` ×${s.quantita}` : ''}</span><span>${F.euro((s.prezzoCent || 0) * (s.quantita || 1))}</span></li>`).join('') || '<li class="vuoto">Nessun servizio indicato</li>'}
      <li class="riga" style="cursor:default;min-height:44px"><span class="principale"><strong>Totale</strong></span><strong>${F.euro(totale)}</strong></li>
      ${acconto ? `<li class="riga" style="cursor:default;min-height:44px"><span class="principale">💶 Acconto versato</span><span>${F.euro(acconto)}</span></li><li class="riga" style="cursor:default;min-height:44px"><span class="principale">Da saldare</span><span>${F.euro(Math.max(0, totale - acconto))}</span></li>` : ''}
    </ul>
    ${app.note ? `<div class="box box-info"><strong>Note</strong>${esc(app.note).replace(/\n/g, '<br>')}</div>` : ''}
    <div class="gruppo-btn" style="margin-top:12px">
      ${attivo ? `<button type="button" class="btn btn-primario" data-az="completa">✓ Completa</button>` : ''}
      ${app.stato === 'prenotato' ? `<button type="button" class="btn btn-ok" data-az="conferma">Conferma</button>` : ''}
      ${attivo ? `<button type="button" class="btn" data-az="sposta">Sposta</button>` : ''}
      <button type="button" class="btn" data-az="modifica">Modifica</button>
      ${cli && cli.telefono && cfg().promemoriaWhatsApp && attivo ? `<button type="button" class="btn btn-wa" data-az="wa">${icona('wa')} Promemoria WhatsApp</button>` : ''}
      ${cli && cli.telefono ? `<a class="btn" href="tel:${esc(cli.telefono)}">${icona('telefono')} Chiama</a>` : ''}
      ${app.stato === 'completato' && app.schedaId && moduloAttivo('storico') ? `<button type="button" class="btn" data-az="apri-scheda">Scheda lavoro</button>` : ''}
      ${attivo ? `<button type="button" class="btn" data-az="noshow">Non presentata</button>` : ''}
      ${attivo ? `<button type="button" class="btn" data-az="annulla">Annulla appuntamento</button>` : ''}
      ${['annullato', 'non_presentata'].includes(app.stato) ? `<button type="button" class="btn" data-az="ripristina">Riporta a "Prenotato"</button>` : ''}
      <button type="button" class="btn" data-az="ics">Esporta .ics</button>
      <button type="button" class="btn btn-ghost" data-az="archivia" style="color:var(--pericolo)">Elimina</button>
    </div>
    ${app.serieId ? '<p class="muted piccolo">🔁 Fa parte di una serie di appuntamenti ripetuti: spostamenti, modifiche e annullamenti possono valere anche per i successivi.</p>' : ''}
    <div id="det-appunti"></div>`;
  const m = apriModale({ titolo: 'Appuntamento', corpo, azioni: [{ testo: 'Chiudi' }] });
  if (moduloAttivo('appunti')) sezioneAppunti($('#det-appunti', corpo), 'appuntamento', app.id);
  const az = {
    'scheda-cliente': () => { m.chiudi(); vai(`#/cliente/${encodeURIComponent(cli.id)}`); },
    completa: () => { m.chiudi(); completaAppuntamento(app); },
    conferma: async () => { m.chiudi(); await cambiaStato(app, 'confermato'); },
    sposta: () => { m.chiudi(); apriSposta(app); },
    modifica: () => { m.chiudi(); apriModuloAppuntamento({ app }); },
    wa: async () => { promemoriaWhatsApp(cli, app); const a = await Repo.appuntamenti.get(app.id); if (a) { a.promemoriaInviatoIl = new Date().toISOString(); await Repo.appuntamenti.put(a); } },
    'apri-scheda': async () => { m.chiudi(); const s = await Repo.schede_lavoro.get(app.schedaId); if (s) apriSchedaLavoro({ scheda: s }); },
    noshow: async () => { m.chiudi(); await cambiaStato(app, 'non_presentata'); },
    annulla: async () => {
      const ambito = await chiediAmbitoSerie(app, 'annullare'); if (!ambito) return;
      const lista = [app, ...(ambito.ambito === 'successivi' ? ambito.succ : [])];
      if (!(await conferma({ titolo: lista.length > 1 ? `Annullare ${lista.length} appuntamenti?` : 'Annullare l\'appuntamento?', messaggio: 'Resteranno nello storico come "annullati" e gli orari torneranno liberi.', ok: 'Annulla appuntament' + (lista.length > 1 ? 'i' : 'o'), annulla: 'Indietro', pericolo: true }))) return;
      m.chiudi();
      if (lista.length === 1) { await cambiaStato(app, 'annullato'); return; }
      const prec = lista.map((a) => ({ id: a.id, stato: a.stato }));
      for (const a of lista) a.stato = 'annullato';
      await Repo.appuntamenti.putMany(lista);
      toastAnnulla(`${lista.length} appuntamenti annullati`, async () => { for (const x of prec) { const a = await Repo.appuntamenti.get(x.id); a.stato = x.stato; await Repo.appuntamenti.put(a); } });
      aggiornaVista();
    },
    ripristina: async () => { m.chiudi(); await cambiaStato(app, 'prenotato'); },
    ics: () => esportaICS(app, cli),
    archivia: async () => {
      const ambito = await chiediAmbitoSerie(app, 'eliminare'); if (!ambito) return;
      const lista = [app, ...(ambito.ambito === 'successivi' ? ambito.succ : [])];
      if (!(await conferma({ titolo: lista.length > 1 ? `Eliminare ${lista.length} appuntamenti?` : 'Eliminare l\'appuntamento?', messaggio: 'Verranno spostati tra gli elementi archiviati (Impostazioni → Dati): potrai ripristinarli o eliminarli definitivamente.', ok: 'Elimina', pericolo: true }))) return;
      m.chiudi(); for (const a of lista) await Repo.appuntamenti.archivia(a.id);
      toastAnnulla(lista.length > 1 ? `${lista.length} appuntamenti eliminati` : 'Appuntamento eliminato', async () => { for (const a of lista) await Repo.appuntamenti.ripristina(a.id); });
      aggiornaVista();
    }
  };
  $$('[data-az]', corpo).forEach((b) => b.addEventListener('click', () => { Promise.resolve(az[b.dataset.az]()).catch(erroreUI); }));
}
async function completaAppuntamento(app) {
  if (moduloAttivo('storico')) apriSchedaLavoro({ app });
  else await cambiaStato(app, 'completato');
}

/* ----- Blocchi: pause, ferie, chiusure, impegni ----- */
async function apriElencoBlocchi() {
  const blocchi = (await Repo.blocchi.list()).sort((a, b) => (a.inizio || a.ricorrenza?.dal || '').localeCompare(b.inizio || b.ricorrenza?.dal || ''));
  const oraISO = new Date().toISOString(); const oggi = D.oggiKey();
  const attuali = blocchi.filter((b) => (b.ricorrenza ? !b.ricorrenza.al || b.ricorrenza.al >= oggi : b.fine >= oraISO));
  const passati = blocchi.filter((b) => !attuali.includes(b));
  const corpo = document.createElement('div');
  const riga = (b) => `<li><button type="button" class="riga" data-id="${esc(b.id)}"><span class="principale"><span class="titolo">${esc(descriviBlocco(b))}</span>${b.operatriceId && piuOperatrici() ? `<div class="sotto">${esc(nomeOperatrice(b.operatriceId))}</div>` : ''}</span>${b.demo ? '<span class="badge badge-demo">PROVA</span>' : ''}</button></li>`;
  corpo.innerHTML = `
    <p class="muted">Gli orari bloccati compaiono in grigio in agenda e vengono segnalati quando prenoti.</p>
    <ul class="lista">${attuali.map(riga).join('') || '<li class="vuoto">Nessuna pausa o chiusura in programma.</li>'}</ul>
    ${passati.length ? `<details style="margin-top:10px"><summary class="muted">Passati (${passati.length})</summary><ul class="lista">${passati.map(riga).join('')}</ul></details>` : ''}`;
  const m = apriModale({ titolo: 'Pause e chiusure', corpo, azioni: [
    { testo: 'Chiudi' }, { testo: 'Nuovo blocco', classe: 'btn-primario', onClick: () => { setTimeout(() => apriModuloBlocco({}), 0); return true; } }
  ] });
  $$('[data-id]', corpo).forEach((b) => b.addEventListener('click', () => { m.chiudi(); apriModuloBlocco({ blocco: blocchi.find((x) => x.id === b.dataset.id) }); }));
}

function apriModuloBlocco({ blocco = null, inizio = null } = {}) {
  const b = blocco ? clona(blocco) : null;
  const rif = inizio || new Date();
  const ric = b && b.ricorrenza;
  const iniS = b && !ric ? new Date(b.inizio) : rif;
  const finS = b && !ric ? new Date(b.fine) : D.aggiungiMinuti(rif, 60);
  const tutto = b ? !!b.tuttoIlGiorno : false;
  const ultimoGiorno = b && !ric && tutto ? D.aggiungiGiorni(finS, -1) : finS;
  const giorniSel = ric ? b.ricorrenza.giorni : [rif.getDay()];
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="riga-campi">
      <div class="campo"><label for="bl-tipo">Tipo</label><select id="bl-tipo">${Object.entries(TIPI_BLOCCO).map(([k, v]) => `<option value="${k}" ${(b ? b.tipo : 'pausa') === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="campo"><label for="bl-titolo">Descrizione (facoltativa)</label><input type="text" id="bl-titolo" value="${esc(b ? b.titolo || '' : '')}"></div>
    </div>
    ${piuOperatrici() ? `<div class="campo"><label for="bl-op">Vale per</label><select id="bl-op"><option value="">Tutte le operatrici</option>${cfg().operatrici.map((o) => `<option value="${esc(o.id)}" ${b && b.operatriceId === o.id ? 'selected' : ''}>${esc(o.nome || 'Operatrice')}</option>`).join('')}</select></div>` : ''}
    <div class="segmentato" role="group" aria-label="Ripetizione" style="margin-bottom:12px">
      <button type="button" data-mod="singolo" aria-pressed="${!ric}">Una volta</button>
      <button type="button" data-mod="settimanale" aria-pressed="${!!ric}">Ogni settimana</button>
    </div>
    <div id="bl-singolo" class="${ric ? 'nascosto' : ''}">
      <label class="check"><input type="checkbox" id="bl-tutto" ${tutto ? 'checked' : ''}> Giornata intera (es. ferie, chiusura)</label>
      <div class="riga-campi">
        <div class="campo"><label for="bl-dal">Dal giorno</label><input type="date" id="bl-dal" value="${D.key(iniS)}"></div>
        <div class="campo bl-ore"><label for="bl-ora-i">Dalle</label><input type="time" id="bl-ora-i" value="${D.hhmm(iniS)}"></div>
        <div class="campo bl-giorni"><label for="bl-al">Al giorno</label><input type="date" id="bl-al" value="${D.key(ultimoGiorno)}"></div>
        <div class="campo bl-ore"><label for="bl-ora-f">Alle</label><input type="time" id="bl-ora-f" value="${D.hhmm(finS)}"></div>
      </div>
    </div>
    <div id="bl-settimanale" class="${ric ? '' : 'nascosto'}">
      <div class="chips" style="margin-bottom:10px">${[1, 2, 3, 4, 5, 6, 0].map((g) => `<button type="button" class="chip" data-g="${g}" aria-pressed="${giorniSel.includes(g)}">${GIORNI_NOME[GIORNI_KEY[g]].slice(0, 3)}</button>`).join('')}</div>
      <div class="riga-campi">
        <div class="campo"><label for="bl-r-i">Dalle</label><input type="time" id="bl-r-i" value="${ric ? b.ricorrenza.oraInizio : '13:00'}"></div>
        <div class="campo"><label for="bl-r-f">Alle</label><input type="time" id="bl-r-f" value="${ric ? b.ricorrenza.oraFine : '14:00'}"></div>
        <div class="campo"><label for="bl-r-dal">A partire dal</label><input type="date" id="bl-r-dal" value="${ric ? b.ricorrenza.dal : D.key(rif)}"></div>
        <div class="campo"><label for="bl-r-al">Fino al (facoltativo)</label><input type="date" id="bl-r-al" value="${ric ? b.ricorrenza.al || '' : ''}"></div>
      </div>
    </div>`;
  let modo = ric ? 'settimanale' : 'singolo';
  const s = (q) => $(q, corpo);
  const aggiornaTutto = () => { const t = s('#bl-tutto').checked; $$('.bl-ore', corpo).forEach((e) => e.classList.toggle('nascosto', t)); };
  s('#bl-tutto').addEventListener('change', aggiornaTutto); aggiornaTutto();
  $$('[data-mod]', corpo).forEach((btn) => btn.addEventListener('click', () => {
    modo = btn.dataset.mod; $$('[data-mod]', corpo).forEach((x) => x.setAttribute('aria-pressed', String(x === btn)));
    s('#bl-singolo').classList.toggle('nascosto', modo !== 'singolo'); s('#bl-settimanale').classList.toggle('nascosto', modo !== 'settimanale');
  }));
  $$('[data-g]', corpo).forEach((btn) => btn.addEventListener('click', () => btn.setAttribute('aria-pressed', String(btn.getAttribute('aria-pressed') !== 'true'))));

  const salva = async () => {
    const rec = b || { archiviato: false };
    rec.tipo = s('#bl-tipo').value; rec.titolo = s('#bl-titolo').value.trim();
    rec.operatriceId = s('#bl-op') ? s('#bl-op').value || null : null;
    let da, a;
    if (modo === 'singolo') {
      const dal = s('#bl-dal').value; let al = s('#bl-al').value || dal;
      if (!dal) { toast('Indica la data.'); return false; }
      if (al < dal) al = dal;
      rec.ricorrenza = null; rec.tuttoIlGiorno = s('#bl-tutto').checked;
      if (rec.tuttoIlGiorno) { da = D.combina(dal, '00:00'); a = D.combina(D.aggiungiGiorniKey(al, 1), '00:00'); }
      else { da = D.combina(dal, s('#bl-ora-i').value || '00:00'); a = D.combina(al, s('#bl-ora-f').value || '00:00'); }
      if (!(a > da)) { toast('L\'orario di fine deve essere dopo l\'inizio.'); return false; }
      rec.inizio = da.toISOString(); rec.fine = a.toISOString();
    } else {
      const giorni = $$('[data-g]', corpo).filter((x) => x.getAttribute('aria-pressed') === 'true').map((x) => Number(x.dataset.g));
      const oi = s('#bl-r-i').value, of = s('#bl-r-f').value;
      if (!giorni.length) { toast('Scegli almeno un giorno della settimana.'); return false; }
      if (!oi || !of || D.minDaHHMM(of) <= D.minDaHHMM(oi)) { toast('Controlla gli orari.'); return false; }
      rec.ricorrenza = { giorni, oraInizio: oi, oraFine: of, dal: s('#bl-r-dal').value || D.oggiKey(), al: s('#bl-r-al').value || null };
      rec.tuttoIlGiorno = false; rec.inizio = null; rec.fine = null;
      da = D.combina(rec.ricorrenza.dal, '00:00'); a = rec.ricorrenza.al ? D.combina(D.aggiungiGiorniKey(rec.ricorrenza.al, 1), '00:00') : D.aggiungiGiorni(da, 365);
    }
    // Appuntamenti già presi nel periodo bloccato
    const prova = { ...rec, id: rec.id || 'nuovo' };
    const apps = (await appuntamentiTra(new Date(Math.max(da.getTime(), Date.now())), a)).filter((x) => ['prenotato', 'confermato'].includes(x.stato) && (!rec.operatriceId || x.operatriceId === rec.operatriceId));
    const ist = []; // istanze del blocco in prova
    if (prova.ricorrenza) {
      for (const x of apps) { const g = new Date(x.inizio); const k = D.key(g); if (prova.ricorrenza.giorni.includes(g.getDay()) && k >= prova.ricorrenza.dal && (!prova.ricorrenza.al || k <= prova.ricorrenza.al)) { const bi = D.combina(k, prova.ricorrenza.oraInizio), bf = D.combina(k, prova.ricorrenza.oraFine); if (bi < new Date(x.fine) && bf > g) ist.push(x); } }
    } else ist.push(...apps);
    if (ist.length) {
      const mc = await mappaClienti();
      const ok = await conferma({ titolo: 'Ci sono appuntamenti in questo periodo', messaggio: `<p>Questi appuntamenti restano in agenda: ricordati di spostarli o annullarli.</p><ul>${ist.slice(0, 15).map((x) => `<li>${esc(F.giornoLungo(new Date(x.inizio)))} ${D.hhmm(new Date(x.inizio))} — ${esc(nomeCliente(mc.get(x.clienteId)))}</li>`).join('')}${ist.length > 15 ? `<li>… e altri ${ist.length - 15}</li>` : ''}</ul>`, ok: 'Salva il blocco' });
      if (!ok) return false;
    }
    const prec = b ? clona(blocco) : null;
    await Repo.blocchi.put(rec);
    toastAnnulla(b ? 'Blocco aggiornato' : 'Orario bloccato', async () => { if (prec) await Repo.blocchi.put(prec); else await Repo.blocchi.delete(rec.id); });
    aggiornaVista();
    return true;
  };
  const azioni = [{ testo: 'Annulla' }];
  if (b) azioni.push({ testo: 'Elimina', classe: 'btn-pericolo', onClick: async () => {
    await Repo.blocchi.archivia(b.id);
    toastAnnulla('Blocco eliminato', async () => { await Repo.blocchi.ripristina(b.id); });
    aggiornaVista(); return true;
  } });
  azioni.push({ testo: 'Salva', classe: 'btn-primario', onClick: salva });
  apriModale({ titolo: b ? 'Modifica blocco' : 'Blocca orario', corpo, azioni });
}
</script>
<script>
'use strict';
/* =====================================================================================
   CLIENTI, SCHEDE LAVORO (STORICO), RICHIAMI
   ===================================================================================== */
function nuovaClienteVuota({ nome = '', cognome = '', telefono = '' } = {}) {
  return {
    nome, cognome, telefono, email: '', dataNascita: '', note: '',
    preferenze: { forma: '', lunghezza: '', colori: '', tecnica: '' },
    avvertenze: '', tag: [],
    consensi: { privacy: { dato: false, data: '' }, sanitari: { dato: false, data: '' }, foto: { dato: false, data: '' }, marketing: { dato: false, data: '' } },
    archiviato: false
  };
}
const normTesto = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

/* ----- Elenco clienti ----- */
const statoClienti = { q: '', tag: '', ordine: 'ultima' };
async function vistaClienti(el) {
  const [clienti, visite, apps] = await Promise.all([Repo.clienti.list(), tutteLeVisite(), Repo.appuntamenti.list()]);
  const ultima = new Map(); for (const v of visite) if (!ultima.get(v.clienteId) || v.data > ultima.get(v.clienteId)) ultima.set(v.clienteId, v.data);
  const oraISO = new Date().toISOString(); const prossimo = new Map();
  for (const a of apps) if (a.inizio > oraISO && ['prenotato', 'confermato'].includes(a.stato)) { const p = prossimo.get(a.clienteId); if (!p || a.inizio < p) prossimo.set(a.clienteId, a.inizio); }
  const tags = [...new Set(clienti.flatMap((c) => c.tag || []))].sort((a, b) => a.localeCompare(b, 'it'));
  el.innerHTML = `
    <div class="intestazione"><h1>Clienti <span class="muted" style="font-weight:400">(${clienti.length})</span></h1>
      <button class="btn btn-primario" type="button" id="cl-nuova">${icona('piu')} Nuova cliente</button></div>
    <div class="card">
      <div class="riga-campi" style="grid-template-columns: 2fr 1fr">
        <div class="campo" style="margin:0"><label class="sr" for="cl-q">Cerca</label><input type="search" id="cl-q" placeholder="Cerca per nome, cognome o telefono" value="${esc(statoClienti.q)}" autocomplete="off"></div>
        <div class="campo" style="margin:0"><label class="sr" for="cl-ord">Ordina</label><select id="cl-ord">
          <option value="ultima" ${statoClienti.ordine === 'ultima' ? 'selected' : ''}>Ultima visita (recenti prima)</option>
          <option value="nome" ${statoClienti.ordine === 'nome' ? 'selected' : ''}>Nome A→Z</option>
          <option value="cognome" ${statoClienti.ordine === 'cognome' ? 'selected' : ''}>Cognome A→Z</option></select></div>
      </div>
      ${tags.length ? `<div class="chips" style="margin-top:10px"><button type="button" class="chip" data-tag="" aria-pressed="${!statoClienti.tag}">Tutte</button>${tags.map((t) => `<button type="button" class="chip" data-tag="${esc(t)}" aria-pressed="${statoClienti.tag === t}">${esc(t)}</button>`).join('')}</div>` : ''}
      <ul class="lista" id="cl-lista" style="margin-top:8px"></ul>
    </div>`;
  const disegna = () => {
    const q = normTesto(statoClienti.q).trim(); const qC = q.replace(/\D/g, '');
    let lista = clienti.filter((c) => {
      if (statoClienti.tag && !(c.tag || []).includes(statoClienti.tag)) return false;
      if (!q) return true;
      const t = normTesto(`${c.nome} ${c.cognome} ${c.cognome} ${c.nome}`);
      return q.split(/\s+/).every((p) => t.includes(p)) || (qC.length >= 3 && (c.telefono || '').replace(/\D/g, '').includes(qC));
    });
    const cmp = { nome: (a, b) => nomeCliente(a).localeCompare(nomeCliente(b), 'it'), cognome: (a, b) => (a.cognome || a.nome || '').localeCompare(b.cognome || b.nome || '', 'it'), ultima: (a, b) => (ultima.get(b.id) || '').localeCompare(ultima.get(a.id) || '') || nomeCliente(a).localeCompare(nomeCliente(b), 'it') };
    lista.sort(cmp[statoClienti.ordine]);
    $('#cl-lista', el).innerHTML = lista.map((c) => `<li><a class="riga" href="#/cliente/${encodeURIComponent(c.id)}">
      <span class="principale"><span class="titolo">${esc(nomeCliente(c))}${haAvvertenze(c) ? ' <span class="badge badge-pericolo">⚠️ avvertenze</span>' : ''}${c.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}</span>
      <div class="sotto">${esc(telefonoLeggibile(c.telefono))}${ultima.get(c.id) ? ` · ultima visita ${esc(F.dataKey(ultima.get(c.id)))}` : ''}${prossimo.get(c.id) ? ` · prossimo ${esc(F.giornoBreve(new Date(prossimo.get(c.id))))}` : ''}</div>
      ${(c.tag || []).length ? `<div class="chips" style="margin-top:4px">${c.tag.map((t) => `<span class="badge">${esc(t)}</span>`).join('')}</div>` : ''}</span>
      ${icona('destra')}</a></li>`).join('') || `<li class="vuoto">${clienti.length ? 'Nessuna cliente corrisponde alla ricerca.' : 'Nessuna cliente ancora. Aggiungi la prima con “Nuova cliente”.'}</li>`;
    $$('#cl-lista svg', el).forEach((s) => { s.style.width = '20px'; s.style.color = 'var(--testo-2)'; });
  };
  disegna();
  $('#cl-q', el).addEventListener('input', (e) => { statoClienti.q = e.target.value; disegna(); });
  $('#cl-ord', el).addEventListener('change', (e) => { statoClienti.ordine = e.target.value; disegna(); });
  $$('[data-tag]', el).forEach((b) => b.addEventListener('click', () => { statoClienti.tag = b.dataset.tag; $$('[data-tag]', el).forEach((x) => x.setAttribute('aria-pressed', String(x === b))); disegna(); }));
  $('#cl-nuova', el).addEventListener('click', async () => { const c = await apriModuloCliente({}); if (c) vai(`#/cliente/${encodeURIComponent(c.id)}`); });
}

/* ----- Modulo cliente ----- */
async function apriModuloCliente({ cliente = null }) {
  const c = cliente ? clona(cliente) : nuovaClienteVuota();
  c.consensi = Object.assign(nuovaClienteVuota().consensi, c.consensi || {});
  c.preferenze = Object.assign(nuovaClienteVuota().preferenze, c.preferenze || {});
  const opt = (lista, v) => `<option value=""></option>` + lista.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <div class="riga-campi">
      <div class="campo"><label for="c-nome">Nome *</label><input type="text" id="c-nome" value="${esc(c.nome)}" autocomplete="off"></div>
      <div class="campo"><label for="c-cognome">Cognome</label><input type="text" id="c-cognome" value="${esc(c.cognome)}" autocomplete="off"></div>
    </div>
    <div class="riga-campi">
      <div class="campo"><label for="c-tel">Telefono</label><input type="tel" id="c-tel" inputmode="tel" value="${esc(c.telefono)}" autocomplete="off"><span class="aiuto" id="c-tel-aiuto"></span></div>
      <div class="campo"><label for="c-email">Email</label><input type="email" id="c-email" value="${esc(c.email)}" autocomplete="off"></div>
      <div class="campo"><label for="c-nascita">Data di nascita (facoltativa)</label><input type="date" id="c-nascita" value="${esc(c.dataNascita)}"></div>
    </div>
    <div class="campo"><label for="c-tag">Etichette (separate da virgola)</label><input type="text" id="c-tag" value="${esc((c.tag || []).join(', '))}" placeholder="es. abituale, domicilio"></div>
    <fieldset><legend>Preferenze</legend>
      <div class="riga-campi">
        <div class="campo"><label for="c-forma">Forma</label><select id="c-forma">${opt(FORME, c.preferenze.forma)}</select></div>
        <div class="campo"><label for="c-lung">Lunghezza</label><select id="c-lung">${opt(LUNGHEZZE, c.preferenze.lunghezza)}</select></div>
        <div class="campo"><label for="c-tec">Tecnica preferita</label><select id="c-tec">${opt(TECNICHE, c.preferenze.tecnica)}</select></div>
      </div>
      <div class="campo"><label for="c-colori">Colori / codici preferiti</label><input type="text" id="c-colori" value="${esc(c.preferenze.colori)}"></div>
    </fieldset>
    <fieldset><legend>Consensi</legend>
      ${Object.entries(CONSENSI).map(([k, nome]) => `<div class="riga-campi" style="align-items:center;grid-template-columns: 1fr 170px">
        <label class="check"><input type="checkbox" data-cons="${k}" ${c.consensi[k].dato ? 'checked' : ''}> ${esc(nome)}</label>
        <input type="date" data-cons-data="${k}" value="${esc(c.consensi[k].data || '')}" aria-label="Data del consenso: ${esc(nome)}" ${c.consensi[k].dato ? '' : 'disabled'}></div>`).join('')}
    </fieldset>
    <div class="campo"><label for="c-avv">⚠️ Avvertenze e sensibilità (allergie, reazioni ad acrilati/HEMA…)</label>
      <textarea id="c-avv">${esc(c.avvertenze)}</textarea>
      <span class="aiuto" id="c-avv-aiuto"></span></div>
    <div class="campo"><label for="c-note">Note</label><textarea id="c-note">${esc(c.note)}</textarea></div>`;
  const s = (q) => $(q, corpo);
  const aggiornaAvv = () => {
    const ok = s('[data-cons="sanitari"]').checked;
    s('#c-avv').disabled = !ok;
    s('#c-avv-aiuto').textContent = ok ? '' : 'Per scrivere dati sulla salute serve il consenso “Dati sanitari” registrato qui sopra.';
  };
  $$('[data-cons]', corpo).forEach((cb) => cb.addEventListener('change', () => {
    const d = s(`[data-cons-data="${cb.dataset.cons}"]`); d.disabled = !cb.checked;
    if (cb.checked && !d.value) d.value = D.oggiKey();
    aggiornaAvv();
  }));
  aggiornaAvv();
  s('#c-tel').addEventListener('input', () => { const n = normalizzaTelefono(s('#c-tel').value); s('#c-tel-aiuto').textContent = n ? `Verrà salvato come ${n}` : ''; });
  const salva = async () => {
    const nome = s('#c-nome').value.trim(); if (!nome) { toast('Il nome è obbligatorio.'); s('#c-nome').focus(); return false; }
    const tel = normalizzaTelefono(s('#c-tel').value);
    if (tel) {
      const dup = (await Repo.clienti.list({ archiviati: true })).find((x) => x.telefono === tel && x.id !== c.id);
      if (dup && !(await conferma({ titolo: 'Numero già presente', messaggio: `<p>Il numero è già associato a <strong>${esc(nomeCliente(dup))}</strong>${dup.archiviato ? ' (archiviata)' : ''}.</p><p>Salvare comunque?</p>`, ok: 'Salva comunque' }))) return false;
    }
    for (const k of Object.keys(CONSENSI)) { const dato = s(`[data-cons="${k}"]`).checked; c.consensi[k] = { dato, data: dato ? (s(`[data-cons-data="${k}"]`).value || D.oggiKey()) : '' }; }
    let avv = s('#c-avv').value.trim();
    if (!c.consensi.sanitari.dato && avv) {
      if (!(await conferma({ titolo: 'Consenso dati sanitari assente', messaggio: 'Senza il consenso ai dati sanitari le avvertenze non possono essere conservate e verranno cancellate.', ok: 'Cancella le avvertenze e salva', pericolo: true }))) return false;
      avv = '';
    }
    Object.assign(c, {
      nome, cognome: s('#c-cognome').value.trim(), telefono: tel, email: s('#c-email').value.trim(), dataNascita: s('#c-nascita').value,
      tag: [...new Set(s('#c-tag').value.split(',').map((t) => t.trim()).filter(Boolean))],
      preferenze: { forma: s('#c-forma').value, lunghezza: s('#c-lung').value, tecnica: s('#c-tec').value, colori: s('#c-colori').value.trim() },
      avvertenze: avv, note: s('#c-note').value.trim()
    });
    await Repo.clienti.put(c);
    toast(cliente ? 'Scheda cliente aggiornata' : 'Cliente aggiunta');
    return true;
  };
  const m = apriModale({ titolo: cliente ? 'Modifica cliente' : 'Nuova cliente', corpo, grande: true, azioni: [{ testo: 'Annulla' }, { testo: 'Salva', classe: 'btn-primario', onClick: salva }] });
  const ok = await m.promessa;
  return ok ? c : null;
}

function rigaAppuntamento(a, cliente, { conData = false } = {}) {
  const i = new Date(a.inizio), f = new Date(a.fine);
  const nome = cliente ? nomeCliente(cliente) : '';
  const st = STATI[a.stato];
  return `<li><button type="button" class="riga" data-app="${esc(a.id)}">
    <span class="barra" style="background:${st.colore}"></span>
    <span class="ora">${D.hhmm(i)}</span>
    <span class="principale">
      <span class="titolo">${conData ? esc(F.giornoLungo(i)) : esc(nome)}${cliente && haAvvertenze(cliente) ? ' ⚠️' : ''}${(a.accontoCent || 0) > 0 ? ' 💶' : ''}${a.promemoriaInviatoIl ? ' <span title="Promemoria inviato" aria-label="Promemoria inviato">💬</span>' : ''}${a.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}</span>
      <div class="sotto">${F.intervallo(i, f)} · ${esc((a.servizi || []).map((s) => s.nome).join(' + ') || '—')}</div>
    </span>
    <span class="stato" style="background:${st.colore}">${st.nome}</span></button></li>`;
}

async function archiviaCliente(c) {
  const oraISO = new Date().toISOString();
  const futuri = (await appuntamentiCliente(c.id)).filter((a) => a.inizio >= oraISO && ['prenotato', 'confermato'].includes(a.stato));
  let annullaFuturi = false;
  if (futuri.length) {
    const scelta = await apriModale({ titolo: 'La cliente ha appuntamenti futuri', corpo: `<p><strong>${esc(nomeCliente(c))}</strong> ha ${futuri.length} appuntament${futuri.length === 1 ? 'o' : 'i'} in programma:</p><ul>${futuri.map((a) => `<li>${esc(F.giornoLungo(new Date(a.inizio)))} ${D.hhmm(new Date(a.inizio))}</li>`).join('')}</ul>`, azioni: [
      { testo: 'Indietro', valore: null }, { testo: 'Archivia e mantieni gli appuntamenti', valore: 'mantieni' }, { testo: 'Archivia e annulla gli appuntamenti', valore: 'annulla', classe: 'btn-pericolo' }
    ] }).promessa;
    if (!scelta) return;
    annullaFuturi = scelta === 'annulla';
  } else if (!(await conferma({ titolo: 'Archiviare la cliente?', messaggio: 'Non comparirà più nelle ricerche. Potrai ripristinarla da qui o da Impostazioni → Dati.', ok: 'Archivia' }))) return;
  const prec = futuri.map((a) => ({ id: a.id, stato: a.stato }));
  if (annullaFuturi) for (const a of futuri) { a.stato = 'annullato'; await Repo.appuntamenti.put(a); }
  await Repo.clienti.archivia(c.id);
  toastAnnulla('Cliente archiviata', async () => {
    await Repo.clienti.ripristina(c.id);
    if (annullaFuturi) for (const p of prec) { const a = await Repo.appuntamenti.get(p.id); a.stato = p.stato; await Repo.appuntamenti.put(a); }
  });
  aggiornaVista();
}

async function esportaDatiCliente(id) {
  const c = await Repo.clienti.get(id);
  const [apps, schede, foto] = await Promise.all([Repo.appuntamenti.query('clienteId', id), Repo.schede_lavoro.query('clienteId', id), Repo.foto.query('clienteId', id)]);
  const fotoOut = []; for (const f of foto) fotoOut.push({ ...f, blob: undefined, dataURL: await blobADataURL(f.blob) });
  const appunti = (await Repo.appunti.list({ archiviati: true })).filter((a) => a.collegamento && a.collegamento.tipo === 'cliente' && a.collegamento.id === id);
  const out = { esportatoIl: new Date().toISOString(), attivita: cfg().attivita.nome, cliente: c, appuntamenti: apps, schedeLavoro: schede, appunti, foto: fotoOut };
  scaricaFile(`dati-cliente-${normTesto(nomeCliente(c)).replace(/[^a-z0-9]+/g, '-')}-${D.oggiKey()}.json`, JSON.stringify(out, null, 2));
}

async function ripetiUltimoLavoro(clienteId) {
  const schede = await schedeCliente(clienteId);
  const apps = (await appuntamentiCliente(clienteId)).filter((a) => a.stato === 'completato').reverse();
  const ultima = schede[0]; const ultimoApp = apps[0];
  const fonte = ultima && (!ultimoApp || ultima.data >= D.key(new Date(ultimoApp.inizio))) ? { data: ultima.data, servizi: ultima.servizi, colori: ultima.colori, note: ultima.noteProssimaVolta } : (ultimoApp ? { data: D.key(new Date(ultimoApp.inizio)), servizi: ultimoApp.servizi, colori: '', note: '' } : null);
  if (!fonte) { toast('Nessun lavoro precedente da ripetere.'); return; }
  const mappaS = await mappaServizi();
  const richiami = (fonte.servizi || []).map((s) => Number(mappaS.get(s.servizioId)?.richiamoGiorni ?? s.richiamoGiorni) || 0).filter((x) => x > 0);
  let daKey = D.oggiKey();
  if (richiami.length) { const k = D.aggiungiGiorniKey(fonte.data, Math.min(...richiami)); if (k > daKey) daKey = k; }
  const preServizi = (fonte.servizi || []).map((s) => ({ servizioId: s.servizioId, quantita: s.quantita || 1, nome: s.nome, durata: s.durata, prezzoCent: s.prezzoCent, colore: s.colore }));
  const durata = preServizi.reduce((t, s) => t + ((mappaS.get(s.servizioId) && !mappaS.get(s.servizioId).archiviato ? mappaS.get(s.servizioId).durata : s.durata) || 0) * s.quantita, 0);
  let inizio = D.combina(daKey, '09:00');
  if (cfg().orari && durata > 0) {
    const r = await trovaSlotLiberi({ durataMin: durata, operatriceId: cfg().operatrici[0].id, servizi: preServizi, da: D.combina(daKey, '00:00'), quanti: 1 });
    if (r.slot && r.slot[0]) inizio = r.slot[0];
  }
  const note = [fonte.colori ? `Come l'ultima volta (${F.dataKey(fonte.data)}): ${fonte.colori}` : '', fonte.note ? `Nota: ${fonte.note}` : ''].filter(Boolean).join('\n');
  apriModuloAppuntamento({ clienteId, preServizi, inizio, note });
}

/* ----- Scheda lavoro ----- */
async function apriSchedaLavoro({ app = null, scheda = null, clienteId = null }) {
  const modifica = !!scheda;
  const cliId = scheda ? scheda.clienteId : app ? app.clienteId : clienteId;
  const cli = await Repo.clienti.get(cliId);
  const listino = await serviziAttivi();
  const magazzinoOn = moduloAttivo('magazzino');
  const catalogo = magazzinoOn ? await prodottiAttivi() : [];
  const p = (cli && cli.preferenze) || {};
  // Prodotti consumati di default dai servizi dell'appuntamento (Impostazioni → Servizi)
  const prodottiDaServizi = () => {
    if (!magazzinoOn || !app) return [];
    const acc = new Map();
    for (const sv of app.servizi || []) {
      const def = listino.find((x) => x.id === sv.servizioId);
      for (const d of (def && def.prodottiDefault) || []) {
        const pr = catalogo.find((x) => x.id === d.prodottoId); if (!pr) continue;
        const r = acc.get(pr.id) || { prodottoId: pr.id, nome: nomeProdotto(pr), quantita: 0, lotto: pr.lotto || '', scala: true };
        r.quantita = qta(r.quantita + (Number(d.quantita) || 0) * (sv.quantita || 1)); acc.set(pr.id, r);
      }
    }
    return [...acc.values()];
  };
  const s0 = scheda ? clona({ ...scheda, fotoIds: undefined }) : {
    appuntamentoId: app ? app.id : null, clienteId: cliId,
    data: app ? D.key(new Date(app.inizio)) : D.oggiKey(), ora: app ? D.hhmm(new Date(app.inizio)) : D.hhmm(new Date()),
    servizi: app ? clona(app.servizi || []) : [], tecnica: p.tecnica || '', forma: p.forma || '', lunghezza: p.lunghezza || '', colori: '',
    prodotti: prodottiDaServizi(), durataRealeMin: app ? durataApp(app) : null, importoCent: app ? app.prezzoTotaleCent || 0 : null,
    metodoPagamento: '', note: '', noteProssimaVolta: '', archiviato: false
  };
  const servizi = clona(s0.servizi || []);
  const prodotti = clona(s0.prodotti || []);
  const fotoEsistenti = scheda ? await Repo.foto.query('schedaId', scheda.id) : [];
  const fotoRimosse = new Set(); const fotoNuove = []; // { blob, tipo, larghezza, altezza, url }
  const opt = (lista, v) => `<option value=""></option>` + lista.map((x) => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <p style="margin-top:0"><strong>${esc(nomeCliente(cli))}</strong>${app ? ` · appuntamento del ${esc(F.giornoLungo(new Date(app.inizio)))}` : ''}</p>
    ${haAvvertenze(cli) ? `<div class="avvertenze" style="margin-bottom:10px">⚠️ ${esc(cli.avvertenze)}</div>` : ''}
    <div class="riga-campi">
      <div class="campo"><label for="sl-data">Data</label><input type="date" id="sl-data" value="${esc(s0.data)}"></div>
      <div class="campo"><label for="sl-ora">Ora</label><input type="time" id="sl-ora" value="${esc(s0.ora || '')}"></div>
      <div class="campo"><label for="sl-durata">Durata reale (min)</label><input type="number" id="sl-durata" min="0" step="5" inputmode="numeric" value="${s0.durataRealeMin ?? ''}"></div>
    </div>
    <fieldset><legend>Servizi eseguiti</legend>
      <ul class="lista" id="sl-servizi"></ul>
      <div class="riga-campi" style="margin-top:8px"><select id="sl-agg-serv" aria-label="Aggiungi servizio"><option value="">+ Aggiungi servizio…</option>${listino.map((x) => `<option value="${esc(x.id)}">${esc(x.nome)} (${F.euro(x.prezzoCent)})</option>`).join('')}</select></div>
    </fieldset>
    <div class="riga-campi">
      <div class="campo"><label for="sl-tec">Tecnica</label><select id="sl-tec">${opt(TECNICHE, s0.tecnica)}</select></div>
      <div class="campo"><label for="sl-forma">Forma</label><select id="sl-forma">${opt(FORME, s0.forma)}</select></div>
      <div class="campo"><label for="sl-lung">Lunghezza</label><select id="sl-lung">${opt(LUNGHEZZE, s0.lunghezza)}</select></div>
    </div>
    <div class="campo"><label for="sl-colori">Colori / codici usati</label><input type="text" id="sl-colori" value="${esc(s0.colori)}" placeholder="marca, linea, codice"></div>
    <fieldset><legend>Prodotti usati</legend>
      <div id="sl-prodotti"></div>
      <button type="button" class="btn btn-piccolo" id="sl-agg-prod">${icona('piu')} Aggiungi prodotto</button>
      ${magazzinoOn ? '<p class="muted piccolo">Solo i prodotti con “Scala dal magazzino” spuntato vengono scaricati dalla giacenza, al salvataggio.</p>' : ''}
    </fieldset>
    <div class="riga-campi">
      <div class="campo"><label for="sl-importo">Importo incassato (€)</label><input type="text" id="sl-importo" inputmode="decimal" value="${F.testoDaCent(s0.importoCent)}">${app && app.accontoCent ? `<span class="aiuto">Comprende l'acconto di ${F.euro(app.accontoCent)} già versato: da incassare ora ${F.euro(Math.max(0, (app.prezzoTotaleCent || 0) - app.accontoCent))}.</span>` : ''}</div>
      <div class="campo"><label for="sl-pag">Metodo di pagamento</label><select id="sl-pag">${opt(PAGAMENTI, s0.metodoPagamento)}</select></div>
    </div>
    <fieldset><legend>Foto prima / dopo</legend>
      ${haConsenso(cli, 'foto') ? '' : '<div class="box box-avviso piccolo">La cliente non ha registrato il consenso alle foto: per aggiungerne devi prima registrarlo.</div>'}
      <div class="foto-griglia" id="sl-foto"></div>
      <div class="gruppo-btn" style="margin-top:8px">
        <button type="button" class="btn btn-piccolo" data-foto="prima">📷 Foto prima</button>
        <button type="button" class="btn btn-piccolo" data-foto="dopo">📷 Foto dopo</button>
      </div>
    </fieldset>
    <div class="campo"><label for="sl-note">Note sul lavoro</label><textarea id="sl-note">${esc(s0.note || '')}</textarea></div>
    <div class="campo"><label for="sl-next">Note per la prossima volta</label><textarea id="sl-next">${esc(s0.noteProssimaVolta || '')}</textarea></div>`;
  const s = (q) => $(q, corpo);

  const disegnaServizi = () => {
    s('#sl-servizi').innerHTML = servizi.map((x, i) => `<li class="riga" style="cursor:default;min-height:48px"><span class="principale">${esc(x.nome)}${x.quantita > 1 ? ` ×${x.quantita}` : ''}</span><span>${F.euro((x.prezzoCent || 0) * (x.quantita || 1))}</span><button type="button" class="btn btn-ghost btn-piccolo" data-rim-serv="${i}" aria-label="Rimuovi ${esc(x.nome)}">${icona('chiudi')}</button></li>`).join('') || '<li class="vuoto">Nessun servizio</li>';
    $$('[data-rim-serv]', corpo).forEach((b) => b.addEventListener('click', () => { servizi.splice(Number(b.dataset.rimServ), 1); disegnaServizi(); }));
  };
  s('#sl-agg-serv').addEventListener('change', (e) => {
    const x = listino.find((y) => y.id === e.target.value); if (!x) return;
    servizi.push({ servizioId: x.id, nome: x.nome, durata: x.durata, prezzoCent: x.prezzoCent, quantita: 1, colore: x.colore || null, richiamoGiorni: x.richiamoGiorni ?? null });
    e.target.value = ''; disegnaServizi();
    if (!modifica && !app) { s('#sl-importo').value = F.testoDaCent(servizi.reduce((t, y) => t + (y.prezzoCent || 0) * (y.quantita || 1), 0)); }
  });
  const disegnaProdotti = () => {
    s('#sl-prodotti').innerHTML = prodotti.map((x, i) => `<div class="riga-campi" style="grid-template-columns: 2fr 1fr 1fr ${magazzinoOn ? 'auto ' : ''}auto;align-items:end;border-top:1px solid var(--bordo);padding-top:6px">
      <div class="campo">${magazzinoOn ? `<label for="sl-p-s-${i}">Prodotto</label><select id="sl-p-s-${i}" data-psel="${i}"><option value="">— scritto a mano —</option>${catalogo.map((c) => `<option value="${esc(c.id)}" ${c.id === x.prodottoId ? 'selected' : ''}>${esc(nomeProdotto(c))}${c.marca ? ` — ${esc(c.marca)}` : ''}</option>`).join('')}</select>` : ''}
        ${!magazzinoOn || !x.prodottoId ? `<label for="sl-p-n-${i}" class="${magazzinoOn ? 'sr' : ''}">Nome prodotto</label><input type="text" id="sl-p-n-${i}" data-p="${i}" data-k="nome" value="${esc(x.nome)}" placeholder="${magazzinoOn ? 'oppure scrivi il nome' : ''}" ${magazzinoOn ? 'style="margin-top:4px"' : ''}>` : ''}</div>
      <div class="campo"><label for="sl-p-q-${i}">Quantità</label><input type="text" id="sl-p-q-${i}" data-p="${i}" data-k="quantita" inputmode="decimal" value="${esc(String(x.quantita ?? '').replace('.', ','))}"></div>
      <div class="campo"><label for="sl-p-l-${i}">Lotto</label><input type="text" id="sl-p-l-${i}" data-p="${i}" data-k="lotto" value="${esc(x.lotto || '')}"></div>
      ${magazzinoOn ? `<label class="check piccolo" style="margin-bottom:12px"><input type="checkbox" data-scala="${i}" ${x.scala && x.prodottoId ? 'checked' : ''} ${x.prodottoId ? '' : 'disabled'}> Scala dal magazzino</label>` : ''}
      <button type="button" class="btn btn-ghost" style="margin-bottom:12px" data-rim-prod="${i}" aria-label="Rimuovi prodotto">${icona('chiudi')}</button></div>`).join('');
    $$('[data-p]', corpo).forEach((inp) => inp.addEventListener('input', () => { prodotti[Number(inp.dataset.p)][inp.dataset.k] = inp.value; }));
    $$('[data-psel]', corpo).forEach((sel) => sel.addEventListener('change', () => {
      const r = prodotti[Number(sel.dataset.psel)]; const c = catalogo.find((x) => x.id === sel.value);
      r.prodottoId = c ? c.id : null; r.scala = !!c; if (c) { r.nome = nomeProdotto(c); if (!r.lotto) r.lotto = c.lotto || ''; if (!r.quantita) r.quantita = 1; }
      disegnaProdotti();
    }));
    $$('[data-scala]', corpo).forEach((cb) => cb.addEventListener('change', () => { prodotti[Number(cb.dataset.scala)].scala = cb.checked; }));
    $$('[data-rim-prod]', corpo).forEach((b) => b.addEventListener('click', () => { prodotti.splice(Number(b.dataset.rimProd), 1); disegnaProdotti(); }));
  };
  s('#sl-agg-prod').addEventListener('click', () => { prodotti.push({ nome: '', quantita: magazzinoOn ? 1 : '', lotto: '', prodottoId: null, scala: false }); disegnaProdotti(); (s(`#sl-p-s-${prodotti.length - 1}`) || s(`#sl-p-n-${prodotti.length - 1}`)).focus(); });
  const urlLocali = [];
  const disegnaFoto = () => {
    const es = fotoEsistenti.filter((f) => !fotoRimosse.has(f.id)).map((f) => ({ src: f._url || (f._url = (() => { const u = URL.createObjectURL(f.blob); urlLocali.push(u); return u; })()), tipo: f.tipo, rim: `e:${f.id}` }));
    const nu = fotoNuove.map((f, i) => ({ src: f.url, tipo: f.tipo, rim: `n:${i}` }));
    s('#sl-foto').innerHTML = [...es, ...nu].map((f) => `<figure><img src="${f.src}" alt="Foto ${esc(f.tipo)}"><figcaption>${esc(f.tipo)}</figcaption><button type="button" class="btn btn-pericolo rimuovi" data-rim-foto="${f.rim}" aria-label="Rimuovi foto">✕</button></figure>`).join('') || '<span class="muted piccolo">Nessuna foto</span>';
    $$('#sl-foto img', corpo).forEach((img) => img.addEventListener('click', () => apriFotoGrande(img.src, img.alt)));
    $$('[data-rim-foto]', corpo).forEach((b) => b.addEventListener('click', () => {
      const [t, v] = b.dataset.rimFoto.split(':');
      if (t === 'e') fotoRimosse.add(v); else { const [f] = fotoNuove.splice(Number(v), 1); URL.revokeObjectURL(f.url); }
      disegnaFoto();
    }));
  };
  $$('[data-foto]', corpo).forEach((b) => b.addEventListener('click', async () => {
    if (!haConsenso(cli, 'foto')) {
      const ok = await conferma({ titolo: 'Consenso foto', messaggio: `<p>Per salvare foto dei lavori serve il consenso della cliente.</p><p>Hai ottenuto oggi il consenso di <strong>${esc(nomeCliente(cli))}</strong>?</p>`, ok: 'Sì, registra il consenso' });
      if (!ok) return;
      cli.consensi = cli.consensi || nuovaClienteVuota().consensi;
      cli.consensi.foto = { dato: true, data: D.oggiKey() };
      await Repo.clienti.put(cli);
      $$('.box-avviso', s('#sl-foto').parentElement).forEach((x) => x.remove());
    }
    const file = await new Promise((ok) => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment'); i.addEventListener('change', () => ok(i.files[0] || null)); i.click(); });
    if (!file) return;
    try {
      const r = await comprimiFoto(file);
      fotoNuove.push({ ...r, tipo: b.dataset.foto, url: URL.createObjectURL(r.blob) });
      disegnaFoto();
    } catch (e) { erroreUI(e); }
  }));
  disegnaServizi(); disegnaProdotti(); disegnaFoto();

  const salva = async () => {
    const data = s('#sl-data').value; if (!data) { toast('Indica la data.'); return false; }
    const rec = scheda ? clona({ ...scheda }) : { ...s0 };
    if (scheda) rec.fotoIds = scheda.fotoIds;
    Object.assign(rec, {
      data, ora: s('#sl-ora').value, servizi: clona(servizi), tecnica: s('#sl-tec').value, forma: s('#sl-forma').value, lunghezza: s('#sl-lung').value,
      colori: s('#sl-colori').value.trim(), prodotti: prodotti.filter((x) => x.prodottoId || (x.nome && String(x.nome).trim())).map((x) => ({ ...x, nome: String(x.nome || '').trim(), quantita: String(x.quantita ?? '').replace(',', '.'), scala: !!(x.scala && x.prodottoId) })),
      durataRealeMin: s('#sl-durata').value === '' ? null : Number(s('#sl-durata').value),
      importoCent: F.centDaTesto(s('#sl-importo').value) ?? 0, metodoPagamento: s('#sl-pag').value,
      note: s('#sl-note').value.trim(), noteProssimaVolta: s('#sl-next').value.trim()
    });
    if (!rec.id) rec.id = uid();
    // Consumi di magazzino: ricalcolati da zero a ogni salvataggio della scheda
    const daScalare = magazzinoOn ? rec.prodotti.filter((x) => x.scala && x.prodottoId && Number(x.quantita) > 0) : [];
    const movPrec = magazzinoOn ? (await Repo.movimenti_magazzino.list({ archiviati: true })).filter((m) => m.riferimento && m.riferimento.tipo === 'scheda' && m.riferimento.id === rec.id) : [];
    if (daScalare.length) {
      const gia = await mappaGiacenze(); for (const m of movPrec) gia.set(m.prodottoId, qta((gia.get(m.prodottoId) || 0) - m.quantita));
      const uscite = new Map(); for (const x of daScalare) uscite.set(x.prodottoId, qta((uscite.get(x.prodottoId) || 0) + Number(x.quantita)));
      const negativi = [...uscite].filter(([id, q]) => qta((gia.get(id) || 0) - q) < 0).map(([id, q]) => { const c = catalogo.find((y) => y.id === id); return `${nomeProdotto(c)}: risultano ${fmtQta(gia.get(id) || 0, c?.unita)}, ne usi ${fmtQta(q, c?.unita)}`; });
      if (negativi.length && !(await conferma({ titolo: 'Giacenza insufficiente', messaggio: `<p>Alcuni prodotti andrebbero sotto zero:</p><ul>${negativi.map((n) => `<li>${esc(n)}</li>`).join('')}</ul><p>Puoi salvare lo stesso e correggere poi con una rettifica inventario.</p>`, ok: 'Salva comunque' }))) return false;
    }
    // foto
    const nuoveRec = fotoNuove.map((f) => ({ id: uid(), schedaId: rec.id, clienteId: rec.clienteId, tipo: f.tipo, blob: f.blob, larghezza: f.larghezza, altezza: f.altezza, demo: !!rec.demo }));
    if (nuoveRec.length) await Repo.foto.putMany(nuoveRec);
    for (const id of fotoRimosse) await Repo.foto.delete(id);
    rec.fotoIds = [...fotoEsistenti.filter((f) => !fotoRimosse.has(f.id)).map((f) => f.id), ...nuoveRec.map((f) => f.id)];
    await Repo.schede_lavoro.put(rec);
    for (const m of movPrec) await Repo.movimenti_magazzino.delete(m.id);
    const quando = D.combina(rec.data, rec.ora || '12:00').toISOString();
    const movNuovi = [];
    for (const x of daScalare) movNuovi.push(await registraMovimento({ prodottoId: x.prodottoId, tipo: 'consumo', quantita: Number(x.quantita), nota: `Scheda lavoro · ${nomeCliente(cli)}`, riferimento: { tipo: 'scheda', id: rec.id }, lotto: x.lotto || '', data: quando, demo: !!rec.demo }));
    let appPrec = null;
    if (app && !modifica) {
      const a = await Repo.appuntamenti.get(app.id);
      if (a) { appPrec = { stato: a.stato, schedaId: a.schedaId }; a.stato = 'completato'; a.schedaId = rec.id; await Repo.appuntamenti.put(a); }
    }
    const msgMag = movNuovi.length ? ` · ${movNuovi.length} prodott${movNuovi.length === 1 ? 'o scalato' : 'i scalati'} dal magazzino` : '';
    if (modifica) toast('Scheda lavoro aggiornata' + msgMag);
    else toastAnnulla((app ? 'Appuntamento completato e scheda salvata' : 'Scheda lavoro salvata') + msgMag, async () => {
      for (const m of movNuovi) await Repo.movimenti_magazzino.delete(m.id);
      for (const f of nuoveRec) await Repo.foto.delete(f.id);
      await Repo.schede_lavoro.delete(rec.id);
      if (appPrec) { const a = await Repo.appuntamenti.get(app.id); Object.assign(a, appPrec); await Repo.appuntamenti.put(a); }
    });
    aggiornaVista();
    return true;
  };
  const azioni = [{ testo: 'Annulla' }];
  if (modifica) azioni.push({ testo: 'Elimina', classe: 'btn-pericolo', onClick: async () => {
    if (!(await conferma({ titolo: 'Eliminare la scheda lavoro?', messaggio: 'Verrà archiviata: potrai ripristinarla da Impostazioni → Dati.', ok: 'Elimina', pericolo: true }))) return false;
    await Repo.schede_lavoro.archivia(scheda.id);
    toastAnnulla('Scheda lavoro eliminata', async () => { await Repo.schede_lavoro.ripristina(scheda.id); });
    aggiornaVista(); return true;
  } });
  azioni.push({ testo: modifica ? 'Salva' : (app ? 'Completa e salva' : 'Salva scheda'), classe: 'btn-primario', onClick: salva });
  const m = apriModale({ titolo: modifica ? 'Scheda lavoro' : 'Nuova scheda lavoro', corpo, grande: true, azioni });
  await m.promessa;
  urlLocali.forEach((u) => URL.revokeObjectURL(u));
  fotoNuove.forEach((f) => URL.revokeObjectURL(f.url));
}

/* ----- Vista "Da ricontattare" ----- */
async function vistaRichiami(el) {
  const lista = await clientiDaRicontattare();
  el.innerHTML = `
    <div class="intestazione"><h1>Da ricontattare</h1></div>
    <p class="muted">Clienti per cui è passato l'intervallo di richiamo del loro ultimo servizio (es. refill) e che non hanno appuntamenti in programma. L'intervallo si imposta per ogni servizio in Impostazioni → Servizi.</p>
    <div class="card"><ul class="lista">${lista.map((r) => `<li><div class="riga" style="cursor:default;flex-wrap:wrap">
      <span class="principale"><a class="titolo" href="#/cliente/${encodeURIComponent(r.cliente.id)}">${esc(nomeCliente(r.cliente))}</a>${r.cliente.demo ? ' <span class="badge badge-demo">PROVA</span>' : ''}
        <div class="sotto">Ultima visita ${esc(F.dataKey(r.ultimaVisita))} · ${esc(r.servizi)} · ${r.ritardo === 0 ? 'da oggi' : `da ${r.ritardo} giorn${r.ritardo === 1 ? 'o' : 'i'}`}</div></span>
      <span class="gruppo-btn">
        ${r.cliente.telefono && cfg().promemoriaWhatsApp ? `<button type="button" class="btn btn-wa btn-piccolo" data-wa="${esc(r.cliente.id)}">${icona('wa')} Scrivi</button>` : ''}
        ${moduloAttivo('agenda') ? `<button type="button" class="btn btn-primario btn-piccolo" data-pren="${esc(r.cliente.id)}">Prenota</button>` : ''}
      </span></div></li>`).join('') || '<li class="vuoto">Nessuna cliente da ricontattare. 🎉</li>'}</ul></div>`;
  $$('[data-wa]', el).forEach((b) => b.addEventListener('click', () => {
    const r = lista.find((x) => x.cliente.id === b.dataset.wa);

  }));
  $$('[data-pren]', el).forEach((b) => b.addEventListener('click', () => ripetiUltimoLavoro(b.dataset.pren).catch(erroreUI)));
}

<script>
'use strict';
/* =====================================================================================
   DASHBOARD "OGGI"
   ===================================================================================== */
async function vistaOggi(el) {
  const c = cfg(); const ora = new Date();
  const oggi = D.inizioGiorno(ora), domani = D.aggiungiGiorni(oggi, 1), dopodomani = D.aggiungiGiorni(oggi, 2);
  const agenda = moduloAttivo('agenda'); const mag = moduloAttivo('magazzino'); const ord = moduloAttivo('ordini'); const appunti = moduloAttivo('appunti');
  const [apps, mappaC, visite, ultimoBackup, persist, demo, nServizi, avvMag, promem, ordini, movimenti, pin, cartella] = await Promise.all([
    agenda ? appuntamentiTra(oggi, dopodomani) : [], mappaClienti(), tutteLeVisite(), leggiMeta('ultimoBackup'), statoPersistenza(), ciSonoDatiDemo(), Repo.servizi.count(),
    mag ? avvisiMagazzino() : null, appunti ? promemoriaInArrivo(7) : [], ord ? Repo.ordini_fornitore.list() : [], mag ? Repo.movimenti_magazzino.list({ archiviati: true }) : [], pinImpostato(), leggiMeta('cartellaBackup')
  ]);
  const richiami = moduloAttivo('clienti') ? await clientiDaRicontattare() : [];
  const daMostrare = (a) => a.stato !== 'annullato';
  const appOggi = apps.filter((a) => D.key(new Date(a.inizio)) === D.key(oggi) && daMostrare(a)).sort((a, b) => a.inizio.localeCompare(b.inizio));
  const appDomani = apps.filter((a) => D.key(new Date(a.inizio)) === D.key(domani) && daMostrare(a)).sort((a, b) => a.inizio.localeCompare(b.inizio));
  const kOggi = D.oggiKey(); const ls = D.key(D.inizioSettimana(ora)); const ds = D.aggiungiGiorniKey(ls, 6);
  const vendita = (da, a) => movimenti.filter((m) => m.tipo === 'vendita').filter((m) => { const k = D.key(new Date(m.data)); return k >= da && k <= a; }).reduce((t, m) => t + (m.importoCent || 0), 0);
  const incOggi = incassoTra(visite, kOggi, kOggi) + vendita(kOggi, kOggi), incSett = incassoTra(visite, ls, ds) + vendita(ls, ds);
