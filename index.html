<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Agenda</title>
<!--
  Agenda gestionale per Nail Artist / Estetista — FASE 1
  Libreria calendario: FullCalendar 6.1.21 (bundle standard, licenza MIT).
  Nessun plugin a pagamento (niente "scheduler", "resource", "timeline").
  Versione fissata; integrity SHA-384 calcolata sul file pubblicato su npm.
-->
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.21/index.global.min.js"
        integrity="sha384-WDvnzcla8X1CQM97EnYyl4OoTCvmMFp5lBiVNO3IjVdvLMOUjwt+iuYb/Mru5A9v"
        crossorigin="anonymous"
        onerror="window.__fcErrore = true"></script>
<style>
/* ===================== TEMA (le variabili brand vengono impostate da JS a partire da CONFIG.brand) ===================== */
:root {
  --primario: #B4646E;
  --primario-testo: #ffffff;
  --primario-tenue: #f3e3e5;
  --secondario: #F7EBEC;
  --accento: #3A2A2C;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;

  --bg: #faf7f7;
  --surface: #ffffff;
  --surface-2: #f4eff0;
  --testo: #231a1b;
  --testo-2: #5f5355;
  --bordo: #e4dadb;
  --pericolo: #b42318;
  --pericolo-bg: #fdecea;
  --avviso: #8a4b08;
  --avviso-bg: #fff4e0;
  --ok: #0f6b45;
  --ok-bg: #e6f4ec;
  --info-bg: #eef2fb;
  --radius: 14px;
  --ombra: 0 1px 2px rgba(0,0,0,.06), 0 4px 14px rgba(0,0,0,.05);
  --topbar-h: 56px;
  --nav-h: 0px;
}
:root[data-tema="scuro"] {
  --bg: #161213;
  --surface: #211b1c;
  --surface-2: #2b2425;
  --testo: #f4eeee;
  --testo-2: #c4b8b9;
  --bordo: #3d3334;
  --pericolo: #ff8a80;
  --pericolo-bg: #3a1d1b;
  --avviso: #ffcc80;
  --avviso-bg: #382a14;
  --ok: #7fd8a8;
  --ok-bg: #16301f;
  --info-bg: #1e2433;
  --ombra: 0 1px 2px rgba(0,0,0,.4);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  font-size: 16px;
  line-height: 1.45;
  background: var(--bg);
  color: var(--testo);
  -webkit-text-size-adjust: 100%;
}
a { color: var(--primario); }
:root[data-tema="scuro"] a { color: var(--testo); }
h1, h2, h3 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: 1.45rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
p { margin: .4em 0; }
.muted { color: var(--testo-2); }
.piccolo { font-size: .875rem; }
.nascosto { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--primario); outline-offset: 2px; }

/* ===================== LAYOUT ===================== */
.topbar {
  position: sticky; top: 0; z-index: 20;
  height: var(--topbar-h);
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px;
  padding-top: env(safe-area-inset-top);
  background: var(--surface);
  border-bottom: 1px solid var(--bordo);
}
.topbar .logo { width: 36px; height: 36px; border-radius: 10px; object-fit: cover; background: var(--secondario); display: grid; place-items: center; font-weight: 700; color: var(--accento); flex: none; }
.topbar .nome-attivita { font-weight: 650; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .spazio { flex: 1; }

#nav {
  position: fixed; z-index: 30;
  background: var(--surface);
  border-color: var(--bordo);
  display: flex;
}
#nav a {
  display: flex; align-items: center; gap: 10px;
  color: var(--testo-2); text-decoration: none;
  min-height: 48px; padding: 8px 14px; border-radius: 12px;
  font-weight: 550;
}
#nav a svg { width: 24px; height: 24px; flex: none; }
#nav a[aria-current="page"] { color: var(--accento); background: var(--secondario); }
:root[data-tema="scuro"] #nav a[aria-current="page"] { color: var(--testo); background: var(--surface-2); }

main#app { padding: 16px; max-width: 1400px; margin: 0 auto; }

@media (min-width: 900px) {
  #nav { top: var(--topbar-h); left: 0; bottom: 0; width: 220px; flex-direction: column; gap: 4px; padding: 12px; border-right: 1px solid var(--bordo); }
  main#app { margin-left: 220px; padding: 20px 24px; }
}
@media (max-width: 899px) {
  :root { --nav-h: 64px; }
  #nav { left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); border-top: 1px solid var(--bordo); justify-content: space-around; }
  #nav a { flex-direction: column; gap: 2px; font-size: .72rem; padding: 6px 4px; flex: 1; justify-content: center; border-radius: 0; }
  #nav a[aria-current="page"] { background: transparent; color: var(--primario); }
  main#app { padding: 12px 12px calc(var(--nav-h) + 24px + env(safe-area-inset-bottom)); }
}

/* ===================== COMPONENTI ===================== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; min-width: 44px; padding: 8px 16px;
  border-radius: 12px; border: 1px solid var(--bordo);
  background: var(--surface); color: var(--testo);
  font: inherit; font-weight: 600; cursor: pointer; text-decoration: none;
  touch-action: manipulation;
}
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn-primario { background: var(--primario); color: var(--primario-testo); border-color: transparent; }
.btn-primario:hover { background: var(--primario); filter: brightness(.94); }
.btn-pericolo { background: var(--pericolo); color: #fff; border-color: transparent; }
:root[data-tema="scuro"] .btn-pericolo { color: #1b0f0f; }
.btn-pericolo:hover { background: var(--pericolo); filter: brightness(.94); }
.btn-ghost { background: transparent; border-color: transparent; }
.btn-ok { background: var(--ok); color: #fff; border-color: transparent; }
:root[data-tema="scuro"] .btn-ok { color: #0d1f15; }
.btn-wa { background: #1f8f4e; color: #fff; border-color: transparent; }
.btn-piccolo { min-height: 44px; padding: 6px 12px; font-size: .9rem; }
.btn-blocco { width: 100%; }
.gruppo-btn { display: flex; flex-wrap: wrap; gap: 8px; }
.gruppo-btn.fine { justify-content: flex-end; }

.card {
  background: var(--surface); border: 1px solid var(--bordo);
  border-radius: var(--radius); padding: 16px; box-shadow: var(--ombra);
}
.card + .card { margin-top: 12px; }
.card-titolo { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-titolo h2 { margin: 0; }
.griglia { display: grid; gap: 12px; }
@media (min-width: 700px) { .griglia-2 { grid-template-columns: 1fr 1fr; } .griglia-3 { grid-template-columns: repeat(3, 1fr); } }
.griglia-dash { display: grid; gap: 12px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .griglia-dash { grid-template-columns: 1fr 1fr; } }

.intestazione { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; justify-content: space-between; margin-bottom: 14px; }
.intestazione h1 { margin: 0; }

.box { border-radius: 12px; padding: 12px 14px; margin: 8px 0; border: 1px solid transparent; }
.box-pericolo { background: var(--pericolo-bg); color: var(--pericolo); border-color: color-mix(in srgb, var(--pericolo) 30%, transparent); }
.box-avviso { background: var(--avviso-bg); color: var(--avviso); border-color: color-mix(in srgb, var(--avviso) 30%, transparent); }
.box-ok { background: var(--ok-bg); color: var(--ok); }
.box-info { background: var(--info-bg); }
.box strong { display: block; margin-bottom: 2px; }
.box ul { margin: 6px 0 0; padding-left: 20px; }

.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .78rem; font-weight: 650; padding: 2px 8px; border-radius: 999px;
  background: var(--surface-2); color: var(--testo-2); white-space: nowrap;
}
.badge-pericolo { background: var(--pericolo-bg); color: var(--pericolo); }
.badge-avviso { background: var(--avviso-bg); color: var(--avviso); }
.badge-ok { background: var(--ok-bg); color: var(--ok); }
.badge-demo { background: #fff0b3; color: #6b5300; }
.stato { display: inline-block; font-size: .78rem; font-weight: 650; padding: 2px 10px; border-radius: 999px; color: #fff; }

.chip {
  display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 6px 14px;
  border-radius: 999px; border: 1px solid var(--bordo); background: var(--surface);
  font: inherit; font-size: .9rem; cursor: pointer; color: var(--testo);
}
.chip[aria-pressed="true"] { background: var(--primario); color: var(--primario-testo); border-color: transparent; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* Liste */
.lista { list-style: none; margin: 0; padding: 0; }
.lista > li { border-top: 1px solid var(--bordo); }
.lista > li:first-child { border-top: 0; }
.riga {
  display: flex; align-items: center; gap: 12px; padding: 12px 4px; min-height: 56px;
  color: inherit; text-decoration: none; width: 100%; background: none; border: 0; font: inherit; text-align: left; cursor: pointer;
}
.riga:hover { background: var(--surface-2); }
.riga .principale { flex: 1; min-width: 0; }
.riga .titolo { font-weight: 600; }
.riga .sotto { color: var(--testo-2); font-size: .875rem; overflow: hidden; text-overflow: ellipsis; }
.riga .ora { font-variant-numeric: tabular-nums; font-weight: 700; min-width: 52px; }
.riga .barra { width: 5px; align-self: stretch; border-radius: 4px; flex: none; }
.vuoto { color: var(--testo-2); padding: 16px 4px; text-align: center; }

/* Form */
.campo { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; min-width: 0; }
.campo > label, .etichetta { font-weight: 600; font-size: .9rem; }
.campo .aiuto { font-size: .8rem; color: var(--testo-2); }
input[type=text], input[type=tel], input[type=email], input[type=search], input[type=number], input[type=date], input[type=time], input[type=password], select, textarea {
  font: inherit; font-size: 16px; /* evita lo zoom automatico su iOS */
  min-height: 44px; padding: 8px 12px; width: 100%;
  border-radius: 10px; border: 1px solid var(--bordo);
  background: var(--surface); color: var(--testo);
}
input[type=color] { width: 56px; height: 44px; padding: 2px; border-radius: 10px; border: 1px solid var(--bordo); background: var(--surface); }
textarea { min-height: 88px; resize: vertical; }
input:disabled, textarea:disabled, select:disabled { opacity: .6; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; cursor: pointer; }
.check input { width: 22px; height: 22px; flex: none; accent-color: var(--primario); }
.riga-campi { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
fieldset { border: 1px solid var(--bordo); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; }
legend { font-weight: 650; padding: 0 6px; }

/* Ricerca cliente nel modulo appuntamento */
.risultati { border: 1px solid var(--bordo); border-radius: 10px; margin-top: 4px; max-height: 260px; overflow: auto; background: var(--surface); }
.risultati button { display: block; width: 100%; text-align: left; padding: 10px 12px; min-height: 48px; border: 0; border-top: 1px solid var(--bordo); background: none; font: inherit; color: inherit; cursor: pointer; }
.risultati button:first-child { border-top: 0; }
.risultati button:hover, .risultati button:focus { background: var(--surface-2); }
.cliente-scelta { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--secondario); color: var(--accento); }
:root[data-tema="scuro"] .cliente-scelta { background: var(--surface-2); color: var(--testo); }

.servizio-riga { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-top: 1px solid var(--bordo); }
.servizio-riga:first-of-type { border-top: 0; }
.servizio-riga .pallino { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.servizio-riga .nome { flex: 1; min-width: 0; }
.qta { display: inline-flex; align-items: center; gap: 4px; }
.qta button { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--bordo); background: var(--surface); font-size: 1.2rem; color: var(--testo); cursor: pointer; }
.qta span { min-width: 24px; text-align: center; font-weight: 700; }

/* Modali */
dialog.modale {
  border: 0; padding: 0; border-radius: 18px; width: min(640px, calc(100vw - 24px));
  max-height: calc(100dvh - 24px); background: var(--surface); color: var(--testo);
  box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column;
}
dialog.modale:not([open]) { display: none; }
dialog.modale.grande { width: min(860px, calc(100vw - 24px)); }
dialog.modale::backdrop { background: rgba(20, 12, 14, .45); }
.modale-testa { display: flex; align-items: center; gap: 8px; padding: 14px 16px 10px; border-bottom: 1px solid var(--bordo); }
.modale-testa h2 { flex: 1; margin: 0; font-size: 1.15rem; }
.modale-corpo { padding: 14px 16px; overflow: auto; flex: 1; }
.modale-piede { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--bordo); }
@media (max-width: 600px) {
  dialog.modale, dialog.modale.grande { width: 100vw; max-width: 100vw; max-height: 100dvh; height: 100dvh; border-radius: 0; margin: 0; }
  .modale-piede .btn { flex: 1; }
}

/* Toast */
#toasts { position: fixed; z-index: 1000; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + 16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; width: min(520px, calc(100vw - 24px)); pointer-events: none; }
.toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 16px; border-radius: 14px; background: #2a2223; color: #fff; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
.toast .msg { flex: 1; }
.toast .btn { background: transparent; color: #ffd6db; border-color: rgba(255,255,255,.25); min-height: 40px; }
.toast.errore { background: #7a1610; }

/* Agenda */
.agenda-wrap { display: flex; flex-direction: column; height: calc(100dvh - var(--topbar-h) - var(--nav-h) - 40px); min-height: 480px; }
@media (max-width: 899px) { .agenda-wrap { height: calc(100dvh - var(--topbar-h) - var(--nav-h) - 24px - env(safe-area-inset-bottom)); } }
.agenda-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
.agenda-barra .titolo-periodo { font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 140px; text-transform: capitalize; }
.segmentato { display: inline-flex; border: 1px solid var(--bordo); border-radius: 12px; overflow: hidden; }
.segmentato button { min-height: 44px; padding: 6px 12px; border: 0; background: var(--surface); font: inherit; font-weight: 600; color: var(--testo-2); cursor: pointer; border-left: 1px solid var(--bordo); }
.segmentato button:first-child { border-left: 0; }
.segmentato button[aria-pressed="true"] { background: var(--primario); color: var(--primario-testo); }
#calendario { flex: 1; min-height: 0; background: var(--surface); border-radius: var(--radius); border: 1px solid var(--bordo); padding: 4px; }

.fc {
  --fc-border-color: var(--bordo);
  --fc-page-bg-color: var(--surface);
  --fc-neutral-bg-color: var(--surface-2);
  --fc-today-bg-color: color-mix(in srgb, var(--primario) 8%, transparent);
  --fc-now-indicator-color: var(--pericolo);
  --fc-non-business-color: color-mix(in srgb, var(--testo) 7%, transparent);
  --fc-bg-event-opacity: .35;
  --fc-list-event-hover-bg-color: var(--surface-2);
  font-size: .9rem;
}
.fc .fc-timegrid-slot { height: 2.1em; }
.fc .fc-col-header-cell-cushion, .fc .fc-daygrid-day-number { color: var(--testo); text-decoration: none; text-transform: capitalize; }
.fc .fc-list-day-cushion { background: var(--surface-2); text-transform: capitalize; }
.fc .fc-list-day-text, .fc .fc-list-day-side-text { color: var(--testo); text-decoration: none; }
.fc-event { cursor: pointer; border-radius: 6px; }
.fc .ev { padding: 1px 3px; overflow: hidden; line-height: 1.25; }
.fc .ev-ora { font-size: .78em; opacity: .9; font-variant-numeric: tabular-nums; }
.fc .ev-tit { font-weight: 700; }
.fc .ev-serv { font-size: .8em; opacity: .95; }
.fc .ev-annullato { opacity: .55; }
.fc .ev-annullato .ev-tit { text-decoration: line-through; }
.fc .ev-noshow { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.18) 0 6px, transparent 6px 12px); }
.fc .fc-bg-event { color: var(--testo); }
.fc .fc-bg-event .fc-event-title { font-size: .78rem; font-style: normal; font-weight: 650; padding: 2px 4px; }
.fc-blocco-sfondo { background-image: repeating-linear-gradient(135deg, rgba(0,0,0,.10) 0 4px, transparent 4px 10px) !important; }

@media (max-width: 700px) { .solo-largo { display: none !important; } .agenda-barra { gap: 6px; margin-bottom: 6px; } }
.slot-suggeriti { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }

/* Cliente */
.avvertenze { background: var(--pericolo-bg); color: var(--pericolo); border: 2px solid var(--pericolo); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
.statistiche { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.stat { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.stat .val { font-size: 1.25rem; font-weight: 750; font-variant-numeric: tabular-nums; }
.stat .lab { font-size: .8rem; color: var(--testo-2); }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 14px; }
.kv dt { color: var(--testo-2); }
.kv dd { margin: 0; }
.foto-griglia { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.foto-griglia figure { margin: 0; position: relative; }
.foto-griglia img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; display: block; border: 1px solid var(--bordo); cursor: zoom-in; }
.foto-griglia figcaption { font-size: .72rem; color: var(--testo-2); text-align: center; }
.foto-griglia .rimuovi { position: absolute; top: -8px; right: -8px; width: 32px; height: 32px; min-height: 0; padding: 0; border-radius: 50%; }
.lavoro { padding: 12px 0; border-top: 1px solid var(--bordo); }
.lavoro:first-child { border-top: 0; }
.foto-grande { max-width: 100%; max-height: 80dvh; display: block; margin: 0 auto; border-radius: 10px; }

details.card > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
details.card > summary::before { content: "▸"; color: var(--testo-2); }
details.card[open] > summary::before { content: "▾"; }
details.card > summary::-webkit-details-marker { display: none; }
details.card > summary { list-style: none; }
details.card > summary h2 { margin: 0; }

/* Avvio ed errori */
#avvio { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg); z-index: 2000; font-size: 1.1rem; color: var(--testo-2); padding: 20px; text-align: center; }
.errore-fatale { max-width: 560px; }
</style>
</head>
<body>
<div id="avvio" role="status">Caricamento dell'agenda…</div>
<header class="topbar">
  <div class="logo" id="tb-logo" aria-hidden="true"></div>
  <div class="nome-attivita" id="tb-nome"></div>
  <div class="spazio"></div>
  <button class="btn btn-primario btn-piccolo" id="tb-nuovo" type="button" aria-label="Nuovo appuntamento">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span>Appuntamento</span>
  </button>
</header>
<nav id="nav" aria-label="Menu principale"></nav>
<main id="app" tabindex="-1"></main>
<div id="toasts" aria-live="polite"></div>
<script>
'use strict';
/* =====================================================================================
   CONFIG — valori predefiniti dell'installazione (dalla <scheda_estetista>).
   Per una nuova estetista si modifica SOLO questo oggetto (oppure si importa un file
   di configurazione da Impostazioni → Dati). Le modifiche fatte in Impostazioni vengono
   salvate nel database e hanno la precedenza su questi valori.
   I campi lasciati vuoti restano vuoti nell'app: nessun valore di esempio viene usato
   come dato reale.
   ===================================================================================== */
const CONFIG = {
  attivita: {
    nome: '',                    // DA COMPILARE — Nome attività
    titolare: '',                // DA COMPILARE — Titolare
    citta: '',                   // DA COMPILARE — Città
    telefono: '',                // DA COMPILARE — Telefono/WhatsApp attività
    logo: null,                  // null oppure immagine (data URL) caricata da Impostazioni
    prefissoInternazionale: '39' // aggiunto ai numeri scritti senza prefisso (+39 Italia)
  },
  brand: {
    primario: '#B4646E',         // DA COMPILARE — colori del marchio
    secondario: '#F7EBEC',
    accento: '#3A2A2C',
    font: 'system-ui'
  },
  tema: 'chiaro',                // 'chiaro' | 'scuro' | 'auto'
  fusoOrario: 'Europe/Rome',

/* ===================== UTILITÀ ===================== */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const ESC_MAP = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC_MAP[c]);
const pad2 = (n) => String(n).padStart(2, '0');
const clona = (o) => (o == null ? o : JSON.parse(JSON.stringify(o)));

function uid() {
  if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
  // Ripiego per contesti non sicuri (es. pagina aperta via http su rete locale)
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40; b[8] = (b[8] & 0x3f) | 0x80;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  return `${h.slice(0, 8)}-${h.slice(8, 12)}-${h.slice(12, 16)}-${h.slice(16, 20)}-${h.slice(20)}`;
}

function unisciProfondo(base, sopra) {
  if (sopra === undefined) return clona(base);
  if (Array.isArray(base) || Array.isArray(sopra) || typeof base !== 'object' || base === null || typeof sopra !== 'object' || sopra === null) return clona(sopra);
  const r = clona(base);
  for (const k of Object.keys(sopra)) r[k] = k in base ? unisciProfondo(base[k], sopra[k]) : clona(sopra[k]);
  return r;
}

/* ===================== DATE LOCALI =====================
   Regole: le date-giorno sono stringhe 'AAAA-MM-GG' costruite con i getter LOCALI
   (mai toISOString, che è in UTC e sposta il giorno). Gli istanti (inizio/fine
   appuntamenti) si salvano come ISO UTC: rappresentano un momento preciso e si
   riconvertono in ora locale solo per la visualizzazione. Le somme di giorni usano
   setDate (corrette anche nei giorni di cambio dell'ora legale). */
const GIORNI_KEY = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
const GIORNI_NOME = { lun: 'Lunedì', mar: 'Martedì', mer: 'Mercoledì', gio: 'Giovedì', ven: 'Venerdì', sab: 'Sabato', dom: 'Domenica' };
const D = {
  key(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`; },
  daKey(k) { const [y, m, g] = k.split('-').map(Number); return new Date(y, m - 1, g); },
  combina(k, hhmm) {
    const [y, m, g] = k.split('-').map(Number); const [h, mi] = String(hhmm).split(':').map(Number);
    return new Date(y, m - 1, g, h, mi, 0, 0);
  },
  hhmm(d) { return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; },
  minDaHHMM(s) { const [h, m] = String(s).split(':').map(Number); return h * 60 + m; },
  hhmmDaMin(m) { return `${pad2(Math.floor(m / 60))}:${pad2(m % 60)}`; },
  minutiDelGiorno(d) { return d.getHours() * 60 + d.getMinutes(); },
  aggiungiGiorni(d, n) { const r = new Date(d.getTime()); r.setDate(r.getDate() + n); return r; },
  aggiungiMinuti(d, n) { return new Date(d.getTime() + n * 60000); },
  inizioGiorno(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); },
  inizioSettimana(d) { const g = D.inizioGiorno(d); return D.aggiungiGiorni(g, -((g.getDay() + 6) % 7)); },
  oggiKey() { return D.key(new Date()); },
  giornoKey(d) { return GIORNI_KEY[d.getDay()]; },
  minutiTra(a, b) { return Math.round((b - a) / 60000); },
  // giorni di calendario tra due chiavi (indipendente dall'ora legale)
  diffGiorni(aKey, bKey) {
    const [y1, m1, g1] = aKey.split('-').map(Number); const [y2, m2, g2] = bKey.split('-').map(Number);
    return Math.round((Date.UTC(y2, m2 - 1, g2) - Date.UTC(y1, m1 - 1, g1)) / 86400000);
  },
  aggiungiGiorniKey(k, n) { return D.key(D.aggiungiGiorni(D.daKey(k), n)); },
  arrotondaSu(d, minuti) {
    const r = new Date(d.getTime()); r.setSeconds(0, 0);
    const m = D.minutiDelGiorno(r); const resto = m % minuti;
    if (resto) r.setMinutes(r.getMinutes() + (minuti - resto));
    return r;
  }
};

const F = {
  _euro: new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR' }),
  _gLungo: new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long' }),
  _gLungoAnno: new Intl.DateTimeFormat('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }),
  _gBreve: new Intl.DateTimeFormat('it-IT', { weekday: 'short', day: 'numeric', month: 'short' }),
  _data: new Intl.DateTimeFormat('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' }),
  _dataOra: new Intl.DateTimeFormat('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }),
  euro(cent) { return cent == null || cent === '' || Number.isNaN(cent) ? '' : F._euro.format(cent / 100); },
  giornoLungo(d) { const s = (d.getFullYear() === new Date().getFullYear() ? F._gLungo : F._gLungoAnno).format(d); return s.charAt(0).toUpperCase() + s.slice(1); },
  giornoMsg(d) { return F._gLungo.format(d); }, // per i messaggi: "martedì 7 ottobre"
  giornoBreve(d) { return F._gBreve.format(d); },
  data(d) { return d ? F._data.format(d) : ''; },
  dataKey(k) { return k ? F._data.format(D.daKey(k)) : ''; },
  dataOra(d) { return d ? F._dataOra.format(d) : ''; },
  ora(d) { return D.hhmm(d); },
  intervallo(a, b) { return `${D.hhmm(a)}–${D.hhmm(b)}`; },
  durata(min) { if (!min && min !== 0) return ''; const h = Math.floor(min / 60), m = min % 60; return h ? (m ? `${h} h ${m} min` : `${h} h`) : `${m} min`; },
  // "25,50" → 2550 centesimi; vuoto → null
  centDaTesto(s) {
    if (s == null) return null; let t = String(s).trim().replace(/[€\s]/g, '');
    if (!t) return null;
    if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
    const n = Number(t); return Number.isFinite(n) ? Math.round(n * 100) : null;
  },
  testoDaCent(c) { return c == null ? '' : (c / 100).toFixed(2).replace('.', ','); }
};

/* ===================== TELEFONI =====================
   Salviamo il numero in formato internazionale "+393331234567".
   - "+39 333 123 4567" o "0039…" → prefisso già presente
   - "333 1234567" (cellulare) → +39 3331234567
   - "06 12345678" (fisso) → +39 0612345678 (lo 0 del prefisso NON si toglie)
   - "393331234567" (12 cifre che iniziano con 39) → considerato già internazionale */
function normalizzaTelefono(raw, prefisso) {
  prefisso = String(prefisso || (cfg().attivita.prefissoInternazionale) || '39').replace(/\D/g, '');
  if (!raw) return '';
  const s = String(raw).trim();
  const cifre = s.replace(/\D/g, '');
  if (!cifre) return '';
  if (s.startsWith('+')) return '+' + cifre;
  if (cifre.startsWith('00')) return '+' + cifre.slice(2);
  if (cifre.startsWith(prefisso) && cifre.length >= prefisso.length + 9) return '+' + cifre;
  return '+' + prefisso + cifre;
}
function numeroWhatsApp(tel) { return normalizzaTelefono(tel).replace(/\D/g, ''); }
function telefonoLeggibile(tel) {
  if (!tel) return '';
  const m = /^\+39(\d+)$/.exec(tel);
  if (!m) return tel;
  const n = m[1];
  if (n.startsWith('3') && n.length === 10) return `+39 ${n.slice(0, 3)} ${n.slice(3, 6)} ${n.slice(6)}`;
  return `+39 ${n}`;
}
function linkWhatsApp(tel, testo) { const n = numeroWhatsApp(tel); return n ? `https://wa.me/${n}?text=${encodeURIComponent(testo || '')}` : ''; }
function compilaModello(modello, valori) { return String(modello || '').replace(/\{(\w+)\}/g, (m, k) => (k in valori ? valori[k] : m)); }

/* ===================== DATABASE (IndexedDB) =====================
   Archivi creati tutti subito (anche per i moduli delle fasi 2 e 3), così le prossime
   versioni del file non devono ristrutturare il database. */
const ARCHIVI = {
  impostazioni: [],
  meta: [],
  servizi: [],
  clienti: [],
  appuntamenti: ['inizio', 'clienteId'],
  blocchi: [],
  schede_lavoro: ['clienteId', 'data', 'appuntamentoId'],

  appunti: []
};

  appuntamenti: 'Appuntamenti', blocchi: 'Pause e chiusure', schede_lavoro: 'Schede lavoro', foto: 'Foto',
  prodotti: 'Prodotti', movimenti_magazzino: 'Movimenti magazzino', fornitori: 'Fornitori',
  ordini_fornitore: 'Ordini fornitore', appunti: 'Appunti'
};

let db = null;

function richiesta(req) {
  return new Promise((ok, ko) => { req.onsuccess = () => ok(req.result); req.onerror = () => ko(req.error); });
}
function fineTransazione(tx) {
  return new Promise((ok, ko) => { tx.oncomplete = () => ok(); tx.onerror = () => ko(tx.error); tx.onabort = () => ko(tx.error || new Error('Transazione annullata')); });
}

function apriDB() {
  return new Promise((ok, ko) => {
    if (!('indexedDB' in window)) { ko(new Error('Questo browser non supporta IndexedDB.')); return; }
    let r;
    try { r = indexedDB.open(IDB_NOME, IDB_VERSION); } catch (e) { ko(e); return; }
    r.onupgradeneeded = () => {
      const d = r.result; const tx = r.transaction;
      for (const [nome, indici] of Object.entries(ARCHIVI)) {
        const st = d.objectStoreNames.contains(nome) ? tx.objectStore(nome) : d.createObjectStore(nome, { keyPath: 'id' });
        for (const i of indici) if (!st.indexNames.contains(i)) st.createIndex(i, i);
      }
    };
    r.onsuccess = () => {
      const d = r.result;
      d.onversionchange = () => { d.close(); alert('L\'agenda è stata aggiornata in un\'altra scheda. Questa pagina verrà ricaricata.'); location.reload(); };
      ok(d);
    };
    r.onerror = () => ko(r.error);
    r.onblocked = () => ko(new Error('Il database è bloccato da un\'altra scheda aperta con una versione diversa dell\'agenda. Chiudi le altre schede e ricarica.'));
  });
}

/* Repository: unico punto di accesso ai dati per tutta l'interfaccia.
   In futuro si può sostituire con un backend di sincronizzazione mantenendo gli stessi metodi. */
function creaRepo(nome) {
  const st = (modo = 'readonly') => db.transaction(nome, modo).objectStore(nome);
  const timbra = (rec) => {
    const ora = new Date().toISOString();
    if (!rec.id) rec.id = uid();
    if (!rec.createdAt) rec.createdAt = ora;
    rec.updatedAt = ora;
    return rec;
  };
  return {
    nome,
    async get(id) { if (!id) return null; return (await richiesta(st().get(id))) ?? null; },
    async list({ archiviati = false } = {}) {
      const tutti = await richiesta(st().getAll());
      return archiviati ? tutti : tutti.filter((r) => !r.archiviato);
    },
    async soloArchiviati() { return (await richiesta(st().getAll())).filter((r) => r.archiviato); },
    async put(rec) {
      timbra(rec);
      const tx = db.transaction(nome, 'readwrite'); tx.objectStore(nome).put(rec);
      await fineTransazione(tx); emetti('dati', { archivio: nome }); return rec;
    },
    async putMany(recs) {
      if (!recs.length) return recs;
      const tx = db.transaction(nome, 'readwrite'); const s = tx.objectStore(nome);
      for (const r of recs) s.put(timbra(r));
      await fineTransazione(tx); emetti('dati', { archivio: nome }); return recs;
    },
    async delete(id) {
      const tx = db.transaction(nome, 'readwrite'); tx.objectStore(nome).delete(id);
      await fineTransazione(tx); emetti('dati', { archivio: nome });
    },
    async query(indice, range) { return richiesta(st().index(indice).getAll(range)); },
    async count() { return richiesta(st().count()); },
    async archivia(id) { const r = await this.get(id); if (r) { r.archiviato = true; r.archiviatoIl = new Date().toISOString(); await this.put(r); } return r; },
    async ripristina(id) { const r = await this.get(id); if (r) { r.archiviato = false; delete r.archiviatoIl; await this.put(r); } return r; }
  };
}
const Repo = Object.fromEntries(Object.keys(ARCHIVI).map((n) => [n, creaRepo(n)]));

async function leggiMeta(id, def = null) { const r = await Repo.meta.get(id); return r ? r.valore : def; }
async function scriviMeta(id, valore) { await Repo.meta.put({ id, valore }); }

/* ===================== MIGRAZIONI =====================
   MIGRAZIONI[n] porta i dati dalla versione n-1 alla n. Ricevono un oggetto
   { nomeArchivio: [record, ...] } e lo modificano. Usate sia all'avvio (dati nel
   database) sia nel ripristino di un backup di una versione precedente. */
const MIGRAZIONI = {
  1: (dati) => dati // versione iniziale: nessuna trasformazione
};
function migraDati(dati, daVersione) {
  for (let v = daVersione + 1; v <= SCHEMA_VERSION; v++) if (MIGRAZIONI[v]) MIGRAZIONI[v](dati);
  for (const nome of Object.keys(ARCHIVI)) if (!Array.isArray(dati[nome])) dati[nome] = [];
  return dati;
}
async function leggiTutto() {
  const dati = {};
  for (const nome of Object.keys(ARCHIVI)) dati[nome] = await richiesta(db.transaction(nome).objectStore(nome).getAll());
  return dati;
}
// Sostituisce TUTTO il contenuto del database in una sola transazione (o tutto o niente).
async function scriviTutto(dati) {
  const nomi = Object.keys(ARCHIVI);
  const tx = db.transaction(nomi, 'readwrite');
  for (const nome of nomi) {
    const s = tx.objectStore(nome); s.clear();
    for (const r of dati[nome] || []) s.put(r);
  }
  await fineTransazione(tx); emetti('dati', { archivio: '*' });
}
async function eseguiMigrazioniAvvio() {
  const versione = await leggiMeta('schemaVersion', null);
  if (versione === null) {
    const qualcosa = (await Repo.clienti.count()) + (await Repo.appuntamenti.count());
    await scriviMeta('schemaVersion', qualcosa ? 1 : SCHEMA_VERSION);
    if (!qualcosa) return;
  }
  const v = await leggiMeta('schemaVersion', SCHEMA_VERSION);
  if (v > SCHEMA_VERSION) throw new Error(`I dati salvati sono stati creati da una versione più recente dell'agenda (schema ${v}). Questo file è più vecchio (schema ${SCHEMA_VERSION}): usa il file aggiornato per non rischiare di perdere dati.`);
  if (v < SCHEMA_VERSION) {
    const dati = await leggiTutto();
    migraDati(dati, v);
    const m = dati.meta.find((x) => x.id === 'schemaVersion');
    if (m) m.valore = SCHEMA_VERSION; else dati.meta.push({ id: 'schemaVersion', valore: SCHEMA_VERSION });
    await scriviTutto(dati);
  }
}

function luminanza(hex) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(hex || '').trim()); if (!m) return 0.5;
  const n = parseInt(m[1], 16); const c = [(n >> 16) & 255, (n >> 8) & 255, n & 255].map((v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4; });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}
const testoSu = (hex) => (luminanza(hex) > 0.4 ? '#1d1516' : '#ffffff');
function applicaTema() {
  const c = cfg(); const r = document.documentElement;
  const b = c.brand || {};
  if (b.primario) r.style.setProperty('--primario', b.primario);
  if (b.secondario) r.style.setProperty('--secondario', b.secondario);
  if (b.accento) r.style.setProperty('--accento', b.accento);
  r.style.setProperty('--primario-testo', testoSu(b.primario || '#B4646E'));
  if (b.font && b.font !== 'system-ui') r.style.setProperty('--font', `${b.font}, system-ui, sans-serif`); else r.style.removeProperty('--font');
  let tema = c.tema;
  if (tema === 'auto') tema = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'scuro' : 'chiaro';
  r.dataset.tema = tema === 'scuro' ? 'scuro' : 'chiaro';
  // Intestazione

  const tbNome = $('#tb-nome'); if (tbNome) tbNome.textContent = nome;
  const logo = $('#tb-logo');
  if (logo) {
    logo.innerHTML = c.attivita.logo ? `<img src="${esc(c.attivita.logo)}" alt="" style="width:36px;height:36px;border-radius:10px;object-fit:cover">` : esc(nome.trim().charAt(0).toUpperCase() || 'A');
  }
}

/* ===================== TOAST (con "Annulla") ===================== */
function toast(messaggio, { azioni = [], durata, errore = false } = {}) {
  const el = document.createElement('div');
  el.className = 'toast' + (errore ? ' errore' : '');
  el.setAttribute('role', errore ? 'alert' : 'status');
  el.innerHTML = `<div class="msg">${esc(messaggio)}</div>`;
  let chiuso = false;
  const chiudi = () => { if (chiuso) return; chiuso = true; el.remove(); };
  for (const a of azioni) {
    const b = document.createElement('button'); b.className = 'btn btn-piccolo'; b.type = 'button'; b.textContent = a.testo;
    b.addEventListener('click', async () => { chiudi(); try { await a.azione(); } catch (e) { erroreUI(e); } });
    el.appendChild(b);
  }
  const x = document.createElement('button'); x.className = 'btn btn-piccolo'; x.type = 'button'; x.setAttribute('aria-label', 'Chiudi'); x.innerHTML = icona('chiudi');
  x.addEventListener('click', chiudi); el.appendChild(x);
  const cont = $('#toasts'); cont.appendChild(el);
  while (cont.children.length > 3) cont.firstElementChild.remove(); // al massimo 3 avvisi visibili
  setTimeout(chiudi, durata ?? (azioni.length ? 8000 : 3500));
  return chiudi;
}
function toastAnnulla(messaggio, annulla, altreAzioni = []) {

/* ===================== MODALI ===================== */
const modaliAperte = [];
function apriModale({ titolo, corpo = '', azioni = [], grande = false, onApri, chiudibile = true }) {
  const d = document.createElement('dialog');
  d.className = 'modale' + (grande ? ' grande' : '');
  d.innerHTML = `
    <div class="modale-testa"><h2>${esc(titolo)}</h2>${chiudibile ? `<button type="button" class="btn btn-ghost" data-chiudi aria-label="Chiudi">${icona('chiudi')}</button>` : ''}</div>
    <div class="modale-corpo"></div>
    <div class="modale-piede"></div>`;
  const corpoEl = $('.modale-corpo', d);
  if (typeof corpo === 'string') corpoEl.innerHTML = corpo; else if (corpo) corpoEl.appendChild(corpo);
  const piede = $('.modale-piede', d);
  let risolvi; const promessa = new Promise((r) => { risolvi = r; });
  let valore = null;
  const chiudi = (v = null) => { valore = v; if (d.open) d.close(); };
  d.addEventListener('close', () => { const i = modaliAperte.indexOf(d); if (i >= 0) modaliAperte.splice(i, 1); d.remove(); risolvi(valore); });
  d.addEventListener('cancel', (e) => { if (!chiudibile) e.preventDefault(); });
  $$('[data-chiudi]', d).forEach((b) => b.addEventListener('click', () => chiudi(null)));
  for (const a of azioni) {
    const b = document.createElement('button'); b.type = 'button';
    b.className = 'btn ' + (a.classe || ''); b.textContent = a.testo;
    if (a.id) b.dataset.azione = a.id;
    b.addEventListener('click', async () => {
      if (a.onClick) {

        catch (e) { erroreUI(e); }
        finally { b.disabled = false; }
      } else chiudi(a.valore ?? null);

    piede.appendChild(b);

  if (!azioni.length) piede.remove();
  document.body.appendChild(d);
  d.showModal();
  modaliAperte.push(d);
  if (onApri) { try { onApri({ el: d, corpo: corpoEl, chiudi }); } catch (e) { erroreUI(e); } }
  return { el: d, corpo: corpoEl, chiudi, promessa };
}

function conferma({ titolo = 'Conferma', messaggio = '', problemi = [], ok = 'Conferma', annulla = 'Annulla', pericolo = false, spuntaObbligatoria = '' }) {
  const corpo = `
    ${messaggio ? `<div>${messaggio}</div>` : ''}

    titolo, corpo,

/* ===================== FILE: scaricamento, foto ===================== */
function scaricaFile(nomeFile, contenuto, tipo = 'application/json') {
  const blob = contenuto instanceof Blob ? contenuto : new Blob([contenuto], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = nomeFile; a.rel = 'noopener';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000);
}
function leggiFileTesto(file) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsText(file); });
}
function scegliFile(accept) {
  return new Promise((ok) => {
    const i = document.createElement('input'); i.type = 'file'; i.accept = accept;
    i.addEventListener('change', () => ok(i.files && i.files[0] ? i.files[0] : null));

}
// Ridimensiona (lato lungo max) e comprime in JPEG lato client.
async function comprimiFoto(file, latoMax = 1280, qualita = 0.8) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) {
    bmp = await new Promise((ok, ko) => { const img = new Image(); const u = URL.createObjectURL(file); img.onload = () => { URL.revokeObjectURL(u); ok(img); }; img.onerror = () => { URL.revokeObjectURL(u); ko(new Error('Immagine non leggibile')); }; img.src = u; });
  }
  const w0 = bmp.width, h0 = bmp.height; const s = Math.min(1, latoMax / Math.max(w0, h0));
  const w = Math.round(w0 * s), h = Math.round(h0 * s);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', qualita));
  if (!blob) throw new Error('Compressione della foto non riuscita');
  return { blob, larghezza: w, altezza: h };
}
function blobADataURL(blob) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = () => ko(r.error); r.readAsDataURL(blob); });
}
function dataURLABlobSync(dataURL) {
  const [testa, dati] = dataURL.split(','); const mime = (/data:([^;]+)/.exec(testa) || [])[1] || 'application/octet-stream';
  const bin = atob(dati); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}

<script>
'use strict';
/* =====================================================================================
   LOGICA DI DOMINIO: servizi, appuntamenti, blocchi, conflitti, richiami, messaggi
   ===================================================================================== */

async function serviziAttivi() {
  const s = await Repo.servizi.list();
  return s.sort((a, b) => (a.categoria || '').localeCompare(b.categoria || '', 'it') || (a.ordine ?? 0) - (b.ordine ?? 0) || a.nome.localeCompare(b.nome, 'it'));
}
async function mappaServizi() { const m = new Map(); (await Repo.servizi.list({ archiviati: true })).forEach((s) => m.set(s.id, s)); return m; }
async function mappaClienti() { const m = new Map(); (await Repo.clienti.list({ archiviati: true })).forEach((c) => m.set(c.id, c)); return m; }

// Appuntamenti che toccano l'intervallo [da, a) — l'indice è sull'istante di inizio (ISO UTC, ordinabile)
async function appuntamentiTra(da, a, { archiviati = false } = {}) {
  const dalle = D.aggiungiGiorni(da, -1).toISOString(); // margine di un giorno per appuntamenti iniziati prima
  const alle = a.toISOString();
  const lista = await Repo.appuntamenti.query('inizio', IDBKeyRange.bound(dalle, alle, false, true));
  return lista.filter((x) => (archiviati || !x.archiviato) && new Date(x.fine) > da && new Date(x.inizio) < a);
}
async function appuntamentiCliente(clienteId) {
  return (await Repo.appuntamenti.query('clienteId', clienteId)).filter((x) => !x.archiviato).sort((a, b) => a.inizio.localeCompare(b.inizio));
}
async function schedeCliente(clienteId) {
  return (await Repo.schede_lavoro.query('clienteId', clienteId)).filter((x) => !x.archiviato).sort((a, b) => (b.data + (b.ora || '')).localeCompare(a.data + (a.ora || '')));
}

/* ----- Blocchi (pause, ferie, chiusure, impegni) -----
   Singolo: { inizio, fine } ISO. Ricorrente: { ricorrenza: { giorni:[0..6], oraInizio, oraFine, dal, al } }
   Restituisce le "istanze" concrete nell'intervallo. */
async function istanzeBlocchi(da, a) {
  const blocchi = await Repo.blocchi.list();
  const out = [];
  for (const b of blocchi) {
    if (b.ricorrenza) {
      const r = b.ricorrenza;
      let giorno = D.inizioGiorno(da); const ultimo = D.inizioGiorno(a);
      for (let i = 0; giorno <= ultimo && i < 800; i++, giorno = D.aggiungiGiorni(giorno, 1)) {
        const k = D.key(giorno);
        if (r.dal && k < r.dal) continue;
        if (r.al && k > r.al) break;
        if (!r.giorni.includes(giorno.getDay())) continue;
        const ini = D.combina(k, r.oraInizio), fin = D.combina(k, r.oraFine);
        if (fin > da && ini < a) out.push({ blocco: b, inizio: ini, fine: fin });
      }
    } else {
      const ini = new Date(b.inizio), fin = new Date(b.fine);
      if (fin > da && ini < a) out.push({ blocco: b, inizio: ini, fine: fin });
    }
  }
  return out;
}
function descriviBlocco(b) {
  const tipo = TIPI_BLOCCO[b.tipo] || 'Blocco';
  const t = b.titolo ? `${tipo}: ${b.titolo}` : tipo;
  if (b.ricorrenza) {
    const nomi = ['dom', 'lun', 'mar', 'mer', 'gio', 'ven', 'sab'];
    const g = [1, 2, 3, 4, 5, 6, 0].filter((x) => b.ricorrenza.giorni.includes(x)).map((x) => nomi[x]).join(', ');
    return `${t} — ogni ${g}, ${b.ricorrenza.oraInizio}–${b.ricorrenza.oraFine}${b.ricorrenza.al ? ` fino al ${F.dataKey(b.ricorrenza.al)}` : ''}`;
  }
  const i = new Date(b.inizio), f = new Date(b.fine);
  if (b.tuttoIlGiorno) {
    const ultimo = D.aggiungiGiorni(f, -1);
    return D.key(i) === D.key(ultimo) ? `${t} — ${F.giornoLungo(i)}` : `${t} — dal ${F.data(i)} al ${F.data(ultimo)}`;
  }
  return `${t} — ${F.giornoLungo(i)}, ${F.intervallo(i, f)}`;
}

/* ----- Cuscinetto: il più lungo tra i servizi dell'appuntamento (o quello generale) ----- */
function cuscinettoDi(servizi, mappaS) {
  const def = Number(cfg().agenda.cuscinettoMinuti) || 0;
  if (!servizi || !servizi.length) return def;
  return Math.max(...servizi.map((s) => {
    const att = mappaS && s.servizioId ? mappaS.get(s.servizioId) : null;
    const v = att && att.cuscinetto != null && att.cuscinetto !== '' ? att.cuscinetto : (s.cuscinetto != null && s.cuscinetto !== '' ? s.cuscinetto : def);
    return Number(v) || 0;
  }));
}

/* ----- Controllo di uno slot -----
   Contesto precaricato (appuntamenti, blocchi, servizi) per poter verificare molti slot
   velocemente ("Trova primo slot libero"). Restituisce un elenco di problemi; vuoto = slot libero. */
async function contestoAgenda(da, a) {
  const [apps, blocchi, mappaS, mappaC] = await Promise.all([appuntamentiTra(da, a), istanzeBlocchi(da, a), mappaServizi(), mappaClienti()]);
  return { apps, blocchi, mappaS, mappaC };
}
function controllaSlot(ctx, { inizio, fine, operatriceId, escludiId, servizi, ignoraPassato = false }) {
  const problemi = [];
  const c = cfg();
  if (!(fine > inizio)) { problemi.push({ tipo: 'durata', msg: 'La durata deve essere maggiore di zero.' }); return problemi; }
  if (!ignoraPassato && inizio < new Date(Date.now() - 60000)) problemi.push({ tipo: 'passato', msg: 'L\'orario è nel passato.' });

  // Orari di apertura
  if (c.orari) {
    const kIni = D.key(inizio), kFin = D.key(new Date(fine.getTime() - 1));
    const nomeG = GIORNI_NOME[D.giornoKey(inizio)];
    if (kIni !== kFin) problemi.push({ tipo: 'orario', msg: 'L\'appuntamento prosegue oltre la mezzanotte.' });
    else {
      const intervalli = (c.orari[D.giornoKey(inizio)] || []).map(([s, e]) => [D.minDaHHMM(s), D.minDaHHMM(e)]);
      const a = D.minutiDelGiorno(inizio); let f = D.minutiDelGiorno(fine); if (f === 0) f = 1440;
      if (!intervalli.length) problemi.push({ tipo: 'orario', msg: `${nomeG} è giorno di chiusura.` });
      else if (!intervalli.some(([s, e]) => a >= s && f <= e)) {
        const ord = [...intervalli].sort((x, y) => x[0] - y[0]);
        const testoOrari = ord.map(([s, e]) => `${D.hhmmDaMin(s)}–${D.hhmmDaMin(e)}`).join(' / ');
        // pause = spazi tra una fascia e la successiva
        const pause = []; for (let i = 1; i < ord.length; i++) if (ord[i][0] > ord[i - 1][1]) pause.push([ord[i - 1][1], ord[i][0]]);
        const pausa = pause.find(([s, e]) => a < e && f > s);
        if (pausa) problemi.push({ tipo: 'orario', msg: `L'appuntamento ${a < pausa[0] && f > pausa[1] ? 'è a cavallo della' : 'cade nella'} pausa (${D.hhmmDaMin(pausa[0])}–${D.hhmmDaMin(pausa[1])}). Orari di ${nomeG.toLowerCase()}: ${testoOrari}.` });
        else problemi.push({ tipo: 'orario', msg: `Fuori dall'orario di apertura (${nomeG.toLowerCase()}: ${testoOrari}).` });
      }
    }
  }
  // Blocchi
  for (const ib of ctx.blocchi) {
    if (ib.blocco.operatriceId && operatriceId && ib.blocco.operatriceId !== operatriceId) continue;
    if (ib.inizio < fine && ib.fine > inizio) problemi.push({ tipo: 'blocco', msg: `Si sovrappone a: ${descriviBlocco(ib.blocco)}.` });
  }
  // Altri appuntamenti
  const mio = cuscinettoDi(servizi, ctx.mappaS);
  for (const ap of ctx.apps) {
    if (ap.id === escludiId || !STATI_ATTIVI.includes(ap.stato)) continue;
    if (piuOperatrici() && operatriceId && ap.operatriceId && ap.operatriceId !== operatriceId) continue;
    const ai = new Date(ap.inizio), af = new Date(ap.fine);
    const nome = nomeCliente(ctx.mappaC.get(ap.clienteId)) || ap.clienteNome;
    if (ai < fine && af > inizio) { problemi.push({ tipo: 'sovrapposizione', msg: `Si sovrappone all'appuntamento di ${nome} (${F.intervallo(ai, af)}).` }); continue; }
    if (af <= inizio) {
      const serve = cuscinettoDi(ap.servizi, ctx.mappaS); const gap = D.minutiTra(af, inizio);
      if (gap < serve) problemi.push({ tipo: 'cuscinetto', msg: `Tra la fine dell'appuntamento di ${nome} (${D.hhmm(af)}) e questo ci sono ${gap} min: ne servono ${serve} per pulizia e sterilizzazione.` });
    } else if (ai >= fine) {
      const gap = D.minutiTra(fine, ai);
      if (gap < mio) problemi.push({ tipo: 'cuscinetto', msg: `Dopo questo appuntamento restano ${gap} min prima di quello di ${nome} (${D.hhmm(ai)}): ne servono ${mio} per pulizia e sterilizzazione.` });
    }
  }
  return problemi;
}
async function verificaSlot(slot) {
  const da = D.aggiungiGiorni(D.inizioGiorno(slot.inizio), -1);
  const a = D.aggiungiGiorni(D.inizioGiorno(slot.fine), 2);
  return controllaSlot(await contestoAgenda(da, a), slot);
}

/* ----- Trova primi slot liberi ----- */
async function trovaSlotLiberi({ durataMin, operatriceId, servizi, da = new Date(), quanti = 3, escludiId = null, giorniMax = 90 }) {
  const c = cfg();
  if (!c.orari) return { errore: 'Per cercare gli slot liberi imposta prima gli orari di apertura (Impostazioni → Orari).' };
  if (!(durataMin > 0)) return { errore: 'Indica almeno un servizio o una durata.' };
  const passo = Math.max(5, Number(c.agenda.slotMinuti) || 15);
  const partenza = D.arrotondaSu(new Date(Math.max(da.getTime(), Date.now())), passo);
  const fineFinestra = D.aggiungiGiorni(D.inizioGiorno(partenza), giorniMax + 1);
  const ctx = await contestoAgenda(D.aggiungiGiorni(D.inizioGiorno(partenza), -1), fineFinestra);
  const trovati = [];
  for (let g = 0; g <= giorniMax && trovati.length < quanti; g++) {
    const giorno = D.aggiungiGiorni(D.inizioGiorno(partenza), g); const k = D.key(giorno);
    for (const [s, e] of c.orari[D.giornoKey(giorno)] || []) {
      for (let m = D.minDaHHMM(s); m + durataMin <= D.minDaHHMM(e) && trovati.length < quanti; m += passo) {
        const ini = D.combina(k, D.hhmmDaMin(m));
        if (ini < partenza) continue;
        const fin = D.aggiungiMinuti(ini, durataMin);
        if (!controllaSlot(ctx, { inizio: ini, fine: fin, operatriceId, servizi, escludiId }).length) trovati.push(ini);
      }
    }
  }
  return { slot: trovati };
}

/* ----- Visite, incassi, statistiche -----
   Una "visita" è una scheda lavoro oppure un appuntamento completato senza scheda. */
async function tutteLeVisite() {
  const [schede, apps] = await Promise.all([Repo.schede_lavoro.list(), Repo.appuntamenti.list()]);
  const v = schede.map((s) => ({ data: s.data, clienteId: s.clienteId, importoCent: s.importoCent || 0, servizi: s.servizi || [], fonte: 'scheda', id: s.id }));
  for (const a of apps) if (a.stato === 'completato' && !a.schedaId) v.push({ data: D.key(new Date(a.inizio)), clienteId: a.clienteId, importoCent: a.prezzoTotaleCent || 0, servizi: a.servizi || [], fonte: 'appuntamento', id: a.id });
  return v;
}
function incassoTra(visite, daKey, aKey) { return visite.filter((v) => v.data >= daKey && v.data <= aKey).reduce((t, v) => t + (v.importoCent || 0), 0); }

async function statisticheCliente(clienteId) {
  const visite = (await tutteLeVisite()).filter((v) => v.clienteId === clienteId).sort((a, b) => a.data.localeCompare(b.data));
  const apps = await appuntamentiCliente(clienteId);
  const spesa = visite.reduce((t, v) => t + (v.importoCent || 0), 0);
  let freq = null;
  if (visite.length >= 2) {
    const giorni = []; for (let i = 1; i < visite.length; i++) giorni.push(D.diffGiorni(visite[i - 1].data, visite[i].data));
    freq = Math.round(giorni.reduce((a, b) => a + b, 0) / giorni.length);
  }
  return {
    visite: visite.length, spesaCent: spesa, frequenzaGiorni: freq,
    noShow: apps.filter((a) => a.stato === 'non_presentata').length,
    ultimaVisita: visite.length ? visite[visite.length - 1].data : null
  };
}

/* ----- Da ricontattare -----
   Per ogni cliente attiva: ultima visita, intervallo di richiamo più breve tra i servizi
   eseguiti quella volta; se trascorso e non c'è un appuntamento futuro → da ricontattare. */
async function clientiDaRicontattare() {
  const [clienti, visite, mappaS, apps] = await Promise.all([Repo.clienti.list(), tutteLeVisite(), mappaServizi(), Repo.appuntamenti.list()]);
  const ora = new Date().toISOString(); const oggi = D.oggiKey();
  const futuri = new Set(apps.filter((a) => a.inizio > ora && ['prenotato', 'confermato'].includes(a.stato)).map((a) => a.clienteId));
  const ultima = new Map();
  for (const v of visite) { const u = ultima.get(v.clienteId); if (!u || v.data > u.data) ultima.set(v.clienteId, v); }
  const out = [];
  for (const c of clienti) {
    const u = ultima.get(c.id); if (!u || futuri.has(c.id)) continue;
    const richiami = u.servizi.map((s) => { const att = mappaS.get(s.servizioId); const r = att ? att.richiamoGiorni : s.richiamoGiorni; return Number(r) || 0; }).filter((x) => x > 0);
    if (!richiami.length) continue;
    const giorniRichiamo = Math.min(...richiami);
    const scadenza = D.aggiungiGiorniKey(u.data, giorniRichiamo);
    if (scadenza <= oggi) out.push({ cliente: c, ultimaVisita: u.data, scadenza, ritardo: D.diffGiorni(scadenza, oggi), servizi: u.servizi.map((s) => s.nome).join(', ') });
  }
  return out.sort((a, b) => b.ritardo - a.ritardo);
}

/* ----- Messaggi WhatsApp ----- */
function valoriMessaggio(cliente, app) {
  const v = { nome: cliente ? (cliente.nome || '') : '', attivita: cfg().attivita.nome || '', giorno: '', ora: '', servizio: '' };

  return v;
}
function apriWhatsApp(cliente, testo) {

}
function promemoriaWhatsApp(cliente, app) { apriWhatsApp(cliente, compilaModello(cfg().messaggi.promemoria, valoriMessaggio(cliente, app))); }

/* ----- Esportazione .ics ----- */
function icsData(d) { return d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); }
function icsTesto(s) { return String(s || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/[,;]/g, (m) => '\\' + m); }
function esportaICS(app, cliente) {
  const titolo = `${nomeCliente(cliente) || app.clienteNome} — ${(app.servizi || []).map((s) => s.nome).join(' + ')}`;
  const righe = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Agenda Nails//IT', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH',
    'BEGIN:VEVENT', `UID:${app.id}@agenda-nails`, `DTSTAMP:${icsData(new Date())}`,
    `DTSTART:${icsData(new Date(app.inizio))}`, `DTEND:${icsData(new Date(app.fine))}`,
    `SUMMARY:${icsTesto(titolo)}`,
    cfg().attivita.nome ? `LOCATION:${icsTesto([cfg().attivita.nome, cfg().attivita.citta].filter(Boolean).join(', '))}` : null,
    app.note ? `DESCRIPTION:${icsTesto(app.note)}` : null,
    'END:VEVENT', 'END:VCALENDAR'
  ].filter(Boolean);
  scaricaFile(`appuntamento-${D.key(new Date(app.inizio))}-${D.hhmm(new Date(app.inizio)).replace(':', '')}.ics`, righe.join('\r\n'), 'text/calendar');
}

/* ----- Operazioni sugli appuntamenti ----- */
function durataApp(app) { return D.minutiTra(new Date(app.inizio), new Date(app.fine)); }
async function cambiaStato(app, nuovo, { conAnnulla = true } = {}) {
  const prec = app.stato;
  app.stato = nuovo; await Repo.appuntamenti.put(app);
  if (conAnnulla) toastAnnulla(`Stato: ${STATI[nuovo].nome}`, async () => { const a = await Repo.appuntamenti.get(app.id); a.stato = prec; await Repo.appuntamenti.put(a); });
  aggiornaVista();
}

<script>

let calendario = null;
const statoAgenda = { vista: null, data: null, operatrice: '', mostraAnnullati: null };

const LOCALE_IT = {

];

function limitiGriglia() {
  const o = cfg().orari; let min = 7 * 60, max = 21 * 60;
  if (o) {
    const tutti = Object.values(o).flat();
    if (tutti.length) {
      min = Math.min(...tutti.map(([s]) => D.minDaHHMM(s))) - 60;
      max = Math.max(...tutti.map(([, e]) => D.minDaHHMM(e))) + 60;
    }
  }
  min = Math.max(0, Math.floor(min / 60) * 60); max = Math.min(24 * 60, Math.ceil(max / 60) * 60);
  return { min, max };
}
function orariBusiness() {
  const o = cfg().orari; if (!o) return false;
  const out = [];
  GIORNI_KEY.forEach((k, i) => { for (const [s, e] of o[k] || []) out.push({ daysOfWeek: [i], startTime: s, endTime: e }); });
  return out.length ? out : false;
}
function coloreApp(app, mappaS) {
  if (app.stato === 'annullato') return STATI.annullato.colore;

  if (cfg().agenda.coloreEventiPer === 'stato') return STATI[app.stato]?.colore || '#777';
  const s = (app.servizi || [])[0];
  if (!s) return cfg().brand.primario;
  const att = mappaS.get(s.servizioId);
  return (att && att.colore) || s.colore || cfg().brand.primario;
}

async function vistaAgenda(el) {
  if (!window.FullCalendar || window.__fcErrore) {
    el.innerHTML = `<div class="card"><h1>Agenda non disponibile</h1>

  }
  const stretto = window.matchMedia('(max-width: 700px)').matches;
  if (!statoAgenda.vista) statoAgenda.vista = stretto ? cfg().agenda.vistaTelefono : cfg().agenda.vistaPredefinita;
  if (statoAgenda.mostraAnnullati === null) statoAgenda.mostraAnnullati = !!cfg().agenda.mostraAnnullati;

  el.innerHTML = `

      </div>
    </div>
    <div class="agenda-barra">
      <button class="btn btn-piccolo" type="button" id="ag-slot">Trova slot libero</button>
      <button class="btn btn-piccolo" type="button" id="ag-blocchi">Pause e chiusure</button>
      ${ops.length > 1 ? `<select id="ag-op" aria-label="Operatrice" style="width:auto"><option value="">Tutte le operatrici</option>${ops.map((o) => `<option value="${esc(o.id)}" ${statoAgenda.operatrice === o.id ? 'selected' : ''}>${esc(o.nome || 'Operatrice')}</option>`).join('')}</select>` : ''}
      <label class="check piccolo"><input type="checkbox" id="ag-annullati" ${statoAgenda.mostraAnnullati ? 'checked' : ''}> Mostra annullati</label>
      <span class="muted piccolo solo-largo">Tocca uno spazio libero per prenotare · tieni premuto un appuntamento per trascinarlo</span>
    </div>
    <div id="calendario"></div>
  </div>`;

  const { min, max } = limitiGriglia();
  let limiti = { min, max };
  const ora = new Date();
  calendario = new FullCalendar.Calendar($('#calendario', el), {
    locales: [LOCALE_IT], locale: 'it', firstDay: 1, timeZone: 'local',
    initialView: statoAgenda.vista, initialDate: statoAgenda.data || ora,
    headerToolbar: false, height: '100%', expandRows: false, stickyHeaderDates: true,
    allDaySlot: false, nowIndicator: true, navLinks: true,
    navLinkDayClick: (d) => { calendario.changeView('timeGridDay', d); },
    slotDuration: { minutes: Number(cfg().agenda.slotMinuti) || 15 },
    snapDuration: { minutes: Number(cfg().agenda.slotMinuti) || 15 },
    slotLabelInterval: { hours: 1 },
    slotMinTime: D.hhmmDaMin(min) + ':00', slotMaxTime: (max >= 1440 ? '24:00' : D.hhmmDaMin(max)) + ':00',
    scrollTime: D.hhmm(new Date(Math.max(D.combina(D.key(ora), D.hhmmDaMin(min)).getTime(), ora.getTime() - 3600000))) + ':00',
    slotLabelFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
    dayHeaderFormat: stretto ? { weekday: 'short', day: 'numeric' } : { weekday: 'short', day: 'numeric', month: 'numeric' },
    businessHours: orariBusiness(),
    editable: true, eventStartEditable: true, eventDurationEditable: true,
    selectable: true, selectMirror: true, selectMinDistance: 6, unselectAuto: true,
    longPressDelay: 400, eventLongPressDelay: 400, selectLongPressDelay: 600,
    dayMaxEvents: true, eventMinHeight: 22,
    events: (info, ok, ko) => {
      caricaEventi(info.start, info.end).then((r) => {
        ok(r.eventi);
        // Se ci sono appuntamenti fuori dalla griglia oraria (es. forzati), allarga la griglia
        const nMin = Math.min(limiti.min, r.minMin), nMax = Math.max(limiti.max, r.maxMin);
        if (nMin < limiti.min || nMax > limiti.max) {
          limiti = { min: Math.max(0, Math.floor(nMin / 60) * 60), max: Math.min(1440, Math.ceil(nMax / 60) * 60) };
          setTimeout(() => { if (!calendario) return; calendario.setOption('slotMinTime', D.hhmmDaMin(limiti.min) + ':00'); calendario.setOption('slotMaxTime', (limiti.max >= 1440 ? '24:00' : D.hhmmDaMin(limiti.max)) + ':00'); }, 0);
        }
      }).catch((e) => { ko(e); erroreUI(e); });
    },
    eventContent: (arg) => {
      if (arg.event.display === 'background') return undefined;
      const p = arg.event.extendedProps;
      if (p.tipo !== 'app') return undefined;
      const icone = `${p.avvertenze ? '⚠️ ' : ''}${p.acconto ? '💶 ' : ''}${p.demo ? '🧪 ' : ''}`;
      if (arg.view.type.startsWith('list')) {
        return { html: `<span>${icone}<strong>${esc(p.nomeCliente)}</strong> — ${esc(p.serviziTesto)} <span class="stato" style="background:${STATI[p.stato].colore}">${STATI[p.stato].nome}</span></span>` };
      }
      if (arg.view.type === 'dayGridMonth') return { html: `<div class="ev"><span class="ev-ora">${arg.timeText}</span> <span class="ev-tit">${icone}${esc(p.nomeCliente)}</span></div>` };
      return { html: `<div class="ev"><div class="ev-ora">${arg.timeText}</div><div class="ev-tit">${icone}${esc(p.nomeCliente)}</div><div class="ev-serv">${esc(p.serviziTesto)}</div></div>` };

  const op = $('#ag-op', el); if (op) op.addEventListener('change', () => { statoAgenda.operatrice = op.value; calendario.refetchEvents(); });

  return () => { if (calendario) { statoAgenda.data = calendario.getDate(); calendario.destroy(); calendario = null; } };
}

async function caricaEventi(da, a) {
  const [apps, blocchi, mappaS, mappaC] = await Promise.all([appuntamentiTra(da, a), istanzeBlocchi(da, a), mappaServizi(), mappaClienti()]);
  const eventi = []; let minMin = 1440, maxMin = 0;
  for (const app of apps) {
    if (!statoAgenda.mostraAnnullati && (app.stato === 'annullato')) continue;
    if (statoAgenda.operatrice && app.operatriceId && app.operatriceId !== statoAgenda.operatrice) continue;
    const cli = mappaC.get(app.clienteId);
    const col = coloreApp(app, mappaS);
    const ini = new Date(app.inizio), fin = new Date(app.fine);
    if (D.key(ini) === D.key(new Date(fin - 1))) { minMin = Math.min(minMin, D.minutiDelGiorno(ini)); maxMin = Math.max(maxMin, D.minutiDelGiorno(fin) || 1440); }
    eventi.push({
      id: app.id, start: ini, end: fin,
      backgroundColor: col, borderColor: col, textColor: testoSu(col),
      editable: !['completato', 'annullato', 'non_presentata'].includes(app.stato),
      extendedProps: {
        tipo: 'app', appId: app.id, stato: app.stato, demo: !!app.demo,
        nomeCliente: cli ? nomeCliente(cli) : (app.clienteNome || 'Cliente'),
        serviziTesto: (app.servizi || []).map((s) => (s.quantita > 1 ? `${s.nome} ×${s.quantita}` : s.nome)).join(' + ') || 'Nessun servizio',
        avvertenze: haAvvertenze(cli), acconto: (app.accontoCent || 0) > 0
      }
    });
  }
  for (const ib of blocchi) {
    if (statoAgenda.operatrice && ib.blocco.operatriceId && ib.blocco.operatriceId !== statoAgenda.operatrice) continue;
    eventi.push({
      id: `b-${ib.blocco.id}-${ib.inizio.getTime()}`, start: ib.inizio, end: ib.fine, display: 'background',
      title: (TIPI_BLOCCO[ib.blocco.tipo] || 'Blocco') + (ib.blocco.titolo ? `: ${ib.blocco.titolo}` : ''),
      backgroundColor: '#9aa0a6', extendedProps: { tipo: 'blocco', blocco: ib.blocco }
    });
  }
  return { eventi, minMin, maxMin };
}

function sceltaSuBlocco(istanze, quando) {
  const corpo = document.createElement('div');
  corpo.innerHTML = `<p>Questo orario è occupato da:</p>
    ${istanze.map((ib, i) => `<button type="button" class="btn btn-blocco" data-i="${i}" style="margin-bottom:8px;justify-content:flex-start;text-align:left">✏️ ${esc(descriviBlocco(ib.blocco))}</button>`).join('')}`;
  const m = apriModale({ titolo: 'Orario bloccato', corpo, azioni: [
    { testo: 'Chiudi' },
    { testo: 'Prenota comunque', classe: 'btn-primario', onClick: () => { setTimeout(() => apriModuloAppuntamento({ inizio: quando }), 0); return true; } }
  ] });
  $$('[data-i]', corpo).forEach((b) => b.addEventListener('click', () => { m.chiudi(); apriModuloBlocco({ blocco: istanze[Number(b.dataset.i)].blocco }); }));
}

/* ----- Spostamenti (trascinamento, ridimensionamento, pulsante "Sposta") ----- */
async function spostaDaCalendario(info) {
  try {
    const app = await Repo.appuntamenti.get(info.event.extendedProps.appId);
    if (!app) { info.revert(); return; }
    const ok = await gestisciSpostamento(app, info.event.start, info.event.end);
    if (!ok) info.revert();
  } catch (e) { info.revert(); erroreUI(e); }
}
async function gestisciSpostamento(app, nuovoInizio, nuovaFine) {
  const vecchioI = new Date(app.inizio), vecchioF = new Date(app.fine);
  const problemi = await verificaSlot({ inizio: nuovoInizio, fine: nuovaFine, operatriceId: app.operatriceId, escludiId: app.id, servizi: app.servizi });
  const cli = await Repo.clienti.get(app.clienteId);
  const nome = cli ? nomeCliente(cli) : app.clienteNome;
  const cambiaDurata = D.minutiTra(vecchioI, vecchioF) !== D.minutiTra(nuovoInizio, nuovaFine);
  const ok = await conferma({
    titolo: cambiaDurata && +vecchioI === +nuovoInizio ? 'Cambiare la durata?' : 'Spostare l\'appuntamento?',
    messaggio: `<p><strong>${esc(nome)}</strong> — ${esc((app.servizi || []).map((s) => s.nome).join(' + '))}</p>
      <dl class="kv"><dt>Prima</dt><dd>${esc(F.giornoLungo(vecchioI))}, ${F.intervallo(vecchioI, vecchioF)}</dd>
      <dt>Dopo</dt><dd><strong>${esc(F.giornoLungo(nuovoInizio))}, ${F.intervallo(nuovoInizio, nuovaFine)}</strong>${cambiaDurata ? ` (${F.durata(D.minutiTra(nuovoInizio, nuovaFine))})` : ''}</dd></dl>`,
    problemi, ok: problemi.length ? 'Sposta comunque' : 'Sposta'
  });
  if (!ok) return false;
  const prec = { inizio: app.inizio, fine: app.fine, durataManuale: app.durataManuale };
  app.inizio = nuovoInizio.toISOString(); app.fine = nuovaFine.toISOString();
  if (cambiaDurata) app.durataManuale = true;
  await Repo.appuntamenti.put(app);
  const altre = cli && cli.telefono && cfg().promemoriaWhatsApp ? [{ testo: 'Avvisa', azione: () => promemoriaWhatsApp(cli, app) }] : [];
  toastAnnulla('Appuntamento spostato', async () => { const a = await Repo.appuntamenti.get(app.id); Object.assign(a, prec); await Repo.appuntamenti.put(a); }, altre);
  aggiornaVista();
  return true;
}
function apriSposta(app) {
  const ini = new Date(app.inizio); const durata = durataApp(app);
  const passo = (Number(cfg().agenda.slotMinuti) || 15) * 60;
  const corpo = document.createElement('div');
  corpo.innerHTML = `
    <p class="muted">Ora: ${esc(F.giornoLungo(ini))}, ${F.intervallo(ini, new Date(app.fine))}</p>
    <div class="riga-campi">
      <div class="campo"><label for="sp-data">Nuova data</label><input type="date" id="sp-data" value="${D.key(ini)}"></div>
      <div class="campo"><label for="sp-ora">Nuovo orario</label><input type="time" id="sp-ora" step="${passo}" value="${D.hhmm(ini)}"></div>
      <div class="campo"><label for="sp-durata">Durata (min)</label><input type="number" id="sp-durata" min="5" step="5" inputmode="numeric" value="${durata}"></div>
    </div>
    <button type="button" class="btn" id="sp-trova">Trova primo slot libero da questa data</button>
    <div class="slot-suggeriti" id="sp-slot"></div>`;
  const leggi = () => {
    const k = $('#sp-data', corpo).value, h = $('#sp-ora', corpo).value, d = Number($('#sp-durata', corpo).value);
    if (!k || !h || !(d > 0)) { toast('Indica data, orario e durata.'); return null; }
    const i = D.combina(k, h); return { i, f: D.aggiungiMinuti(i, d) };
  };
  $('#sp-trova', corpo).addEventListener('click', async () => {
    const k = $('#sp-data', corpo).value || D.oggiKey();
    const r = await trovaSlotLiberi({ durataMin: Number($('#sp-durata', corpo).value), operatriceId: app.operatriceId, servizi: app.servizi, da: D.combina(k, '00:00'), escludiId: app.id, quanti: 6 });
    mostraSlotSuggeriti($('#sp-slot', corpo), r, (d) => { $('#sp-data', corpo).value = D.key(d); $('#sp-ora', corpo).value = D.hhmm(d); });
  });
  apriModale({ titolo: 'Sposta appuntamento', corpo, azioni: [
    { testo: 'Annulla' },
    { testo: 'Continua', classe: 'btn-primario', onClick: async () => { const v = leggi(); if (!v) return false; return gestisciSpostamento(app, v.i, v.f); } }
  ] });
}
function mostraSlotSuggeriti(cont, r, scegli) {
  cont.innerHTML = '';
  if (r.errore) { cont.innerHTML = `<div class="box box-avviso">${esc(r.errore)}</div>`; return; }
  if (!r.slot.length) { cont.innerHTML = '<div class="box box-avviso">Nessuno slot libero trovato nei prossimi 90 giorni.</div>'; return; }
  for (const d of r.slot) {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'chip';
    b.textContent = `${F.giornoBreve(d)} · ${D.hhmm(d)}`;
    b.addEventListener('click', () => { $$('.chip', cont).forEach((x) => x.setAttribute('aria-pressed', 'false')); b.setAttribute('aria-pressed', 'true'); scegli(d); });
    cont.appendChild(b);
  }
}

/* ----- Trova slot (dalla barra dell'agenda) ----- */
