name: agenda_nails
description: Agenda gestionale per nail artist ed estetiste (iOS e Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  sqflite: ^2.4.0
  path_provider: ^2.1.0
  path: ^1.9.0
  http: ^1.2.0
  cryptography: ^2.7.0
  image_picker: ^1.1.0
  share_plus: ^13.0.0
  file_selector: ^1.0.3
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/immagini/
  fonts:
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans_400Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans_500Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans_700Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Fraunces_600SemiBold.ttf
          weight: 600
